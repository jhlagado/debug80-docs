<svg xmlns="http://www.w3.org/2000/svg" width="840" height="350" viewBox="0 0 840 350" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">Current string contents occupy part of its reserved storage</title><desc id="figDesc">An eight-byte-capacity string has three live character positions holding Job and five unused positions. Current length bounds reads, while capacity limits growth.</desc>
<defs><style>
:root { --ink:#182329; --secondary:#43535b; --fill:#fff; --accent:#14607e; --tint:#eaf3f6; --muted:#f0f1f2; }
@media (prefers-color-scheme: dark) { :root { --ink:#e6e8ea; --secondary:#b8c3c8; --fill:#1c1f22; --accent:#74bdd6; --tint:#263b43; --muted:#292d30; } }
.bg {fill:var(--fill);} .cell {fill:var(--fill);stroke:var(--ink);stroke-width:1.5;} .active {fill:var(--tint);stroke:var(--accent);stroke-width:2;}
.empty {fill:var(--muted);stroke:var(--secondary);stroke-width:1.5;stroke-dasharray:5 4;}
.edge {fill:none;stroke:var(--accent);stroke-width:2;} .access {fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;}
.n {font:16px system-ui,-apple-system,sans-serif;fill:var(--ink);} .ns {font:14px system-ui,-apple-system,sans-serif;fill:var(--secondary);} .heading {font:600 18px system-ui,-apple-system,sans-serif;fill:var(--ink);}
</style><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<rect class="bg" width="840" height="350"/>
<text class="heading" x="24" y="32">A string reserves capacity and tracks its current length</text><text class="n" x="24" y="67">var label as string[8] = &quot;Job&quot;</text><rect class="active" x="24" y="115" width="86" height="62" rx="5"/><text class="n" x="38" y="141">J</text><text class="ns" x="67" y="204" text-anchor="middle">0</text><rect class="active" x="122" y="115" width="86" height="62" rx="5"/><text class="n" x="136" y="141">o</text><text class="ns" x="165" y="204" text-anchor="middle">1</text><rect class="active" x="220" y="115" width="86" height="62" rx="5"/><text class="n" x="234" y="141">b</text><text class="ns" x="263" y="204" text-anchor="middle">2</text><rect class="empty" x="318" y="115" width="86" height="62" rx="5"/><text class="n" x="332" y="141">unused</text><text class="ns" x="361" y="204" text-anchor="middle">3</text><rect class="empty" x="416" y="115" width="86" height="62" rx="5"/><text class="n" x="430" y="141">unused</text><text class="ns" x="459" y="204" text-anchor="middle">4</text><rect class="empty" x="514" y="115" width="86" height="62" rx="5"/><text class="n" x="528" y="141">unused</text><text class="ns" x="557" y="204" text-anchor="middle">5</text><rect class="empty" x="612" y="115" width="86" height="62" rx="5"/><text class="n" x="626" y="141">unused</text><text class="ns" x="655" y="204" text-anchor="middle">6</text><rect class="empty" x="710" y="115" width="86" height="62" rx="5"/><text class="n" x="724" y="141">unused</text><text class="ns" x="753" y="204" text-anchor="middle">7</text><text class="heading" x="24" y="248">length = 3</text><text class="heading" x="400" y="248">capacity = 8</text><text class="ns" x="24" y="285">Reading label[2] reaches b. Reading label[3] is outside the current contents.</text><text class="ns" x="24" y="317">Appending writes into remaining capacity and updates the length.</text>
</svg>
