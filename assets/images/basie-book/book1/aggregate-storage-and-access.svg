<svg xmlns="http://www.w3.org/2000/svg" width="720" height="395" viewBox="0 0 720 395" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Copying aggregate contents and passing access</title>
  <desc id="figDesc">The top panel shows a reading record copied into distinct destination storage. The bottom panel shows a caller binding and a writable routine parameter both providing access to one record. The parameter creates an access path, not another record.</desc>
  <defs>
    <style>
      :root { --ink: #111417; --secondary: #454b52; --fill: #ffffff; --accent: #14607e; --tint: #eaf3f6; --rule: #c8ccd0; }
      @media (prefers-color-scheme: dark) { :root { --ink: #e6e8ea; --secondary: #b3b9bf; --fill: #1c1f22; --accent: #5fa8c6; --tint: #263b43; --rule: #3d4348; } }
      .cell { fill: var(--fill); stroke: var(--ink); stroke-width: 1.5; }
      .shared { fill: var(--tint); stroke: var(--accent); stroke-width: 1.5; }
      .copy { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 5 3; }
      .access { fill: none; stroke: var(--accent); stroke-width: 2; }
      .rule { stroke: var(--rule); stroke-width: 1; }
      .t { font: 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .n { font: 15px system-ui, -apple-system, sans-serif; fill: var(--ink); }
      .ns { font: 13px system-ui, -apple-system, sans-serif; fill: var(--secondary); }
    </style>
    <marker id="copyArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker>
    <marker id="accessArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
  </defs>
  <text class="n" x="30" y="30">Aggregate assignment: two objects</text>
  <text class="ns" x="35" y="58">Source record</text>
  <rect class="cell" x="35" y="72" width="185" height="78" rx="3"/>
  <text class="t" x="52" y="103">value = 12</text>
  <text class="t" x="52" y="131">valid = true</text>
  <text class="ns" x="500" y="58">Destination record</text>
  <rect class="cell" x="500" y="72" width="185" height="78" rx="3"/>
  <text class="t" x="517" y="103">value = 12</text>
  <text class="t" x="517" y="131">valid = true</text>
  <path class="copy" d="M235,111 L483,111" marker-end="url(#copyArrow)"/>
  <text class="ns" x="360" y="91" text-anchor="middle">contents copied</text>
  <text class="ns" x="30" y="180">Changing the destination leaves the source unchanged.</text>
  <line class="rule" x1="30" y1="198" x2="690" y2="198"/>
  <text class="n" x="30" y="227">Aggregate argument: two paths to one object</text>
  <text class="n" x="35" y="278">Caller binding</text>
  <text class="ns" x="35" y="302">existing access</text>
  <text class="n" x="500" y="278">Writable parameter</text>
  <text class="ns" x="500" y="302">call-length access</text>
  <rect class="shared" x="255" y="250" width="190" height="80" rx="3"/>
  <text class="t" x="273" y="281">value = 12</text>
  <text class="t" x="273" y="310">valid = true</text>
  <path class="access" d="M172,281 L239,281" marker-end="url(#accessArrow)"/>
  <path class="access" d="M486,281 L460,281" marker-end="url(#accessArrow)"/>
  <text class="ns" x="30" y="363">The parameter refers to the same record. Its writes change that record.</text>
  <text class="ns" x="30" y="383">An access arrow grants no responsibility for releasing the object.</text>
</svg>
