<svg xmlns="http://www.w3.org/2000/svg" width="840" height="446" viewBox="0 0 840 446" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">An owning collection changes membership within fixed capacity</title><desc id="figDesc">Three optional owning array elements own jobs 7, 9 and 11. Taking the first job empties queue position zero and releases its pool slot. The other two ownership relationships are unchanged.</desc>
<defs><style>
:root { --ink:#182329; --secondary:#43535b; --fill:#fff; --accent:#14607e; --tint:#eaf3f6; --muted:#f0f1f2; }
@media (prefers-color-scheme: dark) { :root { --ink:#e6e8ea; --secondary:#b8c3c8; --fill:#1c1f22; --accent:#74bdd6; --tint:#263b43; --muted:#292d30; } }
.bg {fill:var(--fill);} .cell {fill:var(--fill);stroke:var(--ink);stroke-width:1.5;} .active {fill:var(--tint);stroke:var(--accent);stroke-width:2;}
.empty {fill:var(--muted);stroke:var(--secondary);stroke-width:1.5;stroke-dasharray:5 4;}
.edge {fill:none;stroke:var(--accent);stroke-width:2;} .access {fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;}
.n {font:16px system-ui,-apple-system,sans-serif;fill:var(--ink);} .ns {font:14px system-ui,-apple-system,sans-serif;fill:var(--secondary);} .heading {font:600 18px system-ui,-apple-system,sans-serif;fill:var(--ink);}
</style><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<rect class="bg" width="840" height="446"/>
<text class="heading" x="24" y="32">After adding three jobs</text><text class="heading" x="448" y="32">After taking the first job</text><rect class="active" x="24" y="67" width="176" height="58" rx="5"/><text class="n" x="38" y="93">queue[0] owns 7</text><rect class="cell" x="265" y="67" width="140" height="58" rx="5"/><text class="n" x="279" y="93">slot: job 7</text><path class="edge" d="M200 96 L265 96" marker-end="url(#head)"/><rect class="empty" x="448" y="67" width="176" height="58" rx="5"/><text class="n" x="462" y="93">queue[0] = none</text><rect class="empty" x="681" y="67" width="135" height="58" rx="5"/><text class="n" x="695" y="93">free slot</text><rect class="active" x="24" y="159" width="176" height="58" rx="5"/><text class="n" x="38" y="185">queue[1] owns 9</text><rect class="cell" x="265" y="159" width="140" height="58" rx="5"/><text class="n" x="279" y="185">slot: job 9</text><path class="edge" d="M200 188 L265 188" marker-end="url(#head)"/><rect class="active" x="448" y="159" width="176" height="58" rx="5"/><text class="n" x="462" y="185">queue[1] owns 9</text><rect class="cell" x="681" y="159" width="135" height="58" rx="5"/><text class="n" x="695" y="185">slot: job 9</text><path class="edge" d="M624 188 L681 188" marker-end="url(#head)"/><rect class="active" x="24" y="251" width="176" height="58" rx="5"/><text class="n" x="38" y="277">queue[2] owns 11</text><rect class="cell" x="265" y="251" width="140" height="58" rx="5"/><text class="n" x="279" y="277">slot: job 11</text><path class="edge" d="M200 280 L265 280" marker-end="url(#head)"/><rect class="active" x="448" y="251" width="176" height="58" rx="5"/><text class="n" x="462" y="277">queue[2] owns 11</text><rect class="cell" x="681" y="251" width="135" height="58" rx="5"/><text class="n" x="695" y="277">slot: job 11</text><path class="edge" d="M624 280 L681 280" marker-end="url(#head)"/><text class="ns" x="24" y="384">Taking a job transfers its owner into a call. The call returns a number and releases the record.</text><text class="ns" x="24" y="416">The array position becomes empty and the freed pool slot is available for a later job.</text>
</svg>
