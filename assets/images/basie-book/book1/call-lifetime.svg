<svg xmlns="http://www.w3.org/2000/svg" width="840" height="416" viewBox="0 0 840 416" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">A value survives the call that calculated it</title><desc id="figDesc">Three panels show persistent program variables, temporary parameter and local storage during amountDue, and a copied scalar result after that activation ends.</desc>
<defs><style>
:root { --ink:#182329; --secondary:#43535b; --fill:#fff; --accent:#14607e; --tint:#eaf3f6; --muted:#f0f1f2; }
@media (prefers-color-scheme: dark) { :root { --ink:#e6e8ea; --secondary:#b8c3c8; --fill:#1c1f22; --accent:#74bdd6; --tint:#263b43; --muted:#292d30; } }
.bg {fill:var(--fill);} .cell {fill:var(--fill);stroke:var(--ink);stroke-width:1.5;} .active {fill:var(--tint);stroke:var(--accent);stroke-width:2;}
.empty {fill:var(--muted);stroke:var(--secondary);stroke-width:1.5;stroke-dasharray:5 4;}
.edge {fill:none;stroke:var(--accent);stroke-width:2;} .access {fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;}
.n {font:16px system-ui,-apple-system,sans-serif;fill:var(--ink);} .ns {font:14px system-ui,-apple-system,sans-serif;fill:var(--secondary);} .heading {font:600 18px system-ui,-apple-system,sans-serif;fill:var(--ink);}
</style><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<rect class="bg" width="840" height="416"/>
<text class="heading" x="24" y="32">Before the call</text><text class="heading" x="306" y="32">During the call</text><text class="heading" x="590" y="32">After return</text><rect class="cell" x="24" y="58" width="230" height="98" rx="5"/><text class="n" x="38" y="84">Program storage</text><text class="n" x="38" y="107">subtotal = 120</text><text class="n" x="38" y="130">total = 0</text><rect class="cell" x="306" y="58" width="230" height="98" rx="5"/><text class="n" x="320" y="84">Program storage</text><text class="n" x="320" y="107">subtotal = 120</text><text class="n" x="320" y="130">total = 0</text><rect class="active" x="590" y="58" width="226" height="98" rx="5"/><text class="n" x="604" y="84">Program storage</text><text class="n" x="604" y="107">subtotal = 120</text><text class="n" x="604" y="130">total = 135</text><rect class="active" x="306" y="218" width="230" height="123" rx="5"/><text class="n" x="320" y="244">amountDue activation</text><text class="n" x="320" y="267">amount = 0 (copy)</text><text class="n" x="320" y="290">shipping = 15 (copy)</text><text class="n" x="320" y="313">due = 135</text><path class="access" d="M138 176 L306 218" marker-end="url(#head)"/><text class="ns" x="222.0" y="187.0" text-anchor="middle">copy arguments</text><path class="access" d="M536 254 L590 156" marker-end="url(#head)"/><text class="ns" x="563.0" y="195.0" text-anchor="middle">copy result</text><rect class="empty" x="590" y="218" width="226" height="80" rx="5"/><text class="n" x="604" y="244">Activation ends</text><text class="n" x="604" y="267">Local storage is gone</text><text class="ns" x="24" y="388">The program variables remain live. Only the number 135 survives the local result storage.</text>
</svg>
