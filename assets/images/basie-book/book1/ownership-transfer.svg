<svg xmlns="http://www.w3.org/2000/svg" width="840" height="335" viewBox="0 0 840 335" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">Ownership moves while the record stays put</title><desc id="figDesc">Before a move first owns job 7. Afterwards first is cleared and second owns the same record in the same pool slot. No second allocation is created.</desc>
<defs><style>
:root { --ink:#182329; --secondary:#43535b; --fill:#fff; --accent:#14607e; --tint:#eaf3f6; --muted:#f0f1f2; }
@media (prefers-color-scheme: dark) { :root { --ink:#e6e8ea; --secondary:#b8c3c8; --fill:#1c1f22; --accent:#74bdd6; --tint:#263b43; --muted:#292d30; } }
.bg {fill:var(--fill);} .cell {fill:var(--fill);stroke:var(--ink);stroke-width:1.5;} .active {fill:var(--tint);stroke:var(--accent);stroke-width:2;}
.empty {fill:var(--muted);stroke:var(--secondary);stroke-width:1.5;stroke-dasharray:5 4;}
.edge {fill:none;stroke:var(--accent);stroke-width:2;} .access {fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;}
.n {font:16px system-ui,-apple-system,sans-serif;fill:var(--ink);} .ns {font:14px system-ui,-apple-system,sans-serif;fill:var(--secondary);} .heading {font:600 18px system-ui,-apple-system,sans-serif;fill:var(--ink);}
</style><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<rect class="bg" width="840" height="335"/>
<text class="heading" x="24" y="32">Before move</text><text class="heading" x="448" y="32">After move</text><rect class="active" x="24" y="60" width="180" height="70" rx="5"/><text class="n" x="38" y="86">first</text><text class="n" x="38" y="109">owns job 7</text><rect class="cell" x="268" y="184" width="180" height="70" rx="5"/><text class="n" x="282" y="210">Pool slot</text><text class="n" x="282" y="233">Job(number = 7)</text><path class="edge" d="M114 130 L268 184" marker-end="url(#head)"/><text class="ns" x="191.0" y="147.0" text-anchor="middle">owns</text><rect class="empty" x="448" y="60" width="160" height="70" rx="5"/><text class="n" x="462" y="86">first</text><text class="n" x="462" y="109">cleared</text><rect class="active" x="646" y="60" width="170" height="70" rx="5"/><text class="n" x="660" y="86">second</text><text class="n" x="660" y="109">owns job 7</text><rect class="cell" x="596" y="184" width="220" height="70" rx="5"/><text class="n" x="610" y="210">Same pool slot</text><text class="n" x="610" y="233">Job(number = 7)</text><path class="edge" d="M731 130 L716 184" marker-end="url(#head)"/><text class="ns" x="448" y="157">move first transfers responsibility</text><text class="ns" x="24" y="305">The record stays where it is. Moving the handle does not copy or relocate the record.</text>
</svg>
