<svg xmlns="http://www.w3.org/2000/svg" width="840" height="395" viewBox="0 0 840 395" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">Temporary access does not transfer ownership</title><desc id="figDesc">The caller owning handle and callee record parameter reach one pool record. A solid arrow denotes ownership and a dashed arrow temporary access. The lease ends on return while the owner remains responsible.</desc>
<defs><style>
:root { --ink:#182329; --secondary:#43535b; --fill:#fff; --accent:#14607e; --tint:#eaf3f6; --muted:#f0f1f2; }
@media (prefers-color-scheme: dark) { :root { --ink:#e6e8ea; --secondary:#b8c3c8; --fill:#1c1f22; --accent:#74bdd6; --tint:#263b43; --muted:#292d30; } }
.bg {fill:var(--fill);} .cell {fill:var(--fill);stroke:var(--ink);stroke-width:1.5;} .active {fill:var(--tint);stroke:var(--accent);stroke-width:2;}
.empty {fill:var(--muted);stroke:var(--secondary);stroke-width:1.5;stroke-dasharray:5 4;}
.edge {fill:none;stroke:var(--accent);stroke-width:2;} .access {fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;}
.n {font:16px system-ui,-apple-system,sans-serif;fill:var(--ink);} .ns {font:14px system-ui,-apple-system,sans-serif;fill:var(--secondary);} .heading {font:600 18px system-ui,-apple-system,sans-serif;fill:var(--ink);}
</style><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<rect class="bg" width="840" height="395"/>
<text class="heading" x="24" y="32">Caller retains ownership</text><text class="heading" x="468" y="32">Callee receives temporary access</text><rect class="active" x="24" y="70" width="200" height="80" rx="5"/><text class="n" x="38" y="96">first</text><text class="n" x="38" y="119">owning handle</text><rect class="cell" x="288" y="210" width="250" height="80" rx="5"/><text class="n" x="302" y="236">Pool record</text><text class="n" x="302" y="259">Job(number = 7)</text><path class="edge" d="M124 150 L330 210" marker-end="url(#head)"/><text class="ns" x="227.0" y="170.0" text-anchor="middle">owns</text><rect class="cell" x="538" y="70" width="278" height="80" rx="5"/><text class="n" x="552" y="96">inspectJob(item as Job)</text><text class="n" x="552" y="119">read-only record parameter</text><path class="access" d="M677 150 L495 210" marker-end="url(#head)"/><text class="ns" x="586.0" y="170.0" text-anchor="middle">lease</text><text class="ns" x="24" y="338">On return the lease ends. The caller still owns the live record.</text><text class="ns" x="24" y="366">A var record parameter permits field writes, without transferring release responsibility.</text>
</svg>
