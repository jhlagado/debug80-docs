<svg xmlns="http://www.w3.org/2000/svg" width="840" height="441" viewBox="0 0 840 441" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">A bounded command becomes a job and a console report</title><desc id="figDesc">Command parsing produces a copied number. Allocation creates an owned Job, reporting leases its record to produce text, and main retains responsibility until release. Failure preserves an existing destination owner.</desc>
<defs><style>
:root { --ink:#182329; --secondary:#43535b; --fill:#fff; --accent:#14607e; --tint:#eaf3f6; --muted:#f0f1f2; }
@media (prefers-color-scheme: dark) { :root { --ink:#e6e8ea; --secondary:#b8c3c8; --fill:#1c1f22; --accent:#74bdd6; --tint:#263b43; --muted:#292d30; } }
.bg {fill:var(--fill);} .cell {fill:var(--fill);stroke:var(--ink);stroke-width:1.5;} .active {fill:var(--tint);stroke:var(--accent);stroke-width:2;}
.empty {fill:var(--muted);stroke:var(--secondary);stroke-width:1.5;stroke-dasharray:5 4;}
.edge {fill:none;stroke:var(--accent);stroke-width:2;} .access {fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;}
.n {font:16px system-ui,-apple-system,sans-serif;fill:var(--ink);} .ns {font:14px system-ui,-apple-system,sans-serif;fill:var(--secondary);} .heading {font:600 18px system-ui,-apple-system,sans-serif;fill:var(--ink);}
</style><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<rect class="bg" width="840" height="441"/>
<text class="heading" x="24" y="32">From command text to a reported result</text><rect class="cell" x="24" y="72" width="210" height="82" rx="5"/><text class="n" x="38" y="98">Command text</text><text class="n" x="38" y="121">&quot;double 123&quot;</text><rect class="cell" x="313" y="72" width="210" height="82" rx="5"/><text class="n" x="327" y="98">Parse and check</text><text class="n" x="327" y="121">number = 123</text><rect class="active" x="602" y="72" width="214" height="82" rx="5"/><text class="n" x="616" y="98">Allocate Job</text><text class="n" x="616" y="121">number = 246</text><path class="edge" d="M234 113 L313 113" marker-end="url(#head)"/><path class="edge" d="M523 113 L602 113" marker-end="url(#head)"/><rect class="active" x="602" y="235" width="214" height="82" rx="5"/><text class="n" x="616" y="261">Owner in main</text><text class="n" x="616" y="284">responsible for Job</text><path class="edge" d="M709 154 L709 235" marker-end="url(#head)"/><rect class="cell" x="313" y="235" width="210" height="82" rx="5"/><text class="n" x="327" y="261">reportJob</text><text class="n" x="327" y="284">temporary record lease</text><path class="access" d="M602 276 L523 276" marker-end="url(#head)"/><text class="ns" x="562.5" y="266.0" text-anchor="middle">access</text><rect class="cell" x="24" y="235" width="210" height="82" rx="5"/><text class="n" x="38" y="261">Console output</text><text class="n" x="38" y="284">&quot;Result: 246&quot;</text><path class="edge" d="M313 276 L234 276" marker-end="url(#head)"/><text class="ns" x="24" y="376">A parse or allocation failure leaves an existing assignment destination unchanged.</text><text class="ns" x="24" y="410">When main ends, its remaining owners release their jobs. Reporting does not consume them.</text>
</svg>
