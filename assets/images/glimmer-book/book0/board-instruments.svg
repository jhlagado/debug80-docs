  <text class="dimn" x="570" y="326" text-anchor="start" xml:space="preserve">six digits</text>
  <rect class="bx" x="24" y="352" width="190" height="52" rx="4"/>
  <text class="tb" x="119" y="372" text-anchor="middle" xml:space="preserve">text MsgHello</text>
  <text class="ts" x="119" y="390" text-anchor="middle" xml:space="preserve">"FANFARE"</text>
  <line class="none" x1="214" y1="378" x2="350" y2="378" marker-end="url(#ar)"/>
  <text class="ts" x="282" y="370" text-anchor="middle" xml:space="preserve">lcd_row</text>
  <rect class="bx" x="350" y="352" width="220" height="68" rx="3"/>
  <text class="ts" x="362" y="380" text-anchor="start" xml:space="preserve">FANFARE</text>
  <text class="ts" x="362" y="402" text-anchor="start" xml:space="preserve">LIVES 3</text>
  <text class="nb" x="590" y="382" text-anchor="start" xml:space="preserve">20x4 LCD</text>
  <rect class="bx" x="24" y="436" width="190" height="52" rx="4"/>
  <text class="tb" x="119" y="456" text-anchor="middle" xml:space="preserve">pulse Right</text>
  <text class="ts" x="119" y="474" text-anchor="middle" xml:space="preserve">bind key KEY_6</text>
  <line class="none" x1="350" y1="462" x2="214" y2="462" marker-end="url(#ar)"/>
  <text class="ts" x="282" y="454" text-anchor="middle" xml:space="preserve">GlimPollBindings</text>
