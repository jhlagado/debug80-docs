  <rect class="none" x="350" y="56" width="144" height="144" rx="4"/>
  <text class="nb" x="510" y="84" text-anchor="start" xml:space="preserve">8x8 RGB matrix</text>
  <text class="dimn" x="510" y="104" text-anchor="start" xml:space="preserve">64 pixels, three planes</text>
  <rect class="bx" x="24" y="216" width="190" height="52" rx="4"/>
  <text class="tb" x="119" y="236" text-anchor="middle" xml:space="preserve">sound Bounce</text>
  <text class="ts" x="119" y="254" text-anchor="middle" xml:space="preserve">len 8 div 3</text>
  <line class="none" x1="214" y1="242" x2="350" y2="242" marker-end="url(#ar)"/>
  <text class="ts" x="282" y="234" text-anchor="middle" xml:space="preserve">call Snd_Bounce</text>
  <circle class="none" cx="382" cy="242" r="20"/>
