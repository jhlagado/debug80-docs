  <path class="none" d="M410,230 Q419,242 410,254"/>
  <path class="none" d="M420,224 Q433,242 420,260"/>
  <text class="nb" x="510" y="238" text-anchor="start" xml:space="preserve">speaker</text>
  <text class="dimn" x="510" y="258" text-anchor="start" xml:space="preserve">one port bit, tapped by the scan</text>
  <rect class="bx" x="24" y="284" width="190" height="52" rx="4"/>
  <text class="tb" x="119" y="304" text-anchor="middle" xml:space="preserve">Score in HL</text>
