<svg xmlns="http://www.w3.org/2000/svg" width="720" height="382" viewBox="0 0 720 382" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">The two stages of a build</title>
  <desc id="figDesc">Stage one: main.glim enters the Glimmer compiler and generated assembly comes out. Stage two: the assembler turns that file into Intel HEX, a binary and a debug map, and the map points back at the .glim source.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #2a7139;
      --sig-bg: #2a71391a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #6cbb7e;
        --sig-bg: #6cbb7e26;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <rect class="bxq" x="24" y="56" width="672" height="84" rx="5"/>
  <text class="cap" x="40" y="92" text-anchor="start" xml:space="preserve">STAGE 1</text>
  <text class="dimn" x="40" y="110" text-anchor="start" xml:space="preserve">Glimmer</text>
  <rect class="bxs" x="130" y="72" width="130" height="52" rx="4"/>
  <text class="tb" x="195" y="102.5" text-anchor="middle" xml:space="preserve">main.glim</text>
  <line class="none" x1="260" y1="98" x2="310" y2="98" marker-end="url(#ar)"/>
  <rect class="bx" x="310" y="72" width="120" height="52" rx="4"/>
  <text class="tb" x="370" y="102.5" text-anchor="middle" xml:space="preserve">glimmer</text>
  <line class="none" x1="430" y1="98" x2="480" y2="98" marker-end="url(#ar)"/>
  <rect class="bx" x="480" y="72" width="160" height="52" rx="4"/>
  <text class="tb" x="560" y="102.5" text-anchor="middle" xml:space="preserve">main.main.asm</text>
  <path class="none" d="M560,124 V148 H210 V178" marker-end="url(#ar)"/>
  <rect class="bxq" x="24" y="160" width="672" height="150" rx="5"/>
  <text class="cap" x="40" y="196" text-anchor="start" xml:space="preserve">STAGE 2</text>
  <text class="dimn" x="40" y="214" text-anchor="start" xml:space="preserve">AZM</text>
  <rect class="bx" x="130" y="178" width="160" height="52" rx="4"/>
  <text class="tb" x="210" y="208.5" text-anchor="middle" xml:space="preserve">main.main.asm</text>
  <line class="none" x1="290" y1="204" x2="340" y2="204" marker-end="url(#ar)"/>
  <rect class="bx" x="340" y="178" width="120" height="52" rx="4"/>
  <text class="tb" x="400" y="208.5" text-anchor="middle" xml:space="preserve">azm</text>
  <rect class="bx" x="510" y="168" width="150" height="32" rx="3"/>
  <text class="ts" x="585" y="188" text-anchor="middle" xml:space="preserve">main.main.hex</text>
  <path class="none" d="M460,204 C486,204 486,184 510,184" marker-end="url(#ar)"/>
  <rect class="bx" x="510" y="210" width="150" height="32" rx="3"/>
  <text class="ts" x="585" y="230" text-anchor="middle" xml:space="preserve">main.main.bin</text>
  <path class="none" d="M460,204 C486,204 486,226 510,226" marker-end="url(#ar)"/>
  <rect class="bx" x="510" y="252" width="150" height="32" rx="3"/>
  <text class="ts" x="585" y="272" text-anchor="middle" xml:space="preserve">main.main.d8.json</text>
  <path class="none" d="M460,204 C486,204 486,268 510,268" marker-end="url(#ar)"/>
  <path class="sline" d="M585,284 V330 H92 V98 H124" marker-end="url(#arS)"/>
  <text class="dimn" x="110" y="326" text-anchor="start" xml:space="preserve">the debug map names the .glim line each address came from</text>
  <text class="dimn" x="24" y="358" text-anchor="start" xml:space="preserve">Two stages, one command. The map is why a breakpoint set in .glim stops in .glim.</text>
</svg>
