  <rect class="bx" x="40" y="222" width="150" height="30" rx="2"/>
  <text class="t" x="115" y="242" text-anchor="middle" xml:space="preserve">%01111110</text>
  <text class="dim" x="32" y="276" text-anchor="end" xml:space="preserve">+6</text>
  <rect class="bx" x="40" y="256" width="150" height="30" rx="2"/>
