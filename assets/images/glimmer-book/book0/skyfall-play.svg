  <text class="cap" x="380" y="74" text-anchor="start" xml:space="preserve">SCORE, SEVEN-SEGMENT</text>
  <rect class="bx" x="380" y="86" width="34" height="48" rx="2"/>
  <text class="t" x="397" y="116" text-anchor="middle" xml:space="preserve">0</text>
