  <text class="cap" x="380" y="154" text-anchor="start" xml:space="preserve">LCD</text>
  <rect class="bx" x="380" y="166" width="260" height="64" rx="3"/>
  <text class="ts" x="392" y="192" text-anchor="start" xml:space="preserve">CATCH THE BLOCKS</text>
  <text class="ts" x="392" y="214" text-anchor="start" xml:space="preserve">LIVES 3</text>
  <text class="dimn" x="380" y="262" text-anchor="start" xml:space="preserve">the drop falls one row every Gravity frames</text>
  <text class="dimn" x="380" y="282" text-anchor="start" xml:space="preserve">the paddle slides on held 4 and 6</text>
  <text class="dimn" x="380" y="302" text-anchor="start" xml:space="preserve">caught when DropX minus PadX is under 3</text>
  <text class="dimn" x="380" y="322" text-anchor="start" xml:space="preserve">yellow drop, green paddle on the board itself</text>
  <rect class="sig" x="380" y="347" width="13" height="13" rx="2"/>
  <text class="dimn" x="400" y="358" text-anchor="start" xml:space="preserve">the drop</text>
  <rect class="bx2" x="465.38" y="347" width="13" height="13" rx="2"/>
  <text class="dimn" x="485.38" y="358" text-anchor="start" xml:space="preserve">the paddle</text>
  <text class="dimn" x="40" y="400" text-anchor="start" xml:space="preserve">Every catch scores, chirps and writes Gravity one smaller. Three misses end the round.</text>
</svg>
