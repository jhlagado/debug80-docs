<svg xmlns="http://www.w3.org/2000/svg" width="720" height="298" viewBox="0 0 720 298" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Three cards joined in a loop</title>
  <desc id="figDesc">Splash leads to Playing on any key, Playing leads to GameOver when the clock reaches zero, and GameOver returns to Splash on any key once the restart gate is open.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #2a7139;
      --sig-bg: #2a71391a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #6cbb7e;
        --sig-bg: #6cbb7e26;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="60" y="40" text-anchor="start" xml:space="preserve">GATE: THREE CARDS, ONE LOOP</text>
  <text class="cap" x="16" y="106" text-anchor="start" xml:space="preserve">START</text>
  <line class="sline" x1="24" y1="120" x2="56" y2="120" marker-end="url(#arS)"/>
  <rect class="bxs" x="60" y="90" width="160" height="60" rx="4"/>
  <text class="t" x="140" y="124.5" text-anchor="middle" xml:space="preserve">Splash</text>
  <rect class="bx" x="280" y="90" width="160" height="60" rx="4"/>
  <text class="t" x="360" y="124.5" text-anchor="middle" xml:space="preserve">Playing</text>
  <rect class="bx" x="500" y="90" width="160" height="60" rx="4"/>
  <text class="t" x="580" y="124.5" text-anchor="middle" xml:space="preserve">GameOver</text>
  <text class="dimn" x="140" y="170" text-anchor="middle" xml:space="preserve">enter ShowSplash</text>
  <text class="dimn" x="360" y="170" text-anchor="middle" xml:space="preserve">enter StartRound</text>
  <text class="dimn" x="580" y="170" text-anchor="middle" xml:space="preserve">enter ShowFinal</text>
  <line class="none" x1="220" y1="120" x2="280" y2="120" marker-end="url(#ar)"/>
  <text class="ts" x="250" y="110" text-anchor="middle" xml:space="preserve">AnyKeyP</text>
  <text class="ts" x="250" y="142" text-anchor="middle" xml:space="preserve">goto</text>
  <line class="none" x1="440" y1="120" x2="500" y2="120" marker-end="url(#ar)"/>
  <text class="ts" x="470" y="110" text-anchor="middle" xml:space="preserve">TimeUp</text>
  <text class="ts" x="470" y="142" text-anchor="middle" xml:space="preserve">goto</text>
  <path class="none" d="M655,150 V210 H65 V150" marker-end="url(#ar)"/>
  <text class="dimn" x="360" y="226" text-anchor="middle" xml:space="preserve">AnyKeyP, once the gate is open</text>
  <text class="dimn" x="360" y="242" text-anchor="middle" xml:space="preserve">writes CurrentCard directly</text>
  <text class="dimn" x="60" y="274" text-anchor="start" xml:space="preserve">CurrentCard is the next-card register, and the first declared card is where the program starts.</text>
</svg>
