  <text class="ts" x="115" y="328" text-anchor="middle" xml:space="preserve">sine</text>
  <text class="ts" x="285" y="328" text-anchor="middle" xml:space="preserve">overshoot</text>
  <text class="ts" x="455" y="328" text-anchor="middle" xml:space="preserve">anticipation</text>
  <circle class="sig" cx="297.02" cy="205" r="3.5"/>
  <circle class="sig" cx="442.98" cy="313" r="3.5"/>
  <text class="cap" x="548" y="232" text-anchor="start" xml:space="preserve">HEADROOM</text>
  <text class="dimn" x="548" y="256" text-anchor="start" xml:space="preserve">overshoot runs past to,</text>
  <text class="dimn" x="548" y="272" text-anchor="start" xml:space="preserve">anticipation dips below</text>
  <text class="dimn" x="548" y="288" text-anchor="start" xml:space="preserve">from, so leave a column</text>
  <text class="dimn" x="548" y="304" text-anchor="start" xml:space="preserve">spare at that end.</text>
  <text class="dimn" x="40" y="364" text-anchor="start" xml:space="preserve">The compiler traces the shape at build time and writes one byte per step. The Z80 reads the table.</text>
</svg>
