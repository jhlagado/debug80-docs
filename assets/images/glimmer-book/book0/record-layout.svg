  <path class="rule" d="M608,220 V230 H672 V220"/>
  <text class="dimn" x="640" y="246" text-anchor="middle" xml:space="preserve">tile</text>
  <path class="rule" d="M300,258 V268 H674 V258"/>
  <text class="dimn" x="487" y="284" text-anchor="middle" xml:space="preserve">sizeof(Sprite) = 11</text>
  <text class="cap" x="24" y="320" text-anchor="start" xml:space="preserve">A TABLE OF RECORDS</text>
  <text class="dim" x="189" y="336" text-anchor="middle" xml:space="preserve">record 0</text>
  <text class="dim" x="519" y="336" text-anchor="middle" xml:space="preserve">record 1</text>
