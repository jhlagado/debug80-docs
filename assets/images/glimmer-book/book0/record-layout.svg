  <text class="dim" x="594" y="49" text-anchor="middle" xml:space="preserve">+7</text>
  <text class="dimn" x="24" y="124" text-anchor="start" xml:space="preserve">One name, one change flag, and the index is the row.</text>
  <text class="cap" x="24" y="164" text-anchor="start" xml:space="preserve">TYPE POINT</text>
  <rect class="bx" x="24" y="188" width="110" height="32" rx="2"/>
  <text class="t" x="79" y="208.5" text-anchor="middle" xml:space="preserve">x</text>
  <text class="dimn" x="79" y="234" text-anchor="middle" xml:space="preserve">offset x = 0</text>
  <rect class="bx" x="134" y="188" width="110" height="32" rx="2"/>
  <text class="t" x="189" y="208.5" text-anchor="middle" xml:space="preserve">y</text>
  <text class="dimn" x="189" y="234" text-anchor="middle" xml:space="preserve">offset y = 1</text>
  <text class="cap" x="300" y="164" text-anchor="start" xml:space="preserve">TYPE SPRITE</text>
