  <rect class="bx" x="640" y="188" width="34" height="32" rx="2"/>
  <path class="rule" d="M302,220 V230 H366 V220"/>
  <text class="dimn" x="334" y="246" text-anchor="middle" xml:space="preserve">pos</text>
  <path class="rule" d="M370,220 V230 H400 V220"/>
  <text class="dimn" x="385" y="246" text-anchor="middle" xml:space="preserve">speed</text>
  <path class="rule" d="M404,220 V230 H468 V220"/>
  <text class="dimn" x="436" y="246" text-anchor="middle" xml:space="preserve">score</text>
