  <text class="t" x="24" y="412" text-anchor="start" xml:space="preserve">Hero + 1 * sizeof(Sprite) + offset(Sprite, speed)</text>
  <text class="dimn" x="24" y="444" text-anchor="start" xml:space="preserve">Write the offsets as offsets and they follow the layout when it grows, without your touching a line.</text>
