  <polyline class="none" points="40,422 50,422 50,422 60,422 60,422 70,422 70,406 80,406 80,406 90,406 90,406 100,406 100,406 110,406 110,406 120,406 120,406 130,406 130,390 140,390 140,390 150,390 150,390 160,390 160,390 170,390 170,390 180,390 180,390 190,390 190,374 200,374 200,374 210,374 210,374 220,374 220,374 230,374 230,374 240,374 240,374 250,374 250,374 260,374 260,374 270,374 270,358 280,358 280,358 290,358 290,358 300,358 300,358 310,358 310,358 320,358 320,358 330,358 330,358 340,358 340,358 350,358 350,358 360,358 360,342 370,342 370,342 380,342 380,342 390,342 390,342 400,342 400,342 410,342 410,342 420,342 420,342 430,342 430,342 440,342 440,342 450,342 450,342 460,342 460,342 470,342 470,342 480,342 480,342 490,342 490,326 500,326 500,326 510,326 510,326 520,326 520,326 530,326 530,326 540,326 540,326 550,326 550,326 560,326 560,326 570,326 570,326 580,326 580,326 590,326 590,326 600,326 600,326 610,326 610,326 620,326 620,326 630,326 630,326 640,326 640,326 650,326 650,326 660,326 660,326 670,326 670,326 680,326"/>
  <polyline class="sline" points="40,422 50,422 50,422 60,422 60,406 70,406 70,406 80,406 80,390 90,390 90,390 100,390 100,390 110,390 110,374 120,374 120,374 130,374 130,374 140,374 140,358 150,358 150,358 160,358 160,358 170,358 170,358 180,358 180,342 190,342 190,342 200,342 200,342 210,342 210,342 220,342 220,342 230,342 230,342 240,342 240,326 250,326 250,326 260,326 260,326 270,326 270,326 280,326 280,326 290,326 290,326 300,326 300,326 310,326 310,326 320,326 320,326 330,326 330,326 340,326 340,326 350,326 350,310 360,310 360,310 370,310 370,310 380,310 380,310 390,310 390,310 400,310 400,310 410,310 410,310 420,310 420,310 430,310 430,310 440,310 440,310 450,310 450,310 460,310 460,310 470,310 470,310 480,310 480,326 490,326 490,326 500,326 500,326 510,326 510,326 520,326 520,326 530,326 530,326 540,326 540,326 550,326 550,326 560,326 560,326 570,326 570,326 580,326 580,326 590,326 590,326 600,326 600,326 610,326 610,326 620,326 620,326 630,326 630,326 640,326 640,326 650,326 650,326 660,326 660,326 670,326 670,326 680,326"/>
  <line class="dash" x1="280" y1="310" x2="280" y2="422"/>
  <line class="sline" x1="280" y1="386" x2="280" y2="332" marker-end="url(#arS)"/>
  <text class="dimn" x="288" y="330" text-anchor="start" xml:space="preserve">press PLUS at step 24 and the dot jumps to the new path</text>
  <text class="dim" x="40" y="440" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dim" x="200" y="440" text-anchor="middle" xml:space="preserve">16</text>
  <text class="dim" x="360" y="440" text-anchor="middle" xml:space="preserve">32</text>
  <text class="dim" x="520" y="440" text-anchor="middle" xml:space="preserve">48</text>
  <text class="dim" x="670" y="440" text-anchor="middle" xml:space="preserve">63</text>
  <text class="dimn" x="40" y="462" text-anchor="start" xml:space="preserve">ramp step</text>
  <rect class="bxq" x="150" y="453" width="13" height="13" rx="2"/>
  <text class="dimn" x="170" y="464" text-anchor="start" xml:space="preserve">Straight, linear</text>
  <rect class="bx" x="287.52" y="453" width="13" height="13" rx="2"/>
  <text class="dimn" x="307.52" y="464" text-anchor="start" xml:space="preserve">Glide, ease_out</text>
  <rect class="bxs" x="419.32" y="453" width="13" height="13" rx="2"/>
  <text class="dimn" x="439.32" y="464" text-anchor="start" xml:space="preserve">Spring, overshoot</text>
  <text class="dimn" x="40" y="490" text-anchor="start" xml:space="preserve">The ramp knows nothing about columns and the table knows nothing about frames.</text>
</svg>
