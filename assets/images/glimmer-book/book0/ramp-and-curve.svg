<svg xmlns="http://www.w3.org/2000/svg" width="720" height="514" viewBox="0 0 720 514" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">The ramp is the clock, the curve is the path</title>
  <desc id="figDesc">A ramp feeding a step number into a compute block and a curve table feeding the same block, the byte read at that step becoming the position CometX, and the three real tables plotted as staircases with a switch of curve mid-flight.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #2a7139;
      --sig-bg: #2a71391a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #6cbb7e;
        --sig-bg: #6cbb7e26;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="40" y="46" text-anchor="start" xml:space="preserve">THE CLOCK</text>
  <text class="cap" x="510" y="46" text-anchor="start" xml:space="preserve">THE PATH</text>
  <rect class="bx" x="40" y="60" width="190" height="64" rx="4"/>
  <text class="tb" x="135" y="80" text-anchor="middle" xml:space="preserve">ramp Travel</text>
  <text class="ts" x="135" y="98" text-anchor="middle" xml:space="preserve">steps 64 -&gt; Landed</text>
  <text class="ts" x="135" y="114" text-anchor="middle" xml:space="preserve">one step per frame</text>
  <rect class="bx" x="290" y="60" width="160" height="64" rx="4"/>
  <text class="tb" x="370" y="80" text-anchor="middle" xml:space="preserve">TrackComet</text>
  <text class="ts" x="370" y="98" text-anchor="middle" xml:space="preserve">a compute block</text>
  <rect class="bx" x="510" y="60" width="190" height="64" rx="4"/>
  <text class="tb" x="605" y="80" text-anchor="middle" xml:space="preserve">curve Glide</text>
  <text class="ts" x="605" y="98" text-anchor="middle" xml:space="preserve">ease_out steps 64</text>
  <text class="ts" x="605" y="114" text-anchor="middle" xml:space="preserve">from 0 to 6</text>
  <line class="none" x1="230" y1="92" x2="290" y2="92" marker-end="url(#ar)"/>
  <line class="none" x1="510" y1="92" x2="450" y2="92" marker-end="url(#ar)"/>
  <text class="dimn" x="260" y="84" text-anchor="middle" xml:space="preserve">the step</text>
  <text class="dimn" x="480" y="84" text-anchor="middle" xml:space="preserve">one byte</text>
  <text class="cap" x="40" y="152" text-anchor="start" xml:space="preserve">CURVE_GLIDE, ONE BYTE PER STEP</text>
  <rect class="bx" x="40" y="176" width="56" height="30" rx="2"/>
  <text class="t" x="68" y="195.5" text-anchor="middle" xml:space="preserve">3</text>
  <text class="dim" x="68" y="169" text-anchor="middle" xml:space="preserve">16</text>
  <rect class="bx" x="96" y="176" width="56" height="30" rx="2"/>
  <text class="t" x="124" y="195.5" text-anchor="middle" xml:space="preserve">3</text>
  <text class="dim" x="124" y="169" text-anchor="middle" xml:space="preserve">17</text>
  <rect class="bx" x="152" y="176" width="56" height="30" rx="2"/>
  <text class="t" x="180" y="195.5" text-anchor="middle" xml:space="preserve">3</text>
  <text class="dim" x="180" y="169" text-anchor="middle" xml:space="preserve">18</text>
  <rect class="bx" x="208" y="176" width="56" height="30" rx="2"/>
  <text class="t" x="236" y="195.5" text-anchor="middle" xml:space="preserve">3</text>
  <text class="dim" x="236" y="169" text-anchor="middle" xml:space="preserve">19</text>
  <rect class="bxs" x="264" y="176" width="56" height="30" rx="2"/>
  <text class="tb" x="292" y="195.5" text-anchor="middle" xml:space="preserve">3</text>
  <text class="dim" x="292" y="169" text-anchor="middle" xml:space="preserve">20</text>
  <text class="dimn" x="292" y="220" text-anchor="middle" xml:space="preserve">Travel = 20</text>
  <rect class="bx" x="320" y="176" width="56" height="30" rx="2"/>
  <text class="t" x="348" y="195.5" text-anchor="middle" xml:space="preserve">3</text>
  <text class="dim" x="348" y="169" text-anchor="middle" xml:space="preserve">21</text>
  <rect class="bx" x="376" y="176" width="56" height="30" rx="2"/>
  <text class="t" x="404" y="195.5" text-anchor="middle" xml:space="preserve">3</text>
  <text class="dim" x="404" y="169" text-anchor="middle" xml:space="preserve">22</text>
  <rect class="bx" x="432" y="176" width="56" height="30" rx="2"/>
  <text class="t" x="460" y="195.5" text-anchor="middle" xml:space="preserve">4</text>
  <text class="dim" x="460" y="169" text-anchor="middle" xml:space="preserve">23</text>
  <line class="sline" x1="496" y1="192" x2="540" y2="192" marker-end="url(#arS)"/>
  <rect class="bx" x="540" y="174" width="140" height="36" rx="4"/>
  <text class="tb" x="610" y="196.5" text-anchor="middle" xml:space="preserve">CometX = 3</text>
  <text class="dimn" x="540" y="230" text-anchor="start" xml:space="preserve">the column to plot</text>
  <text class="cap" x="40" y="290" text-anchor="start" xml:space="preserve">THE THREE TABLES, PLOTTED</text>
  <rect class="bxq" x="40" y="310" width="640" height="112" rx="3"/>
  <text class="dim" x="32" y="426" text-anchor="end" xml:space="preserve">0</text>
  <text class="dim" x="32" y="410" text-anchor="end" xml:space="preserve">1</text>
  <text class="dim" x="32" y="394" text-anchor="end" xml:space="preserve">2</text>
  <text class="dim" x="32" y="378" text-anchor="end" xml:space="preserve">3</text>
  <text class="dim" x="32" y="362" text-anchor="end" xml:space="preserve">4</text>
  <text class="dim" x="32" y="346" text-anchor="end" xml:space="preserve">5</text>
  <text class="dim" x="32" y="330" text-anchor="end" xml:space="preserve">6</text>
  <text class="dim" x="32" y="314" text-anchor="end" xml:space="preserve">7</text>
