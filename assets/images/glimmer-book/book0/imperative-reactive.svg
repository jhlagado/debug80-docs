<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Writing a frame by hand against declaring one</title>
  <desc id="figDesc">Two panels. On the left a hand-written frame loop listing seven ordered steps. On the right three Glimmer declarations, with the generated frame calling each one.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #2a7139;
      --sig-bg: #2a71391a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #6cbb7e;
        --sig-bg: #6cbb7e26;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="20" y="26" text-anchor="start" xml:space="preserve">BY HAND</text>
  <rect class="bxq" x="20" y="38" width="320" height="244" rx="4"/>
  <text class="tb" x="34" y="62" text-anchor="start" xml:space="preserve">MainLoop:</text>
  <text class="t" x="46" y="88" text-anchor="start" xml:space="preserve">scan the keypad</text>
  <text class="t" x="46" y="114" text-anchor="start" xml:space="preserve">update the repeat counter</text>
  <text class="t" x="46" y="140" text-anchor="start" xml:space="preserve">move the dot</text>
  <text class="t" x="46" y="166" text-anchor="start" xml:space="preserve">clear the framebuffer</text>
  <text class="t" x="46" y="192" text-anchor="start" xml:space="preserve">plot the dot</text>
  <text class="t" x="46" y="218" text-anchor="start" xml:space="preserve">light one matrix row</text>
  <text class="t" x="46" y="244" text-anchor="start" xml:space="preserve">jp MainLoop</text>
  <text class="cap" x="380" y="26" text-anchor="start" xml:space="preserve">IN GLIMMER</text>
  <rect class="bxq" x="380" y="38" width="320" height="244" rx="4"/>
  <rect class="bx" x="392" y="60" width="80" height="200" rx="4"/>
  <text class="nb" x="432" y="164.5" text-anchor="middle" xml:space="preserve">the frame</text>
  <rect class="bx" x="506" y="60" width="182" height="52" rx="3"/>
  <text class="ts" x="518" y="82" text-anchor="start" xml:space="preserve">bind key KEY_6 rising</text>
  <text class="ts" x="518" y="98" text-anchor="start" xml:space="preserve">-&gt; Right</text>
  <line class="none" x1="472" y1="86" x2="506" y2="86" marker-end="url(#ar)"/>
  <rect class="bx" x="506" y="134" width="182" height="52" rx="3"/>
  <text class="ts" x="518" y="156" text-anchor="start" xml:space="preserve">effect MoveRight</text>
  <text class="ts" x="518" y="172" text-anchor="start" xml:space="preserve">on Right</text>
  <line class="none" x1="472" y1="160" x2="506" y2="160" marker-end="url(#ar)"/>
  <rect class="bx" x="506" y="208" width="182" height="52" rx="3"/>
  <text class="ts" x="518" y="230" text-anchor="start" xml:space="preserve">render DrawDot</text>
  <text class="ts" x="518" y="246" text-anchor="start" xml:space="preserve">on DotX</text>
  <line class="none" x1="472" y1="234" x2="506" y2="234" marker-end="url(#ar)"/>
  <text class="dimn" x="20" y="306" text-anchor="start" xml:space="preserve">You write every step, and its order.</text>
  <text class="dimn" x="380" y="306" text-anchor="start" xml:space="preserve">You declare when; the frame decides the order.</text>
  <text class="dimn" x="20" y="336" text-anchor="start" xml:space="preserve">The same program either way. What moves is the responsibility for the order.</text>
</svg>
