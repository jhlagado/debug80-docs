<svg xmlns="http://www.w3.org/2000/svg" width="720" height="286" viewBox="0 0 720 286" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">One key press followed through the reactive chain</title>
  <desc id="figDesc">Six stages in a row, key, pulse, effect, state change, render and pixel. Above each stage is the declaration that creates it; below it is the step that runs, joined by the bind, on and updates connections.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #2a7139;
      --sig-bg: #2a71391a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #6cbb7e;
        --sig-bg: #6cbb7e26;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="11" y="40" text-anchor="start" xml:space="preserve">WHAT YOU DECLARE</text>
  <rect class="bxq" x="11" y="56" width="106" height="62" rx="3"/>
  <text class="dimn" x="64" y="92" text-anchor="middle" xml:space="preserve">hardware</text>
  <rect class="bx" x="125" y="56" width="106" height="62" rx="3"/>
  <text class="ts" x="178" y="78" text-anchor="middle" xml:space="preserve">pulse Right</text>
  <path class="dash" d="M178,118 V150" marker-end="url(#arD)"/>
  <rect class="bx" x="239" y="56" width="106" height="62" rx="3"/>
  <text class="ts" x="292" y="78" text-anchor="middle" xml:space="preserve">effect MoveRight</text>
  <text class="ts" x="292" y="94" text-anchor="middle" xml:space="preserve">on Right</text>
  <text class="ts" x="292" y="110" text-anchor="middle" xml:space="preserve">updates DotX</text>
  <path class="dash" d="M292,118 V150" marker-end="url(#arD)"/>
  <rect class="bx" x="353" y="56" width="106" height="62" rx="3"/>
  <text class="ts" x="406" y="78" text-anchor="middle" xml:space="preserve">state DotX</text>
  <text class="ts" x="406" y="94" text-anchor="middle" xml:space="preserve">= 3 changed</text>
  <path class="dash" d="M406,118 V150" marker-end="url(#arD)"/>
  <rect class="bx" x="467" y="56" width="106" height="62" rx="3"/>
  <text class="ts" x="520" y="78" text-anchor="middle" xml:space="preserve">render DrawDot</text>
  <text class="ts" x="520" y="94" text-anchor="middle" xml:space="preserve">on DotX</text>
  <path class="dash" d="M520,118 V150" marker-end="url(#arD)"/>
  <rect class="bxq" x="581" y="56" width="106" height="62" rx="3"/>
  <text class="dimn" x="634" y="92" text-anchor="middle" xml:space="preserve">hardware</text>
  <text class="cap" x="11" y="142" text-anchor="start" xml:space="preserve">WHAT RUNS</text>
  <rect class="bx" x="24" y="150" width="80" height="48" rx="4"/>
  <text class="t" x="64" y="178.5" text-anchor="middle" xml:space="preserve">key 6 down</text>
  <rect class="bx" x="138" y="150" width="80" height="48" rx="4"/>
  <text class="t" x="178" y="178.5" text-anchor="middle" xml:space="preserve">Right</text>
  <rect class="bxs" x="252" y="150" width="80" height="48" rx="4"/>
  <text class="t" x="292" y="178.5" text-anchor="middle" xml:space="preserve">MoveRight</text>
  <rect class="bx" x="366" y="150" width="80" height="48" rx="4"/>
  <text class="t" x="406" y="178.5" text-anchor="middle" xml:space="preserve">DotX</text>
  <rect class="bxs" x="480" y="150" width="80" height="48" rx="4"/>
  <text class="t" x="520" y="178.5" text-anchor="middle" xml:space="preserve">DrawDot</text>
  <rect class="bx" x="594" y="150" width="80" height="48" rx="4"/>
  <text class="t" x="634" y="178.5" text-anchor="middle" xml:space="preserve">a pixel</text>
  <line class="none" x1="104" y1="174" x2="138" y2="174" marker-end="url(#ar)"/>
  <text class="dimn" x="121" y="168" text-anchor="middle" xml:space="preserve">bind</text>
  <line class="none" x1="218" y1="174" x2="252" y2="174" marker-end="url(#ar)"/>
  <text class="dimn" x="235" y="168" text-anchor="middle" xml:space="preserve">on</text>
  <line class="none" x1="332" y1="174" x2="366" y2="174" marker-end="url(#ar)"/>
  <text class="dimn" x="349" y="168" text-anchor="middle" xml:space="preserve">updates</text>
  <line class="none" x1="446" y1="174" x2="480" y2="174" marker-end="url(#ar)"/>
  <text class="dimn" x="463" y="168" text-anchor="middle" xml:space="preserve">on</text>
  <line class="none" x1="560" y1="174" x2="594" y2="174" marker-end="url(#ar)"/>
  <text class="dimn" x="577" y="168" text-anchor="middle" xml:space="preserve">FbPlot</text>
  <rect class="bxs" x="24" y="223" width="13" height="13" rx="2"/>
  <text class="dimn" x="44" y="234" text-anchor="start" xml:space="preserve">the code you write</text>
  <rect class="bx" x="172.96" y="223" width="13" height="13" rx="2"/>
  <text class="dimn" x="192.96" y="234" text-anchor="start" xml:space="preserve">the machinery</text>
  <text class="dimn" x="24" y="262" text-anchor="start" xml:space="preserve">You never call a block. You write it, and a change to a fact schedules it.</text>
</svg>
