<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Canvas as a dependency graph, with two faults marked</title>
  <desc id="figDesc">Raisers on the left, facts in the centre, triggered blocks on the right. The edge from PaintPixel to Marks is broken because the header stopped declaring it, and DrawCanvas carries a register-contract error on a call to FbPlot.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #2a7139;
      --sig-bg: #2a71391a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #6cbb7e;
        --sig-bg: #6cbb7e26;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="24" y="32" text-anchor="start" xml:space="preserve">RAISED BY</text>
  <text class="cap" x="276" y="32" text-anchor="start" xml:space="preserve">FACTS</text>
  <text class="cap" x="500" y="32" text-anchor="start" xml:space="preserve">TRIGGERS</text>
  <rect class="bx" x="24" y="48" width="190" height="64" rx="3"/>
  <text class="ts" x="119" y="70" text-anchor="middle" xml:space="preserve">four move effects</text>
  <text class="dim" x="119" y="90" text-anchor="middle" xml:space="preserve">MoveUp .. MoveRight</text>
  <rect class="bx" x="24" y="140" width="190" height="44" rx="3"/>
  <text class="ts" x="119" y="167" text-anchor="middle" xml:space="preserve">effect PaintPixel</text>
  <rect class="bx" x="276" y="48" width="180" height="44" rx="3"/>
  <text class="t" x="366" y="75" text-anchor="middle" xml:space="preserve">Cursor : Point</text>
  <rect class="bx" x="276" y="112" width="180" height="44" rx="3"/>
  <text class="t" x="366" y="139" text-anchor="middle" xml:space="preserve">Picture : byte[8]</text>
  <rect class="bxs" x="276" y="176" width="180" height="44" rx="3"/>
  <text class="tb" x="366" y="203" text-anchor="middle" xml:space="preserve">Marks : byte</text>
  <text class="dim" x="276" y="240" text-anchor="start" xml:space="preserve">raised by: (nothing)</text>
  <rect class="bx" x="500" y="66" width="190" height="44" rx="3"/>
  <text class="t" x="595" y="93" text-anchor="middle" xml:space="preserve">render DrawCanvas</text>
  <text class="dim" x="500" y="128" text-anchor="start" xml:space="preserve">inc b after call FbPlot</text>
  <rect class="bx" x="500" y="176" width="190" height="44" rx="3"/>
  <text class="t" x="595" y="203" text-anchor="middle" xml:space="preserve">render ShowMarks</text>
  <path class="none" d="M214,80 C246,80 246,70 276,70" marker-end="url(#ar)"/>
  <path class="none" d="M214,162 C246,162 246,134 276,134" marker-end="url(#ar)"/>
  <path class="dash" d="M214,168 C246,168 246,198 268,198"/>
  <path class="none" d="M456,70 C480,70 480,88 500,88" marker-end="url(#ar)"/>
  <path class="none" d="M456,134 C480,134 480,88 500,88" marker-end="url(#ar)"/>
  <path class="none" d="M456,198 C480,198 480,198 500,198" marker-end="url(#ar)"/>
  <circle class="sig" cx="252" cy="198" r="10"/>
  <text class="inv" x="252" y="202.5" text-anchor="middle" xml:space="preserve">1</text>
  <circle class="sig" cx="690" cy="66" r="10"/>
  <text class="inv" x="690" y="70.5" text-anchor="middle" xml:space="preserve">2</text>
  <text class="cap" x="24" y="268" text-anchor="start" xml:space="preserve">WHAT THE TOOLS SAY</text>
  <circle class="sig" cx="34" cy="288" r="10"/>
  <text class="inv" x="34" y="292.5" text-anchor="middle" xml:space="preserve">1</text>
  <text class="ts" x="54" y="292" text-anchor="start" xml:space="preserve">[GLIM] warning: PaintPixel writes Marks but does not declare "updates Marks"</text>
  <circle class="sig" cx="34" cy="322" r="10"/>
  <text class="inv" x="34" y="326.5" text-anchor="middle" xml:space="preserve">2</text>
  <text class="ts" x="54" y="326" text-anchor="start" xml:space="preserve">[AZMN_REGISTER_CONTRACTS] error: CALL FbPlot may modify B, but the</text>
  <text class="ts" x="54" y="344" text-anchor="start" xml:space="preserve">pre-call value is used later.</text>
  <text class="dimn" x="24" y="380" text-anchor="start" xml:space="preserve">Name the fact that should have changed, walk up to its raisers and down to its triggers.</text>
</svg>
