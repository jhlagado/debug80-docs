<svg xmlns="http://www.w3.org/2000/svg" width="720" height="416" viewBox="0 0 720 416" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">A fact, its change flag and the blocks around it</title>
  <desc id="figDesc">The state DotX beside bit 0 of Changed0, with the two effects that raise it on one side and the render that watches it on the other, and a three-frame timeline of the first draw.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #2a7139;
      --sig-bg: #2a71391a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #6cbb7e;
        --sig-bg: #6cbb7e26;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="24" y="32" text-anchor="start" xml:space="preserve">ONE FACT AND ITS FLAG</text>
  <rect class="bx" x="24" y="48" width="240" height="52" rx="4"/>
  <text class="tb" x="144" y="68" text-anchor="middle" xml:space="preserve">state DotX</text>
  <text class="ts" x="144" y="86" text-anchor="middle" xml:space="preserve">byte = 3 changed</text>
  <line class="sline" x1="264" y1="74" x2="312" y2="74" marker-end="url(#arS)"/>
  <text class="cap" x="320" y="32" text-anchor="start" xml:space="preserve">CHANGED0</text>
  <rect class="bx" x="320" y="52" width="44" height="32" rx="2"/>
  <text class="t" x="342" y="72.5" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dim" x="342" y="45" text-anchor="middle" xml:space="preserve">7</text>
  <rect class="bx" x="364" y="52" width="44" height="32" rx="2"/>
  <text class="t" x="386" y="72.5" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dim" x="386" y="45" text-anchor="middle" xml:space="preserve">6</text>
  <rect class="bx" x="408" y="52" width="44" height="32" rx="2"/>
  <text class="t" x="430" y="72.5" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dim" x="430" y="45" text-anchor="middle" xml:space="preserve">5</text>
  <text class="dimn" x="430" y="98" text-anchor="middle" xml:space="preserve">Step</text>
  <rect class="bx" x="452" y="52" width="44" height="32" rx="2"/>
  <text class="t" x="474" y="72.5" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dim" x="474" y="45" text-anchor="middle" xml:space="preserve">4</text>
  <text class="dimn" x="474" y="98" text-anchor="middle" xml:space="preserve">Right</text>
  <rect class="bx" x="496" y="52" width="44" height="32" rx="2"/>
  <text class="t" x="518" y="72.5" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dim" x="518" y="45" text-anchor="middle" xml:space="preserve">3</text>
  <text class="dimn" x="518" y="98" text-anchor="middle" xml:space="preserve">Left</text>
  <rect class="bx" x="540" y="52" width="44" height="32" rx="2"/>
  <text class="t" x="562" y="72.5" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dim" x="562" y="45" text-anchor="middle" xml:space="preserve">2</text>
  <text class="dimn" x="562" y="98" text-anchor="middle" xml:space="preserve">Score</text>
  <rect class="bx" x="584" y="52" width="44" height="32" rx="2"/>
  <text class="t" x="606" y="72.5" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dim" x="606" y="45" text-anchor="middle" xml:space="preserve">1</text>
  <text class="dimn" x="606" y="98" text-anchor="middle" xml:space="preserve">Colour</text>
  <rect class="bxs" x="628" y="52" width="44" height="32" rx="2"/>
  <text class="tb" x="650" y="72.5" text-anchor="middle" xml:space="preserve">1</text>
  <text class="dim" x="650" y="45" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dimn" x="650" y="98" text-anchor="middle" xml:space="preserve">DotX</text>
  <text class="cap" x="24" y="140" text-anchor="start" xml:space="preserve">RAISERS AND TRIGGERS</text>
  <rect class="bx" x="24" y="156" width="170" height="56" rx="3"/>
  <text class="ts" x="109" y="178" text-anchor="middle" xml:space="preserve">effect MoveLeft</text>
  <text class="ts" x="109" y="196" text-anchor="middle" xml:space="preserve">effect MoveRight</text>
  <line class="none" x1="194" y1="184" x2="250" y2="184" marker-end="url(#ar)"/>
  <text class="dimn" x="222" y="176" text-anchor="middle" xml:space="preserve">updates</text>
  <rect class="bxs" x="250" y="156" width="170" height="56" rx="3"/>
  <text class="tb" x="335" y="180" text-anchor="middle" xml:space="preserve">DotX</text>
  <text class="dim" x="335" y="200" text-anchor="middle" xml:space="preserve">bit 0 of Changed0</text>
  <line class="none" x1="420" y1="184" x2="476" y2="184" marker-end="url(#ar)"/>
  <text class="dimn" x="448" y="176" text-anchor="middle" xml:space="preserve">on DotX</text>
  <rect class="bx" x="476" y="156" width="180" height="56" rx="3"/>
  <text class="ts" x="566" y="178" text-anchor="middle" xml:space="preserve">render DrawBeacon</text>
  <text class="dim" x="566" y="198" text-anchor="middle" xml:space="preserve">on DotX, Colour</text>
  <text class="cap" x="24" y="250" text-anchor="start" xml:space="preserve">THE FIRST FRAMES</text>
  <rect class="bxq" x="24" y="266" width="210" height="96" rx="4"/>
  <text class="t" x="129" y="288" text-anchor="middle" xml:space="preserve">before frame 1</text>
  <text class="dimn" x="129" y="310" text-anchor="middle" xml:space="preserve">DotX holds 3</text>
  <text class="dimn" x="129" y="326" text-anchor="middle" xml:space="preserve">changed set bit 0</text>
  <text class="dimn" x="129" y="342" text-anchor="middle" xml:space="preserve">nothing has drawn yet</text>
  <rect class="bxs" x="254" y="266" width="210" height="96" rx="4"/>
  <text class="tb" x="359" y="288" text-anchor="middle" xml:space="preserve">frame 1</text>
  <text class="dimn" x="359" y="310" text-anchor="middle" xml:space="preserve">dispatch tests bit 0</text>
  <text class="dimn" x="359" y="326" text-anchor="middle" xml:space="preserve">DrawBeacon runs</text>
  <text class="dimn" x="359" y="342" text-anchor="middle" xml:space="preserve">the pixel appears</text>
  <rect class="bxq" x="484" y="266" width="210" height="96" rx="4"/>
  <text class="t" x="589" y="288" text-anchor="middle" xml:space="preserve">frame 2</text>
  <text class="dimn" x="589" y="310" text-anchor="middle" xml:space="preserve">rollover cleared bit 0</text>
  <text class="dimn" x="589" y="326" text-anchor="middle" xml:space="preserve">DrawBeacon rests</text>
  <text class="dimn" x="589" y="342" text-anchor="middle" xml:space="preserve">the scan keeps it lit</text>
  <text class="dimn" x="24" y="392" text-anchor="start" xml:space="preserve">One bit per fact, states first and pulses after them, up to 32 of them across four banks.</text>
</svg>
