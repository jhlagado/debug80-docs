  <text class="dimn" x="40" y="300" text-anchor="start" xml:space="preserve">A full row reads all ones in BoardRows whatever its colours, which is how a line announces itself.</text>
  <text class="dimn" x="40" y="324" text-anchor="start" xml:space="preserve">Each colour plane byte reaches the framebuffer as one OR into the matching plane of that row.</text>
