<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Skyfall as declarations before it is code</title>
  <desc id="figDesc">The facts, the moments with their sources, the two schedules and the three cards, laid out as the game skeleton the chapter designs on paper before any block is written.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #2a7139;
      --sig-bg: #2a71391a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #6cbb7e;
        --sig-bg: #6cbb7e26;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="30" y="56" text-anchor="start" xml:space="preserve">FACTS</text>
  <rect class="bx" x="30" y="70" width="210" height="30" rx="3"/>
  <text class="ts" x="42" y="90" text-anchor="start" xml:space="preserve">PadX  : byte</text>
  <rect class="bx" x="30" y="108" width="210" height="30" rx="3"/>
  <text class="ts" x="42" y="128" text-anchor="start" xml:space="preserve">DropX : byte</text>
  <rect class="bx" x="30" y="146" width="210" height="30" rx="3"/>
  <text class="ts" x="42" y="166" text-anchor="start" xml:space="preserve">DropY : byte</text>
  <rect class="bx" x="30" y="184" width="210" height="30" rx="3"/>
  <text class="ts" x="42" y="204" text-anchor="start" xml:space="preserve">Score : word</text>
  <rect class="bx" x="30" y="222" width="210" height="30" rx="3"/>
  <text class="ts" x="42" y="242" text-anchor="start" xml:space="preserve">Lives : byte</text>
  <rect class="bx" x="30" y="260" width="210" height="30" rx="3"/>
  <text class="ts" x="42" y="280" text-anchor="start" xml:space="preserve">Armed : byte</text>
  <text class="cap" x="270" y="56" text-anchor="start" xml:space="preserve">MOMENTS</text>
  <rect class="bx" x="270" y="70" width="190" height="30" rx="3"/>
  <text class="ts" x="282" y="90" text-anchor="start" xml:space="preserve">LeftP</text>
  <text class="dim" x="448" y="90" text-anchor="end" xml:space="preserve">held 4</text>
  <rect class="bx" x="270" y="108" width="190" height="30" rx="3"/>
  <text class="ts" x="282" y="128" text-anchor="start" xml:space="preserve">RightP</text>
  <text class="dim" x="448" y="128" text-anchor="end" xml:space="preserve">held 6</text>
  <rect class="bx" x="270" y="146" width="190" height="30" rx="3"/>
  <text class="ts" x="282" y="166" text-anchor="start" xml:space="preserve">FallTick</text>
  <text class="dim" x="448" y="166" text-anchor="end" xml:space="preserve">timer Gravity</text>
  <rect class="bx" x="270" y="184" width="190" height="30" rx="3"/>
  <text class="ts" x="282" y="204" text-anchor="start" xml:space="preserve">AnyKeyP</text>
  <text class="dim" x="448" y="204" text-anchor="end" xml:space="preserve">key any</text>
  <rect class="bx" x="270" y="222" width="190" height="30" rx="3"/>
  <text class="ts" x="282" y="242" text-anchor="start" xml:space="preserve">GateP</text>
  <text class="dim" x="448" y="242" text-anchor="end" xml:space="preserve">timer Wait</text>
  <text class="cap" x="490" y="56" text-anchor="start" xml:space="preserve">SCHEDULES</text>
  <rect class="bx" x="490" y="70" width="200" height="30" rx="3"/>
  <text class="ts" x="502" y="90" text-anchor="start" xml:space="preserve">timer Gravity : 18</text>
  <rect class="bx" x="490" y="108" width="200" height="30" rx="3"/>
  <text class="ts" x="502" y="128" text-anchor="start" xml:space="preserve">timer Wait : once</text>
  <text class="cap" x="490" y="168" text-anchor="start" xml:space="preserve">CARDS</text>
  <rect class="bx" x="490" y="182" width="200" height="30" rx="3"/>
  <text class="ts" x="502" y="202" text-anchor="start" xml:space="preserve">card Splash</text>
  <rect class="bx" x="490" y="220" width="200" height="30" rx="3"/>
  <text class="ts" x="502" y="240" text-anchor="start" xml:space="preserve">card Playing</text>
  <rect class="bx" x="490" y="258" width="200" height="30" rx="3"/>
  <text class="ts" x="502" y="278" text-anchor="start" xml:space="preserve">card GameOver</text>
  <text class="cap" x="30" y="290" text-anchor="start" xml:space="preserve">RESOURCES</text>
  <text class="dimn" x="30" y="312" text-anchor="start" xml:space="preserve">shape Paddle, sound Catch and Miss, six text strings</text>
  <text class="dimn" x="30" y="340" text-anchor="start" xml:space="preserve">Six facts, five moments and CurrentCard: twelve of the 32 change-flag cells, with room to spare.</text>
  <text class="dimn" x="30" y="364" text-anchor="start" xml:space="preserve">Settle these and the skeleton stands. Every block that remains has one job you have already named.</text>
</svg>
