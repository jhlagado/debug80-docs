<svg xmlns="http://www.w3.org/2000/svg" width="720" height="316" viewBox="0 0 720 316" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">The seven colours as plane bits</title>
  <desc id="figDesc">A table giving the red, green and blue plane bits and the byte value of each of the seven matrix colours, beside three overlapping circles whose intersections name the mixed colours.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #2a7139;
      --sig-bg: #2a71391a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #6cbb7e;
        --sig-bg: #6cbb7e26;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="40" y="30" text-anchor="start" xml:space="preserve">PLANE BITS</text>
  <text class="dim" x="183" y="54" text-anchor="middle" xml:space="preserve">R</text>
  <text class="dim" x="219" y="54" text-anchor="middle" xml:space="preserve">G</text>
  <text class="dim" x="255" y="54" text-anchor="middle" xml:space="preserve">B</text>
  <text class="dim" x="290" y="54" text-anchor="start" xml:space="preserve">value</text>
  <text class="t" x="40" y="76" text-anchor="start" xml:space="preserve">COLOR_RED</text>
  <rect class="sig" x="170" y="63" width="26" height="18" rx="2"/>
  <rect class="bxq" x="206" y="63" width="26" height="18" rx="2"/>
  <rect class="bxq" x="242" y="63" width="26" height="18" rx="2"/>
  <text class="t" x="290" y="76" text-anchor="start" xml:space="preserve">$01</text>
  <text class="t" x="40" y="104" text-anchor="start" xml:space="preserve">COLOR_GREEN</text>
  <rect class="bxq" x="170" y="91" width="26" height="18" rx="2"/>
  <rect class="sig" x="206" y="91" width="26" height="18" rx="2"/>
  <rect class="bxq" x="242" y="91" width="26" height="18" rx="2"/>
  <text class="t" x="290" y="104" text-anchor="start" xml:space="preserve">$02</text>
  <text class="t" x="40" y="132" text-anchor="start" xml:space="preserve">COLOR_BLUE</text>
  <rect class="bxq" x="170" y="119" width="26" height="18" rx="2"/>
  <rect class="bxq" x="206" y="119" width="26" height="18" rx="2"/>
  <rect class="sig" x="242" y="119" width="26" height="18" rx="2"/>
  <text class="t" x="290" y="132" text-anchor="start" xml:space="preserve">$04</text>
  <text class="t" x="40" y="160" text-anchor="start" xml:space="preserve">COLOR_YELLOW</text>
  <rect class="sig" x="170" y="147" width="26" height="18" rx="2"/>
  <rect class="sig" x="206" y="147" width="26" height="18" rx="2"/>
  <rect class="bxq" x="242" y="147" width="26" height="18" rx="2"/>
  <text class="t" x="290" y="160" text-anchor="start" xml:space="preserve">$03</text>
  <text class="t" x="40" y="188" text-anchor="start" xml:space="preserve">COLOR_CYAN</text>
  <rect class="bxq" x="170" y="175" width="26" height="18" rx="2"/>
  <rect class="sig" x="206" y="175" width="26" height="18" rx="2"/>
  <rect class="sig" x="242" y="175" width="26" height="18" rx="2"/>
  <text class="t" x="290" y="188" text-anchor="start" xml:space="preserve">$06</text>
  <text class="t" x="40" y="216" text-anchor="start" xml:space="preserve">COLOR_MAGENTA</text>
  <rect class="sig" x="170" y="203" width="26" height="18" rx="2"/>
  <rect class="bxq" x="206" y="203" width="26" height="18" rx="2"/>
  <rect class="sig" x="242" y="203" width="26" height="18" rx="2"/>
  <text class="t" x="290" y="216" text-anchor="start" xml:space="preserve">$05</text>
  <text class="t" x="40" y="244" text-anchor="start" xml:space="preserve">COLOR_WHITE</text>
  <rect class="sig" x="170" y="231" width="26" height="18" rx="2"/>
  <rect class="sig" x="206" y="231" width="26" height="18" rx="2"/>
  <rect class="sig" x="242" y="231" width="26" height="18" rx="2"/>
  <text class="t" x="290" y="244" text-anchor="start" xml:space="preserve">$07</text>
  <text class="cap" x="442" y="30" text-anchor="start" xml:space="preserve">THREE PLANES, SEVEN COLOURS</text>
  <circle class="none" cx="500" cy="130" r="58"/>
  <circle class="none" cx="596" cy="130" r="58"/>
  <circle class="none" cx="548" cy="206" r="58"/>
  <text class="dimn" x="462" y="120" text-anchor="middle" xml:space="preserve">red</text>
  <text class="dimn" x="634" y="120" text-anchor="middle" xml:space="preserve">green</text>
  <text class="dimn" x="548" y="246" text-anchor="middle" xml:space="preserve">blue</text>
  <text class="dimn" x="548" y="110" text-anchor="middle" xml:space="preserve">yellow</text>
  <text class="dimn" x="500" y="190" text-anchor="middle" xml:space="preserve">magenta</text>
  <text class="dimn" x="596" y="190" text-anchor="middle" xml:space="preserve">cyan</text>
  <text class="nb" x="548" y="160" text-anchor="middle" xml:space="preserve">white</text>
  <text class="dimn" x="40" y="292" text-anchor="start" xml:space="preserve">FbPlot ORs the plane bits, so red and then green at one place shows yellow.</text>
</svg>
