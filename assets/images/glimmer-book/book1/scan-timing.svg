  <rect class="bxq" x="518" y="60" width="152" height="30" rx="2"/>
  <text class="ts" x="594" y="80" text-anchor="middle" xml:space="preserve">dark</text>
  <path class="none" d="M70,106 H126" marker-end="url(#ar)"/>
  <path class="none" d="M126,106 H70" marker-end="url(#ar)"/>
  <text class="dim" x="134" y="110" text-anchor="start" xml:space="preserve">equal dwell on every row</text>
  <rect class="bx2" x="70" y="120" width="448" height="30" rx="2"/>
  <text class="t" x="294" y="140" text-anchor="middle" xml:space="preserve">ScanFrame</text>
  <rect class="bx" x="518" y="120" width="46" height="30" rx="2"/>
  <text class="ts" x="541" y="140" text-anchor="middle" xml:space="preserve">poll</text>
  <rect class="bx" x="564" y="120" width="60" height="30" rx="2"/>
  <text class="ts" x="594" y="140" text-anchor="middle" xml:space="preserve">phases</text>
  <rect class="bx" x="624" y="120" width="46" height="30" rx="2"/>
  <text class="ts" x="647" y="140" text-anchor="middle" xml:space="preserve">end</text>
  <path class="rule" d="M70,158 V170 H518 V158"/>
  <text class="dimn" x="294" y="188" text-anchor="middle" xml:space="preserve">the scan: eight rows, fixed dwell</text>
  <path class="rule" d="M518,158 V170 H670 V158"/>
  <text class="dimn" x="594" y="188" text-anchor="middle" xml:space="preserve">your game runs here</text>
  <text class="cap" x="70" y="250" text-anchor="start" xml:space="preserve">ONE ROW, FROM MEMORY TO LIGHT</text>
  <text class="dim" x="62" y="289" text-anchor="end" xml:space="preserve">red</text>
  <rect class="bx" x="70" y="270" width="150" height="28" rx="2"/>
  <text class="t" x="145" y="289" text-anchor="middle" xml:space="preserve">%00000000</text>
  <line class="none" x1="220" y1="284" x2="270" y2="284" marker-end="url(#ar)"/>
  <rect class="bx" x="270" y="270" width="170" height="28" rx="2"/>
  <text class="ts" x="355" y="288" text-anchor="middle" xml:space="preserve">out (PortRed),a</text>
  <text class="dim" x="62" y="323" text-anchor="end" xml:space="preserve">green</text>
  <rect class="bxs" x="70" y="304" width="150" height="28" rx="2"/>
  <text class="tb" x="145" y="323" text-anchor="middle" xml:space="preserve">%00111100</text>
  <line class="none" x1="220" y1="318" x2="270" y2="318" marker-end="url(#ar)"/>
  <rect class="bx" x="270" y="304" width="170" height="28" rx="2"/>
  <text class="ts" x="355" y="322" text-anchor="middle" xml:space="preserve">out (PortGreen),a</text>
  <text class="dim" x="62" y="357" text-anchor="end" xml:space="preserve">blue</text>
  <rect class="bx" x="70" y="338" width="150" height="28" rx="2"/>
  <text class="t" x="145" y="357" text-anchor="middle" xml:space="preserve">%00000000</text>
  <line class="none" x1="220" y1="352" x2="270" y2="352" marker-end="url(#ar)"/>
  <rect class="bx" x="270" y="338" width="170" height="28" rx="2"/>
  <text class="ts" x="355" y="356" text-anchor="middle" xml:space="preserve">out (PortBlue),a</text>
  <text class="dim" x="62" y="391" text-anchor="end" xml:space="preserve">row 2</text>
  <rect class="bx" x="70" y="372" width="150" height="28" rx="2"/>
  <text class="t" x="145" y="391" text-anchor="middle" xml:space="preserve">%00000100</text>
  <line class="none" x1="220" y1="386" x2="270" y2="386" marker-end="url(#ar)"/>
  <rect class="bx" x="270" y="372" width="170" height="28" rx="2"/>
  <text class="ts" x="355" y="390" text-anchor="middle" xml:space="preserve">out (PortRow),a</text>
