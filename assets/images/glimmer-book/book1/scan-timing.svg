  <text class="dimn" x="70" y="220" text-anchor="start" xml:space="preserve">Every row shines for the same count, so brightness holds. The gap is the budget the game spends.</text>
  <text class="dimn" x="70" y="440" text-anchor="start" xml:space="preserve">Three plane bytes reach three ports, the row select enables one row, and the aux byte is stepped over.</text>
