<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">An array of references pointing to three separate arrays</title>
  <desc id="figDesc">Three reference slots on the left point to three independently allocated eight-byte board arrays on the right. Selecting a reference does not move or combine the arrays.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #744f90;
      --sig-bg: #744f901a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #b995d0;
        --sig-bg: #b995d026;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="40" y="30" text-anchor="start" xml:space="preserve">REFERENCE ARRAY</text>
  <text class="cap" x="450" y="30" text-anchor="start" xml:space="preserve">SEPARATE STORAGE</text>
  <rect class="bx" x="40" y="56" width="190" height="42" rx="4"/>
  <text class="nb" x="135" y="81.5" text-anchor="middle" xml:space="preserve">boardPlanes[0]</text>
  <line class="none" x1="230" y1="77" x2="450" y2="77" marker-end="url(#ar)"/>
  <rect class="bx" x="450" y="56" width="230" height="42" rx="4"/>
  <text class="nb" x="565" y="81.5" text-anchor="middle" xml:space="preserve">boardRed : u8[8]</text>
  <rect class="bxs" x="40" y="126" width="190" height="42" rx="4"/>
  <text class="nb" x="135" y="151.5" text-anchor="middle" xml:space="preserve">boardPlanes[1]</text>
  <line class="sline" x1="230" y1="147" x2="450" y2="147" marker-end="url(#arS)"/>
  <rect class="bxs" x="450" y="126" width="230" height="42" rx="4"/>
  <text class="nb" x="565" y="151.5" text-anchor="middle" xml:space="preserve">boardGreen : u8[8]</text>
  <rect class="bx" x="40" y="196" width="190" height="42" rx="4"/>
  <text class="nb" x="135" y="221.5" text-anchor="middle" xml:space="preserve">boardPlanes[2]</text>
  <line class="none" x1="230" y1="217" x2="450" y2="217" marker-end="url(#ar)"/>
  <rect class="bx" x="450" y="196" width="230" height="42" rx="4"/>
  <text class="nb" x="565" y="221.5" text-anchor="middle" xml:space="preserve">boardBlue : u8[8]</text>
  <text class="t" x="40" y="276" text-anchor="start" xml:space="preserve">value(boardPlanes[1]) selects all eight bytes of boardGreen</text>
</svg>
