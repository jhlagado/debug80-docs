<svg xmlns="http://www.w3.org/2000/svg" width="720" height="204" viewBox="0 0 720 204" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Four four-byte Reading records stored as one array on Z80</title>
  <desc id="figDesc">Four groups of four byte cells begin at offsets zero, four, eight and twelve. The signed value uses Z80 little-endian byte order. The quality field in reading two is highlighted at total byte offset eleven.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #744f90;
      --sig-bg: #744f901a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #b995d0;
        --sig-bg: #b995d026;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="30" y="26" text-anchor="start" xml:space="preserve">READINGS AS READING[4]</text>
  <text class="dimn" x="102" y="50" text-anchor="middle" xml:space="preserve">readings[0]</text>
  <rect class="bx" x="30" y="64" width="36" height="34" rx="1"/>
  <text class="t" x="48" y="85" text-anchor="middle" xml:space="preserve">vL</text>
  <rect class="bx" x="66" y="64" width="36" height="34" rx="1"/>
  <text class="t" x="84" y="85" text-anchor="middle" xml:space="preserve">vH</text>
  <rect class="bx" x="102" y="64" width="36" height="34" rx="1"/>
  <text class="t" x="120" y="85" text-anchor="middle" xml:space="preserve">u</text>
  <rect class="bx" x="138" y="64" width="36" height="34" rx="1"/>
  <text class="t" x="156" y="85" text-anchor="middle" xml:space="preserve">q</text>
  <text class="dim" x="102" y="120" text-anchor="middle" xml:space="preserve">base + 0</text>
  <text class="dimn" x="272" y="50" text-anchor="middle" xml:space="preserve">readings[1]</text>
  <rect class="bx" x="200" y="64" width="36" height="34" rx="1"/>
  <text class="t" x="218" y="85" text-anchor="middle" xml:space="preserve">vL</text>
  <rect class="bx" x="236" y="64" width="36" height="34" rx="1"/>
  <text class="t" x="254" y="85" text-anchor="middle" xml:space="preserve">vH</text>
  <rect class="bx" x="272" y="64" width="36" height="34" rx="1"/>
  <text class="t" x="290" y="85" text-anchor="middle" xml:space="preserve">u</text>
  <rect class="bx" x="308" y="64" width="36" height="34" rx="1"/>
  <text class="t" x="326" y="85" text-anchor="middle" xml:space="preserve">q</text>
  <text class="dim" x="272" y="120" text-anchor="middle" xml:space="preserve">base + 4</text>
  <text class="dimn" x="442" y="50" text-anchor="middle" xml:space="preserve">readings[2]</text>
  <rect class="bx" x="370" y="64" width="36" height="34" rx="1"/>
  <text class="t" x="388" y="85" text-anchor="middle" xml:space="preserve">vL</text>
  <rect class="bx" x="406" y="64" width="36" height="34" rx="1"/>
  <text class="t" x="424" y="85" text-anchor="middle" xml:space="preserve">vH</text>
  <rect class="bx" x="442" y="64" width="36" height="34" rx="1"/>
  <text class="t" x="460" y="85" text-anchor="middle" xml:space="preserve">u</text>
  <rect class="bxs" x="478" y="64" width="36" height="34" rx="1"/>
  <text class="tb" x="496" y="85" text-anchor="middle" xml:space="preserve">q</text>
  <text class="dim" x="442" y="120" text-anchor="middle" xml:space="preserve">base + 8</text>
  <text class="dimn" x="612" y="50" text-anchor="middle" xml:space="preserve">readings[3]</text>
  <rect class="bx" x="540" y="64" width="36" height="34" rx="1"/>
  <text class="t" x="558" y="85" text-anchor="middle" xml:space="preserve">vL</text>
  <rect class="bx" x="576" y="64" width="36" height="34" rx="1"/>
  <text class="t" x="594" y="85" text-anchor="middle" xml:space="preserve">vH</text>
  <rect class="bx" x="612" y="64" width="36" height="34" rx="1"/>
  <text class="t" x="630" y="85" text-anchor="middle" xml:space="preserve">u</text>
  <rect class="bx" x="648" y="64" width="36" height="34" rx="1"/>
  <text class="t" x="666" y="85" text-anchor="middle" xml:space="preserve">q</text>
  <text class="dim" x="612" y="120" text-anchor="middle" xml:space="preserve">base + 12</text>
  <text class="t" x="30" y="160" text-anchor="start" xml:space="preserve">readings[2].quality → 2 × 4 + 3 → byte offset 11</text>
  <text class="dimn" x="30" y="188" text-anchor="start" xml:space="preserve">vL  vH = i16 value bytes    u = unit    q = quality</text>
</svg>
