<svg xmlns="http://www.w3.org/2000/svg" width="720" height="204" viewBox="0 0 720 204" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Four six-byte Monster records stored as one array</title>
  <desc id="figDesc">Four groups of six byte cells begin at offsets zero, six, twelve and eighteen. The timer field in monsters two is highlighted at total byte offset sixteen.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #744f90;
      --sig-bg: #744f901a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #b995d0;
        --sig-bg: #b995d026;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="30" y="26" text-anchor="start" xml:space="preserve">MONSTERS AS MONSTER[4]</text>
  <text class="dimn" x="105" y="50" text-anchor="middle" xml:space="preserve">monsters[0]</text>
  <rect class="bx" x="30" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="42.5" y="85" text-anchor="middle" xml:space="preserve">x</text>
  <rect class="bx" x="55" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="67.5" y="85" text-anchor="middle" xml:space="preserve">y</text>
  <rect class="bx" x="80" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="92.5" y="85" text-anchor="middle" xml:space="preserve">d</text>
  <rect class="bx" x="105" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="117.5" y="85" text-anchor="middle" xml:space="preserve">s</text>
  <rect class="bx" x="130" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="142.5" y="85" text-anchor="middle" xml:space="preserve">t</text>
  <rect class="bx" x="155" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="167.5" y="85" text-anchor="middle" xml:space="preserve">f</text>
  <text class="dim" x="105" y="120" text-anchor="middle" xml:space="preserve">base + 0</text>
  <text class="dimn" x="275" y="50" text-anchor="middle" xml:space="preserve">monsters[1]</text>
  <rect class="bx" x="200" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="212.5" y="85" text-anchor="middle" xml:space="preserve">x</text>
  <rect class="bx" x="225" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="237.5" y="85" text-anchor="middle" xml:space="preserve">y</text>
  <rect class="bx" x="250" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="262.5" y="85" text-anchor="middle" xml:space="preserve">d</text>
  <rect class="bx" x="275" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="287.5" y="85" text-anchor="middle" xml:space="preserve">s</text>
  <rect class="bx" x="300" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="312.5" y="85" text-anchor="middle" xml:space="preserve">t</text>
  <rect class="bx" x="325" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="337.5" y="85" text-anchor="middle" xml:space="preserve">f</text>
  <text class="dim" x="275" y="120" text-anchor="middle" xml:space="preserve">base + 6</text>
  <text class="dimn" x="445" y="50" text-anchor="middle" xml:space="preserve">monsters[2]</text>
  <rect class="bx" x="370" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="382.5" y="85" text-anchor="middle" xml:space="preserve">x</text>
  <rect class="bx" x="395" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="407.5" y="85" text-anchor="middle" xml:space="preserve">y</text>
  <rect class="bx" x="420" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="432.5" y="85" text-anchor="middle" xml:space="preserve">d</text>
  <rect class="bx" x="445" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="457.5" y="85" text-anchor="middle" xml:space="preserve">s</text>
  <rect class="bxs" x="470" y="64" width="25" height="34" rx="1"/>
  <text class="tb" x="482.5" y="85" text-anchor="middle" xml:space="preserve">t</text>
  <rect class="bx" x="495" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="507.5" y="85" text-anchor="middle" xml:space="preserve">f</text>
  <text class="dim" x="445" y="120" text-anchor="middle" xml:space="preserve">base + 12</text>
  <text class="dimn" x="615" y="50" text-anchor="middle" xml:space="preserve">monsters[3]</text>
  <rect class="bx" x="540" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="552.5" y="85" text-anchor="middle" xml:space="preserve">x</text>
  <rect class="bx" x="565" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="577.5" y="85" text-anchor="middle" xml:space="preserve">y</text>
  <rect class="bx" x="590" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="602.5" y="85" text-anchor="middle" xml:space="preserve">d</text>
  <rect class="bx" x="615" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="627.5" y="85" text-anchor="middle" xml:space="preserve">s</text>
  <rect class="bx" x="640" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="652.5" y="85" text-anchor="middle" xml:space="preserve">t</text>
  <rect class="bx" x="665" y="64" width="25" height="34" rx="1"/>
  <text class="t" x="677.5" y="85" text-anchor="middle" xml:space="preserve">f</text>
  <text class="dim" x="615" y="120" text-anchor="middle" xml:space="preserve">base + 18</text>
  <text class="t" x="30" y="160" text-anchor="start" xml:space="preserve">monsters[2].timer → 2 × 6 + 4 → byte offset 16</text>
  <text class="dimn" x="30" y="188" text-anchor="start" xml:space="preserve">x  y  d(irection)  s(tate)  t(imer)  f(rame)</text>
</svg>
