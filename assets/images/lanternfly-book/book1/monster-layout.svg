<svg xmlns="http://www.w3.org/2000/svg" width="720" height="202" viewBox="0 0 720 202" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">The exact six-byte layout of a Monster record</title>
  <desc id="figDesc">Six byte cells in declaration order at addresses 9000 through 9005. The timer field is highlighted at offset four.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #744f90;
      --sig-bg: #744f901a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #b995d0;
        --sig-bg: #b995d026;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="40" y="28" text-anchor="start" xml:space="preserve">MONSTER, DECLARATION ORDER</text>
  <rect class="bx" x="60" y="62" width="100" height="34" rx="2"/>
  <text class="t" x="110" y="83.5" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dim" x="110" y="55" text-anchor="middle" xml:space="preserve">$9000</text>
  <text class="dimn" x="110" y="110" text-anchor="middle" xml:space="preserve">x</text>
  <rect class="bx" x="160" y="62" width="100" height="34" rx="2"/>
  <text class="t" x="210" y="83.5" text-anchor="middle" xml:space="preserve">1</text>
  <text class="dim" x="210" y="55" text-anchor="middle" xml:space="preserve">$9001</text>
  <text class="dimn" x="210" y="110" text-anchor="middle" xml:space="preserve">y</text>
  <rect class="bx" x="260" y="62" width="100" height="34" rx="2"/>
  <text class="t" x="310" y="83.5" text-anchor="middle" xml:space="preserve">2</text>
  <text class="dim" x="310" y="55" text-anchor="middle" xml:space="preserve">$9002</text>
  <text class="dimn" x="310" y="110" text-anchor="middle" xml:space="preserve">direction</text>
  <rect class="bx" x="360" y="62" width="100" height="34" rx="2"/>
  <text class="t" x="410" y="83.5" text-anchor="middle" xml:space="preserve">3</text>
  <text class="dim" x="410" y="55" text-anchor="middle" xml:space="preserve">$9003</text>
  <text class="dimn" x="410" y="110" text-anchor="middle" xml:space="preserve">state</text>
  <rect class="bxs" x="460" y="62" width="100" height="34" rx="2"/>
  <text class="tb" x="510" y="83.5" text-anchor="middle" xml:space="preserve">4</text>
  <text class="dim" x="510" y="55" text-anchor="middle" xml:space="preserve">$9004</text>
  <text class="dimn" x="510" y="110" text-anchor="middle" xml:space="preserve">timer</text>
  <rect class="bx" x="560" y="62" width="100" height="34" rx="2"/>
  <text class="t" x="610" y="83.5" text-anchor="middle" xml:space="preserve">5</text>
  <text class="dim" x="610" y="55" text-anchor="middle" xml:space="preserve">$9005</text>
  <text class="dimn" x="610" y="110" text-anchor="middle" xml:space="preserve">frame</text>
  <text class="t" x="60" y="158" text-anchor="start" xml:space="preserve">size(type Monster) = 6</text>
  <text class="t" x="360" y="158" text-anchor="start" xml:space="preserve">offset(Monster.timer) = 4</text>
  <text class="dimn" x="60" y="184" text-anchor="start" xml:space="preserve">Each field begins at the offset printed inside its byte.</text>
</svg>
