<svg xmlns="http://www.w3.org/2000/svg" width="720" height="190" viewBox="0 0 720 190" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">A five-entry word array laid out as ten bytes</title>
  <desc id="figDesc">Ten contiguous byte cells grouped into five two-byte scores. Entry three is highlighted at byte offsets six and seven, showing that its address is the array base plus three times the two-byte element size.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #744f90;
      --sig-bg: #744f901a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #b995d0;
        --sig-bg: #b995d026;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="40" y="28" text-anchor="start" xml:space="preserve">SCORES AS U16[5]</text>
  <rect class="bx" x="90" y="62" width="54" height="34" rx="2"/>
  <text class="dim" x="117" y="55" text-anchor="middle" xml:space="preserve">$8000</text>
  <rect class="bx" x="144" y="62" width="54" height="34" rx="2"/>
  <rect class="bx" x="198" y="62" width="54" height="34" rx="2"/>
  <text class="dim" x="225" y="55" text-anchor="middle" xml:space="preserve">$8002</text>
  <rect class="bx" x="252" y="62" width="54" height="34" rx="2"/>
  <rect class="bx" x="306" y="62" width="54" height="34" rx="2"/>
  <text class="dim" x="333" y="55" text-anchor="middle" xml:space="preserve">$8004</text>
  <rect class="bx" x="360" y="62" width="54" height="34" rx="2"/>
  <rect class="bxs" x="414" y="62" width="54" height="34" rx="2"/>
  <text class="dim" x="441" y="55" text-anchor="middle" xml:space="preserve">$8006</text>
  <rect class="bxs" x="468" y="62" width="54" height="34" rx="2"/>
  <rect class="bx" x="522" y="62" width="54" height="34" rx="2"/>
  <text class="dim" x="549" y="55" text-anchor="middle" xml:space="preserve">$8008</text>
  <rect class="bx" x="576" y="62" width="54" height="34" rx="2"/>
  <text class="dimn" x="144" y="119" text-anchor="middle" xml:space="preserve">scores[0]</text>
  <text class="dimn" x="252" y="119" text-anchor="middle" xml:space="preserve">scores[1]</text>
  <text class="dimn" x="360" y="119" text-anchor="middle" xml:space="preserve">scores[2]</text>
  <text class="dimn" x="468" y="119" text-anchor="middle" xml:space="preserve">scores[3]</text>
  <text class="dimn" x="576" y="119" text-anchor="middle" xml:space="preserve">scores[4]</text>
  <text class="t" x="90" y="160" text-anchor="start" xml:space="preserve">scores[3] → base + 3 × 2 → byte offset 6</text>
</svg>
