<svg xmlns="http://www.w3.org/2000/svg" width="720" height="448" viewBox="0 0 720 448" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">What each data directive emits</title>
  <desc id="figDesc">Byte strips for .db, .dw, the three string directives and .ds. The string rows all carry Hello, so they differ only in the byte that marks the end: a NUL after the text, a length byte before it, or bit 7 set on the last character.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="46" y="26" text-anchor="start" xml:space="preserve">NUMBERS</text>
  <text class="t" x="46" y="56" text-anchor="start" xml:space="preserve">.db $48,$65,$6C,$6C,$6F</text>
  <rect class="bx" x="260" y="36" width="48" height="30" rx="2"/>
  <text class="t" x="284" y="55.5" text-anchor="middle" xml:space="preserve">48</text>
  <rect class="bx" x="308" y="36" width="48" height="30" rx="2"/>
  <text class="t" x="332" y="55.5" text-anchor="middle" xml:space="preserve">65</text>
  <rect class="bx" x="356" y="36" width="48" height="30" rx="2"/>
  <text class="t" x="380" y="55.5" text-anchor="middle" xml:space="preserve">6C</text>
  <rect class="bx" x="404" y="36" width="48" height="30" rx="2"/>
  <text class="t" x="428" y="55.5" text-anchor="middle" xml:space="preserve">6C</text>
  <rect class="bx" x="452" y="36" width="48" height="30" rx="2"/>
  <text class="t" x="476" y="55.5" text-anchor="middle" xml:space="preserve">6F</text>
  <text class="dimn" x="560" y="56" text-anchor="start" xml:space="preserve">five bytes</text>
  <text class="t" x="46" y="100" text-anchor="start" xml:space="preserve">.dw $1234</text>
  <rect class="bx" x="260" y="80" width="48" height="30" rx="2"/>
  <text class="t" x="284" y="99.5" text-anchor="middle" xml:space="preserve">34</text>
  <rect class="bx" x="308" y="80" width="48" height="30" rx="2"/>
  <text class="t" x="332" y="99.5" text-anchor="middle" xml:space="preserve">12</text>
  <text class="dimn" x="560" y="100" text-anchor="start" xml:space="preserve">low byte first</text>
  <text class="cap" x="46" y="142" text-anchor="start" xml:space="preserve">STRINGS</text>
  <text class="t" x="46" y="172" text-anchor="start" xml:space="preserve">.cstr "Hello"</text>
  <rect class="bx" x="260" y="152" width="48" height="30" rx="2"/>
  <text class="t" x="284" y="171.5" text-anchor="middle" xml:space="preserve">48</text>
  <rect class="bx" x="308" y="152" width="48" height="30" rx="2"/>
  <text class="t" x="332" y="171.5" text-anchor="middle" xml:space="preserve">65</text>
  <rect class="bx" x="356" y="152" width="48" height="30" rx="2"/>
  <text class="t" x="380" y="171.5" text-anchor="middle" xml:space="preserve">6C</text>
  <rect class="bx" x="404" y="152" width="48" height="30" rx="2"/>
  <text class="t" x="428" y="171.5" text-anchor="middle" xml:space="preserve">6C</text>
  <rect class="bx" x="452" y="152" width="48" height="30" rx="2"/>
  <text class="t" x="476" y="171.5" text-anchor="middle" xml:space="preserve">6F</text>
  <rect class="bxs" x="500" y="152" width="48" height="30" rx="2"/>
  <text class="tb" x="524" y="171.5" text-anchor="middle" xml:space="preserve">00</text>
  <text class="dimn" x="560" y="172" text-anchor="start" xml:space="preserve">NUL after the text</text>
  <text class="t" x="46" y="216" text-anchor="start" xml:space="preserve">.pstr "Hello"</text>
  <rect class="bxs" x="260" y="196" width="48" height="30" rx="2"/>
  <text class="tb" x="284" y="215.5" text-anchor="middle" xml:space="preserve">05</text>
  <rect class="bx" x="308" y="196" width="48" height="30" rx="2"/>
  <text class="t" x="332" y="215.5" text-anchor="middle" xml:space="preserve">48</text>
  <rect class="bx" x="356" y="196" width="48" height="30" rx="2"/>
  <text class="t" x="380" y="215.5" text-anchor="middle" xml:space="preserve">65</text>
  <rect class="bx" x="404" y="196" width="48" height="30" rx="2"/>
  <text class="t" x="428" y="215.5" text-anchor="middle" xml:space="preserve">6C</text>
  <rect class="bx" x="452" y="196" width="48" height="30" rx="2"/>
  <text class="t" x="476" y="215.5" text-anchor="middle" xml:space="preserve">6C</text>
  <rect class="bx" x="500" y="196" width="48" height="30" rx="2"/>
  <text class="t" x="524" y="215.5" text-anchor="middle" xml:space="preserve">6F</text>
  <text class="dimn" x="560" y="216" text-anchor="start" xml:space="preserve">length byte before it</text>
  <text class="t" x="46" y="260" text-anchor="start" xml:space="preserve">.istr "Hello"</text>
  <rect class="bx" x="260" y="240" width="48" height="30" rx="2"/>
  <text class="t" x="284" y="259.5" text-anchor="middle" xml:space="preserve">48</text>
  <rect class="bx" x="308" y="240" width="48" height="30" rx="2"/>
  <text class="t" x="332" y="259.5" text-anchor="middle" xml:space="preserve">65</text>
  <rect class="bx" x="356" y="240" width="48" height="30" rx="2"/>
  <text class="t" x="380" y="259.5" text-anchor="middle" xml:space="preserve">6C</text>
  <rect class="bx" x="404" y="240" width="48" height="30" rx="2"/>
  <text class="t" x="428" y="259.5" text-anchor="middle" xml:space="preserve">6C</text>
  <rect class="bxs" x="452" y="240" width="48" height="30" rx="2"/>
  <text class="tb" x="476" y="259.5" text-anchor="middle" xml:space="preserve">EF</text>
  <text class="dimn" x="560" y="260" text-anchor="start" xml:space="preserve">bit 7 set on the last</text>
  <text class="cap" x="46" y="302" text-anchor="start" xml:space="preserve">RESERVED</text>
  <text class="t" x="46" y="332" text-anchor="start" xml:space="preserve">.ds 4</text>
  <rect class="bx" x="260" y="312" width="48" height="30" rx="2"/>
  <rect class="bx" x="308" y="312" width="48" height="30" rx="2"/>
  <rect class="bx" x="356" y="312" width="48" height="30" rx="2"/>
  <rect class="bx" x="404" y="312" width="48" height="30" rx="2"/>
  <text class="dimn" x="560" y="332" text-anchor="start" xml:space="preserve">nothing written</text>
  <text class="t" x="46" y="376" text-anchor="start" xml:space="preserve">.ds 4,0</text>
  <rect class="bx" x="260" y="356" width="48" height="30" rx="2"/>
  <text class="t" x="284" y="375.5" text-anchor="middle" xml:space="preserve">00</text>
  <rect class="bx" x="308" y="356" width="48" height="30" rx="2"/>
  <text class="t" x="332" y="375.5" text-anchor="middle" xml:space="preserve">00</text>
  <rect class="bx" x="356" y="356" width="48" height="30" rx="2"/>
  <text class="t" x="380" y="375.5" text-anchor="middle" xml:space="preserve">00</text>
  <rect class="bx" x="404" y="356" width="48" height="30" rx="2"/>
  <text class="t" x="428" y="375.5" text-anchor="middle" xml:space="preserve">00</text>
  <text class="dimn" x="560" y="376" text-anchor="start" xml:space="preserve">fill byte written</text>
  <text class="dimn" x="46" y="410" text-anchor="start" xml:space="preserve">The three string directives differ only in which byte marks the end.</text>
  <text class="dimn" x="46" y="428" text-anchor="start" xml:space="preserve">An unfilled .ds advances the address without writing anything. A fill byte makes the block real in the flat binary.</text>
</svg>
