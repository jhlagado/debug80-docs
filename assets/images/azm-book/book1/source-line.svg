<svg xmlns="http://www.w3.org/2000/svg" width="720" height="212" viewBox="0 0 720 212" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">The four fields of a source line</title>
  <desc id="figDesc">One assembly line divided into its label, its mnemonic, its operands and its comment, with each field named underneath.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="46" y="26" text-anchor="start" xml:space="preserve">ONE SOURCE LINE</text>
  <rect class="bxs" x="46" y="46" width="120" height="38" rx="2"/>
  <text class="tb" x="106" y="70" text-anchor="middle" xml:space="preserve">Start:</text>
  <text class="nb" x="106" y="108" text-anchor="middle" xml:space="preserve">label</text>
  <text class="dimn" x="106" y="128" text-anchor="middle" xml:space="preserve">optional; names</text>
  <text class="dimn" x="106" y="146" text-anchor="middle" xml:space="preserve">this address</text>
  <rect class="bx" x="166" y="46" width="100" height="38" rx="2"/>
  <text class="t" x="216" y="70" text-anchor="middle" xml:space="preserve">ld</text>
  <text class="nb" x="216" y="108" text-anchor="middle" xml:space="preserve">mnemonic</text>
  <text class="dimn" x="216" y="128" text-anchor="middle" xml:space="preserve">case-insensitive</text>
  <rect class="bx" x="266" y="46" width="120" height="38" rx="2"/>
  <text class="t" x="326" y="70" text-anchor="middle" xml:space="preserve">a,0</text>
  <text class="nb" x="326" y="108" text-anchor="middle" xml:space="preserve">operands</text>
  <text class="dimn" x="326" y="128" text-anchor="middle" xml:space="preserve">commas separate</text>
  <text class="dimn" x="326" y="146" text-anchor="middle" xml:space="preserve">operand lists</text>
  <rect class="bx" x="386" y="46" width="270" height="38" rx="2"/>
  <text class="t" x="521" y="70" text-anchor="middle" xml:space="preserve">; inline comment</text>
  <text class="nb" x="521" y="108" text-anchor="middle" xml:space="preserve">comment</text>
  <text class="dimn" x="521" y="128" text-anchor="middle" xml:space="preserve">a semicolon starts it, and it</text>
  <text class="dimn" x="521" y="146" text-anchor="middle" xml:space="preserve">runs to the end of the line</text>
  <text class="dimn" x="46" y="176" text-anchor="start" xml:space="preserve">Any of the four may be absent. A line can hold a label alone, an instruction alone, or a comment alone.</text>
  <text class="dimn" x="46" y="194" text-anchor="start" xml:space="preserve">A label on its own line is the usual form for a routine; on the same line, the usual form for a constant.</text>
</svg>
