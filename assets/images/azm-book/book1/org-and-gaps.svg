<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">A gap in the flat binary and in the Intel HEX</title>
  <desc id="figDesc">An address line with code at $0100 and Result at $8000. Below it the flat binary writes the gap as zero fill, and the Intel HEX emits no records for it at all.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="46" y="26" text-anchor="start" xml:space="preserve">ASSEMBLY ADDRESS</text>
  <text class="t" x="46" y="50" text-anchor="start" xml:space="preserve">.org $0100</text>
  <text class="t" x="536" y="50" text-anchor="start" xml:space="preserve">.org $8000</text>
  <rect class="bxs" x="46" y="60" width="150" height="34" rx="2"/>
  <text class="tb" x="121" y="82" text-anchor="middle" xml:space="preserve">code</text>
  <rect class="bxq" x="196" y="60" width="340" height="34" rx="2"/>
  <text class="dim" x="366" y="82" text-anchor="middle" xml:space="preserve">no bytes assembled</text>
  <rect class="bxs" x="536" y="60" width="150" height="34" rx="2"/>
  <text class="tb" x="611" y="82" text-anchor="middle" xml:space="preserve">Result</text>
  <text class="dim" x="46" y="110" text-anchor="start" xml:space="preserve">$0100</text>
  <text class="dim" x="536" y="110" text-anchor="start" xml:space="preserve">$8000</text>
  <text class="cap" x="46" y="146" text-anchor="start" xml:space="preserve">FLAT BINARY</text>
  <rect class="bx" x="46" y="156" width="640" height="30" rx="2"/>
  <rect class="bx2" x="196" y="156" width="340" height="30" rx="2"/>
  <text class="dim" x="121" y="176" text-anchor="middle" xml:space="preserve">bytes</text>
  <text class="dim" x="366" y="176" text-anchor="middle" xml:space="preserve">zero fill</text>
  <text class="dim" x="611" y="176" text-anchor="middle" xml:space="preserve">bytes</text>
  <text class="cap" x="46" y="216" text-anchor="start" xml:space="preserve">INTEL HEX</text>
  <rect class="bx" x="46" y="226" width="150" height="30" rx="2"/>
  <text class="dim" x="121" y="246" text-anchor="middle" xml:space="preserve">records</text>
  <rect class="bx" x="536" y="226" width="150" height="30" rx="2"/>
  <text class="dim" x="611" y="246" text-anchor="middle" xml:space="preserve">records</text>
  <text class="dimn" x="366" y="246" text-anchor="middle" xml:space="preserve">no records here</text>
  <text class="dimn" x="46" y="284" text-anchor="start" xml:space="preserve">Zero bytes in the binary, no records at all in the HEX. .binfrom and .binto trim the binary to the range you meant.</text>
  <text class="dimn" x="46" y="302" text-anchor="start" xml:space="preserve">.align padding is not a gap: those zero bytes are assembled, so they appear in both.</text>
</svg>
