<svg xmlns="http://www.w3.org/2000/svg" width="720" height="356" viewBox="0 0 720 356" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Anatomy of a listing row</title>
  <desc id="figDesc">A .lst row split into three columns: a four-digit address, the emitted bytes and the source line. Rows that emit nothing leave the gutter empty, and a line emitting more than eight bytes continues on a second address-and-bytes row.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="46" y="26" text-anchor="start" xml:space="preserve">ANATOMY OF A LISTING ROW</text>
  <text class="cap" x="46" y="48" text-anchor="start" xml:space="preserve">ADDRESS</text>
  <text class="cap" x="124" y="48" text-anchor="start" xml:space="preserve">EMITTED BYTES</text>
  <text class="cap" x="384" y="48" text-anchor="start" xml:space="preserve">SOURCE LINE</text>
  <rect class="bxq" x="46" y="58" width="70" height="100" rx="3"/>
  <rect class="bxq" x="124" y="58" width="252" height="100" rx="3"/>
  <rect class="bxq" x="384" y="58" width="290" height="100" rx="3"/>
  <text class="t" x="58" y="84" text-anchor="start" xml:space="preserve">8000</text>
  <text class="t" x="136" y="84" text-anchor="start" xml:space="preserve">06 03</text>
  <text class="t" x="396" y="84" text-anchor="start" xml:space="preserve">ld   b,COUNT        ; loop counter</text>
  <text class="t" x="396" y="114" text-anchor="start" xml:space="preserve">loop:</text>
  <text class="t" x="58" y="144" text-anchor="start" xml:space="preserve">800E</text>
  <text class="t" x="396" y="144" text-anchor="start" xml:space="preserve">.ds  4</text>
  <text class="dimn" x="46" y="178" text-anchor="start" xml:space="preserve">Blank lines, comments, .equ definitions and labels on their own line print an empty gutter.</text>
  <text class="dimn" x="46" y="196" text-anchor="start" xml:space="preserve">An unfilled .ds reservation prints its address and no bytes.</text>
  <text class="cap" x="46" y="232" text-anchor="start" xml:space="preserve">MORE THAN EIGHT BYTES</text>
  <rect class="bxq" x="46" y="242" width="70" height="70" rx="3"/>
  <rect class="bxs" x="124" y="242" width="252" height="70" rx="3"/>
  <rect class="bxq" x="384" y="242" width="290" height="70" rx="3"/>
  <text class="t" x="58" y="268" text-anchor="start" xml:space="preserve">8008</text>
  <text class="tb" x="136" y="268" text-anchor="start" xml:space="preserve">48 45 4C 4C 4F 20 57 4F</text>
  <text class="t" x="396" y="268" text-anchor="start" xml:space="preserve">.db  "HELLO WORLD",0</text>
  <text class="t" x="58" y="298" text-anchor="start" xml:space="preserve">8010</text>
  <text class="tb" x="136" y="298" text-anchor="start" xml:space="preserve">52 4C 44 00</text>
  <text class="dimn" x="396" y="298" text-anchor="start" xml:space="preserve">source column left blank</text>
  <text class="dimn" x="46" y="336" text-anchor="start" xml:space="preserve">After the last source line comes a symbol table: every label and constant with its value, sorted by name.</text>
</svg>
