<svg xmlns="http://www.w3.org/2000/svg" width="720" height="396" viewBox="0 0 720 396" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">The assembly address as a cursor</title>
  <desc id="figDesc">An address ruler showing .org placing a section, emitted bytes advancing the cursor, .align inserting padding, a gap with nothing assembled, and a second .org further on. Below it, a backward .org at $0012 is ignored and the label lands at $0014.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="46" y="26" text-anchor="start" xml:space="preserve">ASSEMBLY ADDRESS</text>
  <text class="t" x="46" y="50" text-anchor="start" xml:space="preserve">.org $0100</text>
  <text class="t" x="198" y="50" text-anchor="middle" xml:space="preserve">.align 16</text>
  <text class="t" x="536" y="50" text-anchor="start" xml:space="preserve">.org $8000</text>
  <rect class="bxs" x="46" y="64" width="130" height="34" rx="2"/>
  <text class="tb" x="111" y="86" text-anchor="middle" xml:space="preserve">code</text>
  <rect class="bx2" x="176" y="64" width="44" height="34" rx="2"/>
  <rect class="bxs" x="220" y="64" width="126" height="34" rx="2"/>
  <text class="tb" x="283" y="86" text-anchor="middle" xml:space="preserve">table</text>
  <rect class="bxq" x="346" y="64" width="190" height="34" rx="2"/>
  <text class="dim" x="441" y="86" text-anchor="middle" xml:space="preserve">no bytes assembled</text>
  <rect class="bxs" x="536" y="64" width="150" height="34" rx="2"/>
  <text class="tb" x="611" y="86" text-anchor="middle" xml:space="preserve">Result</text>
  <text class="dim" x="46" y="114" text-anchor="start" xml:space="preserve">$0100</text>
  <text class="dim" x="536" y="114" text-anchor="start" xml:space="preserve">$8000</text>
  <line class="sline" x1="346" y1="122" x2="346" y2="100" marker-end="url(#arS)"/>
  <text class="tb" x="346" y="138" text-anchor="middle" xml:space="preserve">$</text>
  <text class="dimn" x="358" y="138" text-anchor="start" xml:space="preserve">the assembly address after the table</text>
  <rect class="bxs" x="46" y="163" width="13" height="13" rx="2"/>
  <text class="dimn" x="66" y="174" text-anchor="start" xml:space="preserve">assembled bytes</text>
  <rect class="bx2" x="172.19" y="163" width="13" height="13" rx="2"/>
  <text class="dimn" x="192.19" y="174" text-anchor="start" xml:space="preserve">.align padding</text>
  <rect class="bxq" x="287.71" y="163" width="13" height="13" rx="2"/>
  <text class="dimn" x="307.71" y="174" text-anchor="start" xml:space="preserve">no bytes assembled</text>
  <text class="cap" x="46" y="212" text-anchor="start" xml:space="preserve">GOING BACKWARDS</text>
  <text class="ts" x="46" y="234" text-anchor="start" xml:space="preserve">        .org $0010</text>
  <text class="ts" x="46" y="252" text-anchor="start" xml:space="preserve">A:      .db $AA, $AA, $AA, $AA</text>
  <text class="ts" x="46" y="270" text-anchor="start" xml:space="preserve">        .org $0012</text>
  <text class="ts" x="46" y="288" text-anchor="start" xml:space="preserve">B:      .db $BB</text>
  <rect class="bx" x="300" y="246" width="56" height="32" rx="2"/>
  <text class="t" x="328" y="266.5" text-anchor="middle" xml:space="preserve">AA</text>
  <text class="dim" x="328" y="239" text-anchor="middle" xml:space="preserve">$0010</text>
  <text class="dimn" x="328" y="292" text-anchor="middle" xml:space="preserve">A</text>
  <rect class="bx" x="356" y="246" width="56" height="32" rx="2"/>
  <text class="t" x="384" y="266.5" text-anchor="middle" xml:space="preserve">AA</text>
  <text class="dim" x="384" y="239" text-anchor="middle" xml:space="preserve">$0011</text>
  <rect class="bx" x="412" y="246" width="56" height="32" rx="2"/>
  <text class="t" x="440" y="266.5" text-anchor="middle" xml:space="preserve">AA</text>
  <text class="dim" x="440" y="239" text-anchor="middle" xml:space="preserve">$0012</text>
  <rect class="bx" x="468" y="246" width="56" height="32" rx="2"/>
  <text class="t" x="496" y="266.5" text-anchor="middle" xml:space="preserve">AA</text>
  <text class="dim" x="496" y="239" text-anchor="middle" xml:space="preserve">$0013</text>
  <rect class="bxs" x="524" y="246" width="56" height="32" rx="2"/>
  <text class="tb" x="552" y="266.5" text-anchor="middle" xml:space="preserve">BB</text>
  <text class="dim" x="552" y="239" text-anchor="middle" xml:space="preserve">$0014</text>
  <text class="dimn" x="552" y="292" text-anchor="middle" xml:space="preserve">B</text>
  <text class="dimn" x="46" y="326" text-anchor="start" xml:space="preserve">The second .org asks for $0012, which is behind the cursor, so AZM ignores it and the cursor stays at $0014.</text>
  <text class="dimn" x="46" y="344" text-anchor="start" xml:space="preserve">B is defined at $0014. The earlier bytes stand, the build stays silent, and no line of source names that address.</text>
  <text class="dimn" x="46" y="376" text-anchor="start" xml:space="preserve">.org, emitted bytes and .align padding all move the cursor forward. Forward is the only direction it travels.</text>
</svg>
