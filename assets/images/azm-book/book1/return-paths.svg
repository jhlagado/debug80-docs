<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Every returning path meets the same contract</title>
  <desc id="figDesc">The same routine drawn twice under a preserves BC contract. On the left both the fallthrough and the _fail path pop BC before ret. On the right the _fail path returns without popping, so that path breaks the contract.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="t" x="24" y="28" text-anchor="start" xml:space="preserve">.routine preserves BC</text>
  <text class="cap" x="24" y="52" text-anchor="start" xml:space="preserve">BOTH PATHS RESTORE BC</text>
  <text class="cap" x="372" y="52" text-anchor="start" xml:space="preserve">ONE PATH DOES NOT</text>
  <rect class="bxq" x="24" y="64" width="324" height="268" rx="4"/>
  <rect class="bx" x="126" y="80" width="120" height="38" rx="4"/>
  <text class="t" x="186" y="103.5" text-anchor="middle" xml:space="preserve">push bc</text>
  <line class="none" x1="186" y1="118" x2="186" y2="138" marker-end="url(#ar)"/>
  <polygon class="bx" points="186,138 271,166 186,194 101,166"/>
  <text class="t" x="186" y="170.5" text-anchor="middle" xml:space="preserve">jr z,_fail</text>
  <text class="dim" x="40" y="196" text-anchor="start" xml:space="preserve">not z</text>
  <text class="dim" x="294" y="186" text-anchor="start" xml:space="preserve">z</text>
  <text class="dim" x="296" y="208" text-anchor="start" xml:space="preserve">_fail:</text>
  <path class="none" d="M101,166 H86 V216" marker-end="url(#ar)"/>
  <rect class="bx" x="36" y="216" width="100" height="38" rx="4"/>
  <text class="t" x="86" y="239.5" text-anchor="middle" xml:space="preserve">pop bc</text>
  <line class="none" x1="86" y1="254" x2="86" y2="274" marker-end="url(#ar)"/>
  <rect class="bx" x="46" y="274" width="80" height="36" rx="4"/>
  <text class="t" x="86" y="296.5" text-anchor="middle" xml:space="preserve">ret</text>
  <text class="dimn" x="86" y="328" text-anchor="middle" xml:space="preserve">BC restored</text>
  <path class="none" d="M271,166 H286 V216" marker-end="url(#ar)"/>
  <rect class="bx" x="236" y="216" width="100" height="38" rx="4"/>
  <text class="t" x="286" y="239.5" text-anchor="middle" xml:space="preserve">pop bc</text>
  <line class="none" x1="286" y1="254" x2="286" y2="274" marker-end="url(#ar)"/>
  <rect class="bx" x="246" y="274" width="80" height="36" rx="4"/>
  <text class="t" x="286" y="296.5" text-anchor="middle" xml:space="preserve">ret</text>
  <text class="dimn" x="286" y="328" text-anchor="middle" xml:space="preserve">BC restored</text>
  <rect class="bxq" x="372" y="64" width="324" height="268" rx="4"/>
  <rect class="bx" x="474" y="80" width="120" height="38" rx="4"/>
  <text class="t" x="534" y="103.5" text-anchor="middle" xml:space="preserve">push bc</text>
  <line class="none" x1="534" y1="118" x2="534" y2="138" marker-end="url(#ar)"/>
  <polygon class="bx" points="534,138 619,166 534,194 449,166"/>
  <text class="t" x="534" y="170.5" text-anchor="middle" xml:space="preserve">jr z,_fail</text>
  <text class="dim" x="388" y="196" text-anchor="start" xml:space="preserve">not z</text>
  <text class="dim" x="642" y="186" text-anchor="start" xml:space="preserve">z</text>
  <text class="dim" x="644" y="208" text-anchor="start" xml:space="preserve">_fail:</text>
  <path class="none" d="M449,166 H434 V216" marker-end="url(#ar)"/>
  <rect class="bx" x="384" y="216" width="100" height="38" rx="4"/>
  <text class="t" x="434" y="239.5" text-anchor="middle" xml:space="preserve">pop bc</text>
  <line class="none" x1="434" y1="254" x2="434" y2="274" marker-end="url(#ar)"/>
  <rect class="bx" x="394" y="274" width="80" height="36" rx="4"/>
  <text class="t" x="434" y="296.5" text-anchor="middle" xml:space="preserve">ret</text>
  <text class="dimn" x="434" y="328" text-anchor="middle" xml:space="preserve">BC restored</text>
  <path class="none" d="M619,166 H634 V274" marker-end="url(#ar)"/>
  <rect class="bxs" x="594" y="274" width="80" height="36" rx="4"/>
  <text class="t" x="634" y="296.5" text-anchor="middle" xml:space="preserve">ret</text>
  <text class="dimn" x="634" y="328" text-anchor="middle" xml:space="preserve">BC not restored</text>
  <text class="dimn" x="24" y="362" text-anchor="start" xml:space="preserve">Every returning path is checked against the same contract. A pop on one path does not cover the other.</text>
  <text class="dimn" x="24" y="380" text-anchor="start" xml:space="preserve">Keep the push and its pop inside one .routine region. A shared exit owned by another routine is rejected first.</text>
</svg>
