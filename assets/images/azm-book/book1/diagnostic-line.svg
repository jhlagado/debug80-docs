<svg xmlns="http://www.w3.org/2000/svg" width="720" height="202" viewBox="0 0 720 202" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">The fields of a diagnostic line</title>
  <desc id="figDesc">One AZM diagnostic split into file, line, column, severity, diagnostic ID and message, with the ID marked as the part that stays stable across releases.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="46" y="26" text-anchor="start" xml:space="preserve">ONE DIAGNOSTIC LINE</text>
  <rect class="bx" x="46" y="48" width="120" height="38" rx="2"/>
  <text class="t" x="106" y="72" text-anchor="middle" xml:space="preserve">program.asm</text>
  <text class="nb" x="106" y="108" text-anchor="middle" xml:space="preserve">file</text>
  <text class="dimn" x="106" y="128" text-anchor="middle" xml:space="preserve">as AZM saw it</text>
  <rect class="bx" x="166" y="48" width="50" height="38" rx="2"/>
  <text class="t" x="191" y="72" text-anchor="middle" xml:space="preserve">23</text>
  <text class="nb" x="191" y="108" text-anchor="middle" xml:space="preserve">line</text>
  <rect class="bx" x="216" y="48" width="46" height="38" rx="2"/>
  <text class="t" x="239" y="72" text-anchor="middle" xml:space="preserve">1</text>
  <text class="nb" x="239" y="108" text-anchor="middle" xml:space="preserve">col</text>
  <rect class="bx" x="262" y="48" width="80" height="38" rx="2"/>
  <text class="t" x="302" y="72" text-anchor="middle" xml:space="preserve">error</text>
  <text class="nb" x="302" y="108" text-anchor="middle" xml:space="preserve">severity</text>
  <text class="dimn" x="302" y="128" text-anchor="middle" xml:space="preserve">error or warning</text>
  <rect class="bxs" x="342" y="48" width="116" height="38" rx="2"/>
  <text class="tb" x="400" y="72" text-anchor="middle" xml:space="preserve">[AZMN_SYMBOL]</text>
  <text class="nb" x="400" y="108" text-anchor="middle" xml:space="preserve">id</text>
  <text class="dimn" x="400" y="128" text-anchor="middle" xml:space="preserve">the stable part</text>
  <rect class="bx" x="458" y="48" width="228" height="38" rx="2"/>
  <text class="t" x="572" y="72" text-anchor="middle" xml:space="preserve">duplicate symbol: COUNT</text>
  <text class="nb" x="572" y="108" text-anchor="middle" xml:space="preserve">message</text>
  <text class="dimn" x="572" y="128" text-anchor="middle" xml:space="preserve">may change between releases</text>
  <text class="dimn" x="46" y="164" text-anchor="start" xml:space="preserve">The diagnostic ID is the stable part of the line.</text>
  <text class="dimn" x="46" y="182" text-anchor="start" xml:space="preserve">If you script against AZM output, match on the code rather than the message text.</text>
</svg>
