<svg xmlns="http://www.w3.org/2000/svg" width="720" height="306" viewBox="0 0 720 306" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Owner-local label scope</title>
  <desc id="figDesc">Two routines, ShiftRow and CopyRow, each declaring a label spelled _loop, with the two qualified identities ShiftRow._loop and CopyRow._loop shown below them as separate symbols.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="30" y="30" text-anchor="start" xml:space="preserve">ONE SOURCE UNIT</text>
  <rect class="bxq" x="30" y="44" width="314" height="152" rx="4"/>
  <rect class="bxs" x="56" y="58" width="200" height="26" rx="2"/>
  <text class="tb" x="68" y="76" text-anchor="start" xml:space="preserve">ShiftRow:</text>
  <text class="dimn" x="270" y="76" text-anchor="start" xml:space="preserve">owner</text>
  <text class="t" x="68" y="110" text-anchor="start" xml:space="preserve">_loop:</text>
  <text class="t" x="68" y="132" text-anchor="start" xml:space="preserve">        djnz    _loop</text>
  <text class="t" x="68" y="154" text-anchor="start" xml:space="preserve">        ret</text>
  <text class="dimn" x="270" y="110" text-anchor="start" xml:space="preserve">local</text>
  <rect class="bxq" x="376" y="44" width="314" height="152" rx="4"/>
  <rect class="bxs" x="402" y="58" width="200" height="26" rx="2"/>
  <text class="tb" x="414" y="76" text-anchor="start" xml:space="preserve">CopyRow:</text>
  <text class="dimn" x="616" y="76" text-anchor="start" xml:space="preserve">owner</text>
  <text class="t" x="414" y="110" text-anchor="start" xml:space="preserve">_loop:</text>
  <text class="t" x="414" y="132" text-anchor="start" xml:space="preserve">        djnz    _loop</text>
  <text class="t" x="414" y="154" text-anchor="start" xml:space="preserve">        ret</text>
  <text class="dimn" x="616" y="110" text-anchor="start" xml:space="preserve">local</text>
  <line class="sline" x1="187" y1="196" x2="187" y2="220" marker-end="url(#arS)"/>
  <line class="sline" x1="533" y1="196" x2="533" y2="220" marker-end="url(#arS)"/>
  <rect class="bxs" x="60" y="222" width="254" height="30" rx="3"/>
  <text class="tb" x="187" y="242" text-anchor="middle" xml:space="preserve">ShiftRow._loop</text>
  <rect class="bxs" x="406" y="222" width="254" height="30" rx="3"/>
  <text class="tb" x="533" y="242" text-anchor="middle" xml:space="preserve">CopyRow._loop</text>
  <text class="dimn" x="30" y="272" text-anchor="start" xml:space="preserve">The same _loop spelling under a different owner is a different symbol.</text>
  <text class="dimn" x="30" y="290" text-anchor="start" xml:space="preserve">Equates, enum members, type names and op names cannot begin with an underscore.</text>
</svg>
