<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">RingState laid out in memory</title>
  <desc id="figDesc">Eight bytes of ring_buf at $8000 followed by the three bytes of ring_state at $8008 holding head, tail and count at offsets 0, 1 and 2.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="62" y="30" text-anchor="start" xml:space="preserve">RING_BUF, .DS RING_CAP</text>
  <rect class="bx" x="62" y="62" width="50" height="32" rx="2"/>
  <text class="t" x="87" y="82.5" text-anchor="middle" xml:space="preserve"></text>
  <text class="dim" x="87" y="55" text-anchor="middle" xml:space="preserve">$8000</text>
  <text class="dimn" x="87" y="108" text-anchor="middle" xml:space="preserve">0</text>
  <rect class="bx" x="112" y="62" width="50" height="32" rx="2"/>
  <text class="t" x="137" y="82.5" text-anchor="middle" xml:space="preserve"></text>
  <text class="dimn" x="137" y="108" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="bx" x="162" y="62" width="50" height="32" rx="2"/>
  <text class="t" x="187" y="82.5" text-anchor="middle" xml:space="preserve"></text>
  <text class="dimn" x="187" y="108" text-anchor="middle" xml:space="preserve">2</text>
  <rect class="bx" x="212" y="62" width="50" height="32" rx="2"/>
  <text class="t" x="237" y="82.5" text-anchor="middle" xml:space="preserve"></text>
  <text class="dimn" x="237" y="108" text-anchor="middle" xml:space="preserve">3</text>
  <rect class="bx" x="262" y="62" width="50" height="32" rx="2"/>
  <text class="t" x="287" y="82.5" text-anchor="middle" xml:space="preserve"></text>
  <text class="dimn" x="287" y="108" text-anchor="middle" xml:space="preserve">4</text>
  <rect class="bx" x="312" y="62" width="50" height="32" rx="2"/>
  <text class="t" x="337" y="82.5" text-anchor="middle" xml:space="preserve"></text>
  <text class="dimn" x="337" y="108" text-anchor="middle" xml:space="preserve">5</text>
  <rect class="bx" x="362" y="62" width="50" height="32" rx="2"/>
  <text class="t" x="387" y="82.5" text-anchor="middle" xml:space="preserve"></text>
  <text class="dimn" x="387" y="108" text-anchor="middle" xml:space="preserve">6</text>
  <rect class="bx" x="412" y="62" width="50" height="32" rx="2"/>
  <text class="t" x="437" y="82.5" text-anchor="middle" xml:space="preserve"></text>
  <text class="dim" x="437" y="55" text-anchor="middle" xml:space="preserve">$8007</text>
  <text class="dimn" x="437" y="108" text-anchor="middle" xml:space="preserve">7</text>
  <text class="cap" x="506" y="30" text-anchor="start" xml:space="preserve">RING_STATE, .DS RINGSTATE</text>
  <rect class="bxs" x="506" y="62" width="50" height="32" rx="2"/>
  <text class="tb" x="531" y="82.5" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dim" x="531" y="55" text-anchor="middle" xml:space="preserve">$8008</text>
  <text class="dimn" x="531" y="108" text-anchor="middle" xml:space="preserve">head</text>
  <rect class="bxs" x="556" y="62" width="50" height="32" rx="2"/>
  <text class="tb" x="581" y="82.5" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dim" x="581" y="55" text-anchor="middle" xml:space="preserve">$8009</text>
  <text class="dimn" x="581" y="108" text-anchor="middle" xml:space="preserve">tail</text>
  <rect class="bxs" x="606" y="62" width="50" height="32" rx="2"/>
  <text class="tb" x="631" y="82.5" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dim" x="631" y="55" text-anchor="middle" xml:space="preserve">$800A</text>
  <text class="dimn" x="631" y="108" text-anchor="middle" xml:space="preserve">count</text>
  <path class="rule" d="M506,134 V146 H656 V134"/>
  <text class="dimn" x="581" y="162" text-anchor="middle" xml:space="preserve">sizeof(RingState) = 3</text>
  <text class="t" x="62" y="208" text-anchor="start" xml:space="preserve">RING_HEAD   .equ offset(RingState, head)</text>
  <text class="dim" x="400" y="208" text-anchor="start" xml:space="preserve">= 0</text>
  <text class="dim" x="452" y="208" text-anchor="start" xml:space="preserve">(ix + 0)</text>
  <text class="t" x="62" y="230" text-anchor="start" xml:space="preserve">RING_TAIL   .equ offset(RingState, tail)</text>
  <text class="dim" x="400" y="230" text-anchor="start" xml:space="preserve">= 1</text>
  <text class="dim" x="452" y="230" text-anchor="start" xml:space="preserve">(ix + 1)</text>
  <text class="t" x="62" y="252" text-anchor="start" xml:space="preserve">RING_COUNT  .equ offset(RingState, count)</text>
  <text class="dim" x="400" y="252" text-anchor="start" xml:space="preserve">= 2</text>
  <text class="dim" x="452" y="252" text-anchor="start" xml:space="preserve">(ix + 2)</text>
  <text class="dimn" x="62" y="288" text-anchor="start" xml:space="preserve">Add a field and every constant that names an offset moves with it. The instructions that use them do not change.</text>
</svg>
