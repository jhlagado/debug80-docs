<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Memory after the string example halts</title>
  <desc id="figDesc">The message at $8000 as six bytes, the eight-byte buffer at $8006 holding the copy with its last two bytes never written, and the three result bytes at $800E.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="40" y="30" text-anchor="start" xml:space="preserve">MESSAGE, SIX BYTES</text>
  <rect class="bx" x="40" y="48" width="54" height="32" rx="2"/>
  <text class="t" x="67" y="68.5" text-anchor="middle" xml:space="preserve">48</text>
  <text class="dim" x="67" y="41" text-anchor="middle" xml:space="preserve">$8000</text>
  <text class="dimn" x="67" y="94" text-anchor="middle" xml:space="preserve">H</text>
  <rect class="bx" x="94" y="48" width="54" height="32" rx="2"/>
  <text class="t" x="121" y="68.5" text-anchor="middle" xml:space="preserve">45</text>
  <text class="dim" x="121" y="41" text-anchor="middle" xml:space="preserve">$8001</text>
  <text class="dimn" x="121" y="94" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="bx" x="148" y="48" width="54" height="32" rx="2"/>
  <text class="t" x="175" y="68.5" text-anchor="middle" xml:space="preserve">4C</text>
  <text class="dim" x="175" y="41" text-anchor="middle" xml:space="preserve">$8002</text>
  <text class="dimn" x="175" y="94" text-anchor="middle" xml:space="preserve">L</text>
  <rect class="bx" x="202" y="48" width="54" height="32" rx="2"/>
  <text class="t" x="229" y="68.5" text-anchor="middle" xml:space="preserve">4C</text>
  <text class="dim" x="229" y="41" text-anchor="middle" xml:space="preserve">$8003</text>
  <text class="dimn" x="229" y="94" text-anchor="middle" xml:space="preserve">L</text>
  <rect class="bx" x="256" y="48" width="54" height="32" rx="2"/>
  <text class="t" x="283" y="68.5" text-anchor="middle" xml:space="preserve">4F</text>
  <text class="dim" x="283" y="41" text-anchor="middle" xml:space="preserve">$8004</text>
  <text class="dimn" x="283" y="94" text-anchor="middle" xml:space="preserve">O</text>
  <rect class="bxs" x="310" y="48" width="54" height="32" rx="2"/>
  <text class="tb" x="337" y="68.5" text-anchor="middle" xml:space="preserve">00</text>
  <text class="dim" x="337" y="41" text-anchor="middle" xml:space="preserve">$8005</text>
  <text class="dimn" x="337" y="94" text-anchor="middle" xml:space="preserve">NUL</text>
  <text class="cap" x="40" y="132" text-anchor="start" xml:space="preserve">BUFFER, EIGHT BYTES RESERVED</text>
  <rect class="bx" x="40" y="150" width="54" height="32" rx="2"/>
  <text class="t" x="67" y="170.5" text-anchor="middle" xml:space="preserve">48</text>
  <text class="dim" x="67" y="143" text-anchor="middle" xml:space="preserve">$8006</text>
  <rect class="bx" x="94" y="150" width="54" height="32" rx="2"/>
  <text class="t" x="121" y="170.5" text-anchor="middle" xml:space="preserve">45</text>
  <text class="dim" x="121" y="143" text-anchor="middle" xml:space="preserve">$8007</text>
  <rect class="bx" x="148" y="150" width="54" height="32" rx="2"/>
  <text class="t" x="175" y="170.5" text-anchor="middle" xml:space="preserve">4C</text>
  <text class="dim" x="175" y="143" text-anchor="middle" xml:space="preserve">$8008</text>
  <rect class="bx" x="202" y="150" width="54" height="32" rx="2"/>
  <text class="t" x="229" y="170.5" text-anchor="middle" xml:space="preserve">4C</text>
  <text class="dim" x="229" y="143" text-anchor="middle" xml:space="preserve">$8009</text>
  <rect class="bx" x="256" y="150" width="54" height="32" rx="2"/>
  <text class="t" x="283" y="170.5" text-anchor="middle" xml:space="preserve">4F</text>
  <text class="dim" x="283" y="143" text-anchor="middle" xml:space="preserve">$800A</text>
  <rect class="bxs" x="310" y="150" width="54" height="32" rx="2"/>
  <text class="tb" x="337" y="170.5" text-anchor="middle" xml:space="preserve">00</text>
  <text class="dim" x="337" y="143" text-anchor="middle" xml:space="preserve">$800B</text>
  <rect class="bx" x="364" y="150" width="54" height="32" rx="2"/>
  <text class="t" x="391" y="170.5" text-anchor="middle" xml:space="preserve">??</text>
  <text class="dim" x="391" y="143" text-anchor="middle" xml:space="preserve">$800C</text>
  <rect class="bx" x="418" y="150" width="54" height="32" rx="2"/>
  <text class="t" x="445" y="170.5" text-anchor="middle" xml:space="preserve">??</text>
  <text class="dim" x="445" y="143" text-anchor="middle" xml:space="preserve">$800D</text>
  <text class="dimn" x="40" y="216" text-anchor="start" xml:space="preserve">str_copy stops after the terminator, so the last two bytes still hold whatever was in RAM.</text>
  <text class="dimn" x="40" y="234" text-anchor="start" xml:space="preserve">.ds reserves space; it does not write anything.</text>
  <text class="cap" x="40" y="268" text-anchor="start" xml:space="preserve">RESULTS</text>
  <rect class="bxs" x="40" y="286" width="92" height="32" rx="2"/>
  <text class="tb" x="86" y="306.5" text-anchor="middle" xml:space="preserve">05</text>
  <text class="dim" x="86" y="279" text-anchor="middle" xml:space="preserve">$800E</text>
  <text class="dimn" x="86" y="332" text-anchor="middle" xml:space="preserve">str_len</text>
  <rect class="bxs" x="132" y="286" width="92" height="32" rx="2"/>
  <text class="tb" x="178" y="306.5" text-anchor="middle" xml:space="preserve">01</text>
  <text class="dim" x="178" y="279" text-anchor="middle" xml:space="preserve">$800F</text>
  <text class="dimn" x="178" y="332" text-anchor="middle" xml:space="preserve">copy_ok</text>
  <rect class="bxs" x="224" y="286" width="92" height="32" rx="2"/>
  <text class="tb" x="270" y="306.5" text-anchor="middle" xml:space="preserve">02</text>
  <text class="dim" x="270" y="279" text-anchor="middle" xml:space="preserve">$8010</text>
  <text class="dimn" x="270" y="332" text-anchor="middle" xml:space="preserve">find_index</text>
</svg>
