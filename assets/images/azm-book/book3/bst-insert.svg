<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">bst_insert_u8 writes through the address of a link</title>
  <desc id="figDesc">A root word at $8000 holding $8003, the node for key 5 at $8003 with its left and right words, and a new node for key 3 at $8008. HL moves from the address of the root word to the address of the left word, and the new node address is stored there.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="60" y="34" text-anchor="start" xml:space="preserve">INSERTING KEY 3 INTO A TREE WHOSE ROOT HOLDS KEY 5</text>
  <text class="dim" x="60" y="90" text-anchor="start" xml:space="preserve">$8000</text>
  <rect class="bx" x="60" y="100" width="96" height="40" rx="3"/>
  <text class="t" x="108" y="126" text-anchor="middle" xml:space="preserve">$8003</text>
  <text class="dimn" x="60" y="156" text-anchor="start" xml:space="preserve">root word</text>
  <text class="dim" x="220" y="90" text-anchor="start" xml:space="preserve">$8003</text>
  <text class="dim" x="264" y="90" text-anchor="start" xml:space="preserve">$8004</text>
  <text class="dim" x="340" y="90" text-anchor="start" xml:space="preserve">$8006</text>
  <rect class="bx" x="220" y="100" width="44" height="40" rx="2"/>
  <rect class="bxs" x="264" y="100" width="76" height="40" rx="2"/>
  <rect class="bx" x="340" y="100" width="76" height="40" rx="2"/>
  <text class="t" x="242" y="126" text-anchor="middle" xml:space="preserve">05</text>
  <text class="tb" x="302" y="126" text-anchor="middle" xml:space="preserve">$8008</text>
  <text class="t" x="378" y="126" text-anchor="middle" xml:space="preserve">$0000</text>
  <text class="dimn" x="242" y="156" text-anchor="middle" xml:space="preserve">value</text>
  <text class="dimn" x="302" y="156" text-anchor="middle" xml:space="preserve">left</text>
  <text class="dimn" x="378" y="156" text-anchor="middle" xml:space="preserve">right</text>
  <text class="dim" x="480" y="90" text-anchor="start" xml:space="preserve">$8008</text>
  <text class="dim" x="524" y="90" text-anchor="start" xml:space="preserve">$8009</text>
  <text class="dim" x="600" y="90" text-anchor="start" xml:space="preserve">$800B</text>
  <rect class="bx" x="480" y="100" width="44" height="40" rx="2"/>
  <rect class="bx" x="524" y="100" width="76" height="40" rx="2"/>
  <rect class="bx" x="600" y="100" width="76" height="40" rx="2"/>
  <text class="t" x="502" y="126" text-anchor="middle" xml:space="preserve">03</text>
  <text class="t" x="562" y="126" text-anchor="middle" xml:space="preserve">$0000</text>
  <text class="t" x="638" y="126" text-anchor="middle" xml:space="preserve">$0000</text>
  <text class="dimn" x="502" y="156" text-anchor="middle" xml:space="preserve">value</text>
  <text class="dimn" x="562" y="156" text-anchor="middle" xml:space="preserve">left</text>
  <text class="dimn" x="638" y="156" text-anchor="middle" xml:space="preserve">right</text>
  <line class="sline" x1="108" y1="200" x2="108" y2="176" marker-end="url(#arS)"/>
  <text class="cap" x="108" y="216" text-anchor="middle" xml:space="preserve">HL STEP 1</text>
  <line class="sline" x1="302" y1="200" x2="302" y2="176" marker-end="url(#arS)"/>
  <text class="cap" x="302" y="216" text-anchor="middle" xml:space="preserve">HL STEP 2</text>
  <path class="sline" d="M578,92 V60 H320 V96" marker-end="url(#arS)"/>
  <text class="t" x="340" y="54" text-anchor="start" xml:space="preserve">ld (hl), e / inc hl / ld (hl), d</text>
  <text class="dimn" x="60" y="250" text-anchor="start" xml:space="preserve">Step 1: the word at $8000 is not zero, so HL follows it to the node holding key 5.</text>
  <text class="dimn" x="60" y="268" text-anchor="start" xml:space="preserve">Step 2: key 3 is below 5, so HL becomes the address of that node's left word, and that word is zero.</text>
  <text class="dimn" x="60" y="298" text-anchor="start" xml:space="preserve">HL holds the address of a link, never the address of a node. That is what lets the same two stores attach a node at</text>
  <text class="dimn" x="60" y="316" text-anchor="start" xml:space="preserve">the root or eight levels down.</text>
</svg>
