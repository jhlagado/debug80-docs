<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Insert at head, before and after</title>
  <desc id="figDesc">The list before the insert, with node_spare reserved and unlinked, and after list_push_head, where the spare node holds $40, its next word holds $8000 and list_head holds $8009.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="30" y="68" text-anchor="start" xml:space="preserve">BEFORE</text>
  <rect class="bx" x="30" y="88" width="100" height="40" rx="3"/>
  <text class="t" x="80" y="114" text-anchor="middle" xml:space="preserve">$8000</text>
  <text class="dim" x="30" y="80" text-anchor="start" xml:space="preserve">list_head</text>
  <text class="dim" x="150" y="80" text-anchor="start" xml:space="preserve">$8009 node_spare</text>
  <text class="dim" x="272" y="80" text-anchor="start" xml:space="preserve">$8000</text>
  <text class="dim" x="394" y="80" text-anchor="start" xml:space="preserve">$8003</text>
  <text class="dim" x="516" y="80" text-anchor="start" xml:space="preserve">$8006</text>
  <rect class="bx" x="272" y="88" width="36" height="40" rx="2"/>
  <rect class="bx" x="308" y="88" width="62" height="40" rx="2"/>
  <text class="t" x="290" y="114" text-anchor="middle" xml:space="preserve">$10</text>
  <text class="t" x="339" y="114" text-anchor="middle" xml:space="preserve">$8003</text>
  <rect class="bx" x="394" y="88" width="36" height="40" rx="2"/>
  <rect class="bx" x="430" y="88" width="62" height="40" rx="2"/>
  <text class="t" x="412" y="114" text-anchor="middle" xml:space="preserve">$22</text>
  <text class="t" x="461" y="114" text-anchor="middle" xml:space="preserve">$8006</text>
  <rect class="bx" x="516" y="88" width="36" height="40" rx="2"/>
  <rect class="bx" x="552" y="88" width="62" height="40" rx="2"/>
  <text class="t" x="534" y="114" text-anchor="middle" xml:space="preserve">$30</text>
  <text class="t" x="583" y="114" text-anchor="middle" xml:space="preserve">$0000</text>
  <text class="cap" x="638" y="114" text-anchor="start" xml:space="preserve">NULL</text>
  <line class="none" x1="370" y1="108" x2="394" y2="108" marker-end="url(#ar)"/>
  <line class="none" x1="492" y1="108" x2="516" y2="108" marker-end="url(#ar)"/>
  <line class="none" x1="614" y1="108" x2="626" y2="108" marker-end="url(#ar)"/>
  <rect class="bxq" x="150" y="88" width="36" height="40" rx="2"/>
  <rect class="bxq" x="186" y="88" width="62" height="40" rx="2"/>
  <text class="dim" x="168" y="114" text-anchor="middle" xml:space="preserve">..</text>
  <text class="dim" x="217" y="114" text-anchor="middle" xml:space="preserve">....</text>
  <path class="none" d="M130,108 H142 V54 H321 V88" marker-end="url(#ar)"/>
  <text class="dimn" x="150" y="146" text-anchor="start" xml:space="preserve">reserved, not yet linked</text>
  <text class="cap" x="30" y="232" text-anchor="start" xml:space="preserve">AFTER</text>
  <rect class="bxs" x="30" y="252" width="100" height="40" rx="3"/>
  <text class="tb" x="80" y="278" text-anchor="middle" xml:space="preserve">$8009</text>
  <text class="dim" x="30" y="244" text-anchor="start" xml:space="preserve">list_head</text>
  <text class="dim" x="150" y="244" text-anchor="start" xml:space="preserve">$8009 node_spare</text>
  <text class="dim" x="272" y="244" text-anchor="start" xml:space="preserve">$8000</text>
  <text class="dim" x="394" y="244" text-anchor="start" xml:space="preserve">$8003</text>
  <text class="dim" x="516" y="244" text-anchor="start" xml:space="preserve">$8006</text>
  <rect class="bx" x="272" y="252" width="36" height="40" rx="2"/>
  <rect class="bx" x="308" y="252" width="62" height="40" rx="2"/>
  <text class="t" x="290" y="278" text-anchor="middle" xml:space="preserve">$10</text>
  <text class="t" x="339" y="278" text-anchor="middle" xml:space="preserve">$8003</text>
  <rect class="bx" x="394" y="252" width="36" height="40" rx="2"/>
  <rect class="bx" x="430" y="252" width="62" height="40" rx="2"/>
  <text class="t" x="412" y="278" text-anchor="middle" xml:space="preserve">$22</text>
  <text class="t" x="461" y="278" text-anchor="middle" xml:space="preserve">$8006</text>
  <rect class="bx" x="516" y="252" width="36" height="40" rx="2"/>
  <rect class="bx" x="552" y="252" width="62" height="40" rx="2"/>
  <text class="t" x="534" y="278" text-anchor="middle" xml:space="preserve">$30</text>
  <text class="t" x="583" y="278" text-anchor="middle" xml:space="preserve">$0000</text>
  <text class="cap" x="638" y="278" text-anchor="start" xml:space="preserve">NULL</text>
  <line class="none" x1="370" y1="272" x2="394" y2="272" marker-end="url(#ar)"/>
  <line class="none" x1="492" y1="272" x2="516" y2="272" marker-end="url(#ar)"/>
  <line class="none" x1="614" y1="272" x2="626" y2="272" marker-end="url(#ar)"/>
  <rect class="bx" x="150" y="252" width="36" height="40" rx="2"/>
  <rect class="bxs" x="186" y="252" width="62" height="40" rx="2"/>
  <text class="tb" x="168" y="278" text-anchor="middle" xml:space="preserve">$40</text>
  <text class="tb" x="217" y="278" text-anchor="middle" xml:space="preserve">$8000</text>
  <line class="sline" x1="130" y1="272" x2="150" y2="272" marker-end="url(#arS)"/>
  <line class="none" x1="248" y1="272" x2="272" y2="272" marker-end="url(#ar)"/>
  <text class="dimn" x="30" y="330" text-anchor="start" xml:space="preserve">Two stores change the shape: the new node's next word takes the old head, then list_head takes the new node.</text>
  <text class="dimn" x="30" y="348" text-anchor="start" xml:space="preserve">The payload store is a third, and no existing node is touched. The sum goes from $0062 to $00A2.</text>
</svg>
