<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">rlca against rla</title>
  <desc id="figDesc">Two panels using the same byte $B4 and the same clear carry. rlca rotates A circularly and copies the wrapped bit into carry, giving $69. rla rotates A and carry together as a nine-bit ring, giving $68. Bit 0 is the bit that differs.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <rect class="bxq" x="20" y="42" width="320" height="250" rx="4"/>
  <text class="tb" x="34" y="66" text-anchor="start" xml:space="preserve">rlca</text>
  <text class="dimn" x="34" y="84" text-anchor="start" xml:space="preserve">circular: A alone</text>
  <text class="dim" x="53" y="104" text-anchor="middle" xml:space="preserve">C</text>
  <text class="dim" x="198" y="104" text-anchor="middle" xml:space="preserve">A</text>
  <text class="dim" x="250" y="104" text-anchor="start" xml:space="preserve">before $B4</text>
  <rect class="bx" x="38" y="112" width="30" height="26" rx="2"/>
  <text class="t" x="53" y="130" text-anchor="middle" xml:space="preserve">0</text>
  <rect class="bx" x="78" y="112" width="30" height="26" rx="2"/>
  <text class="t" x="93" y="129.5" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="bx" x="108" y="112" width="30" height="26" rx="2"/>
  <text class="t" x="123" y="129.5" text-anchor="middle" xml:space="preserve">0</text>
  <rect class="bx" x="138" y="112" width="30" height="26" rx="2"/>
  <text class="t" x="153" y="129.5" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="bx" x="168" y="112" width="30" height="26" rx="2"/>
  <text class="t" x="183" y="129.5" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="bx" x="198" y="112" width="30" height="26" rx="2"/>
  <text class="t" x="213" y="129.5" text-anchor="middle" xml:space="preserve">0</text>
  <rect class="bx" x="228" y="112" width="30" height="26" rx="2"/>
  <text class="t" x="243" y="129.5" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="bx" x="258" y="112" width="30" height="26" rx="2"/>
  <text class="t" x="273" y="129.5" text-anchor="middle" xml:space="preserve">0</text>
  <rect class="bx" x="288" y="112" width="30" height="26" rx="2"/>
  <text class="t" x="303" y="129.5" text-anchor="middle" xml:space="preserve">0</text>
  <path class="sline" d="M93,138 C93,204 303,204 303,220" marker-end="url(#arS)"/>
  <path class="dash" d="M93,138 C93,176 53,176 53,220" marker-end="url(#arD)"/>
  <text class="dimn" x="34" y="170" text-anchor="start" xml:space="preserve">copy</text>
  <rect class="bxs" x="38" y="224" width="30" height="26" rx="2"/>
  <text class="tb" x="53" y="242" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="bxs" x="78" y="224" width="30" height="26" rx="2"/>
  <text class="tb" x="93" y="241.5" text-anchor="middle" xml:space="preserve">0</text>
  <rect class="bxs" x="108" y="224" width="30" height="26" rx="2"/>
  <text class="tb" x="123" y="241.5" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="bx" x="138" y="224" width="30" height="26" rx="2"/>
  <text class="t" x="153" y="241.5" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="bxs" x="168" y="224" width="30" height="26" rx="2"/>
  <text class="tb" x="183" y="241.5" text-anchor="middle" xml:space="preserve">0</text>
  <rect class="bxs" x="198" y="224" width="30" height="26" rx="2"/>
  <text class="tb" x="213" y="241.5" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="bxs" x="228" y="224" width="30" height="26" rx="2"/>
  <text class="tb" x="243" y="241.5" text-anchor="middle" xml:space="preserve">0</text>
  <rect class="bx" x="258" y="224" width="30" height="26" rx="2"/>
  <text class="t" x="273" y="241.5" text-anchor="middle" xml:space="preserve">0</text>
  <rect class="bxs" x="288" y="224" width="30" height="26" rx="2"/>
  <text class="tb" x="303" y="241.5" text-anchor="middle" xml:space="preserve">1</text>
  <text class="dim" x="34" y="268" text-anchor="start" xml:space="preserve">after  $69</text>
  <text class="dimn" x="150" y="268" text-anchor="start" xml:space="preserve">bit 0 = old bit 7</text>
  <rect class="bxq" x="380" y="42" width="320" height="250" rx="4"/>
  <text class="tb" x="394" y="66" text-anchor="start" xml:space="preserve">rla</text>
  <text class="dimn" x="394" y="84" text-anchor="start" xml:space="preserve">nine-bit ring: A and carry</text>
  <text class="dim" x="413" y="104" text-anchor="middle" xml:space="preserve">C</text>
  <text class="dim" x="558" y="104" text-anchor="middle" xml:space="preserve">A</text>
  <text class="dim" x="610" y="104" text-anchor="start" xml:space="preserve">before $B4</text>
  <rect class="bx" x="398" y="112" width="30" height="26" rx="2"/>
  <text class="t" x="413" y="130" text-anchor="middle" xml:space="preserve">0</text>
  <rect class="bx" x="438" y="112" width="30" height="26" rx="2"/>
  <text class="t" x="453" y="129.5" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="bx" x="468" y="112" width="30" height="26" rx="2"/>
  <text class="t" x="483" y="129.5" text-anchor="middle" xml:space="preserve">0</text>
  <rect class="bx" x="498" y="112" width="30" height="26" rx="2"/>
  <text class="t" x="513" y="129.5" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="bx" x="528" y="112" width="30" height="26" rx="2"/>
  <text class="t" x="543" y="129.5" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="bx" x="558" y="112" width="30" height="26" rx="2"/>
  <text class="t" x="573" y="129.5" text-anchor="middle" xml:space="preserve">0</text>
  <rect class="bx" x="588" y="112" width="30" height="26" rx="2"/>
  <text class="t" x="603" y="129.5" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="bx" x="618" y="112" width="30" height="26" rx="2"/>
  <text class="t" x="633" y="129.5" text-anchor="middle" xml:space="preserve">0</text>
  <rect class="bx" x="648" y="112" width="30" height="26" rx="2"/>
  <text class="t" x="663" y="129.5" text-anchor="middle" xml:space="preserve">0</text>
  <path class="sline" d="M453,138 C453,176 413,176 413,220" marker-end="url(#arS)"/>
  <path class="sline" d="M413,138 C413,204 663,204 663,220" marker-end="url(#arS)"/>
  <rect class="bxs" x="398" y="224" width="30" height="26" rx="2"/>
  <text class="tb" x="413" y="242" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="bxs" x="438" y="224" width="30" height="26" rx="2"/>
  <text class="tb" x="453" y="241.5" text-anchor="middle" xml:space="preserve">0</text>
  <rect class="bxs" x="468" y="224" width="30" height="26" rx="2"/>
  <text class="tb" x="483" y="241.5" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="bx" x="498" y="224" width="30" height="26" rx="2"/>
  <text class="t" x="513" y="241.5" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="bxs" x="528" y="224" width="30" height="26" rx="2"/>
  <text class="tb" x="543" y="241.5" text-anchor="middle" xml:space="preserve">0</text>
  <rect class="bxs" x="558" y="224" width="30" height="26" rx="2"/>
  <text class="tb" x="573" y="241.5" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="bxs" x="588" y="224" width="30" height="26" rx="2"/>
  <text class="tb" x="603" y="241.5" text-anchor="middle" xml:space="preserve">0</text>
  <rect class="bx" x="618" y="224" width="30" height="26" rx="2"/>
  <text class="t" x="633" y="241.5" text-anchor="middle" xml:space="preserve">0</text>
  <rect class="bx" x="648" y="224" width="30" height="26" rx="2"/>
  <text class="t" x="663" y="241.5" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dim" x="394" y="268" text-anchor="start" xml:space="preserve">after  $68</text>
  <text class="dimn" x="510" y="268" text-anchor="start" xml:space="preserve">bit 0 = old carry</text>
  <text class="dimn" x="20" y="316" text-anchor="start" xml:space="preserve">Both leave carry holding the old bit 7. The difference is bit 0, which is why rla can carry a bit between registers</text>
  <text class="dimn" x="20" y="334" text-anchor="start" xml:space="preserve">and rlca cannot. or a clears carry first, so the rr a in extract_bit_u8 shifts a zero into bit 7.</text>
</svg>
