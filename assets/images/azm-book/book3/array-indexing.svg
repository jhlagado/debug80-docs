<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Reaching one element of a byte table</title>
  <desc id="figDesc">The four instructions that read values[3], each with the register state it produces, drawn against the eight-byte table at $8000 with the element at $8003 marked.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="40" y="30" text-anchor="start" xml:space="preserve">READING VALUES[3]</text>
  <text class="t" x="40" y="56" text-anchor="start" xml:space="preserve">ld hl, values</text>
  <text class="dim" x="250" y="56" text-anchor="start" xml:space="preserve">HL = $8000</text>
  <text class="t" x="40" y="80" text-anchor="start" xml:space="preserve">ld b, 0</text>
  <text class="dim" x="250" y="80" text-anchor="start" xml:space="preserve">B = $00</text>
  <text class="t" x="40" y="104" text-anchor="start" xml:space="preserve">ld c, 3</text>
  <text class="dim" x="250" y="104" text-anchor="start" xml:space="preserve">C = $03</text>
  <text class="t" x="40" y="128" text-anchor="start" xml:space="preserve">add hl, bc</text>
  <text class="dim" x="250" y="128" text-anchor="start" xml:space="preserve">HL = $8003</text>
  <text class="tb" x="40" y="152" text-anchor="start" xml:space="preserve">ld a, (hl)</text>
  <text class="nb" x="250" y="152" text-anchor="start" xml:space="preserve">A = 2</text>
  <text class="dimn" x="400" y="60" text-anchor="start" xml:space="preserve">values is the address of element 0.</text>
  <text class="dimn" x="400" y="78" text-anchor="start" xml:space="preserve">It is not the 9 stored there.</text>
  <text class="dimn" x="400" y="108" text-anchor="start" xml:space="preserve">BC carries the index because add hl, bc</text>
  <text class="dimn" x="400" y="126" text-anchor="start" xml:space="preserve">is the only 16-bit add the Z80 offers here.</text>
  <text class="dim" x="56" y="216" text-anchor="end" xml:space="preserve">address</text>
  <text class="dim" x="56" y="240" text-anchor="end" xml:space="preserve">index</text>
  <text class="dim" x="103" y="216" text-anchor="middle" xml:space="preserve">$8000</text>
  <text class="dim" x="181" y="216" text-anchor="middle" xml:space="preserve"></text>
  <text class="dim" x="259" y="216" text-anchor="middle" xml:space="preserve"></text>
  <text class="dim" x="337" y="216" text-anchor="middle" xml:space="preserve">$8003</text>
  <text class="dim" x="415" y="216" text-anchor="middle" xml:space="preserve"></text>
  <text class="dim" x="493" y="216" text-anchor="middle" xml:space="preserve"></text>
  <text class="dim" x="571" y="216" text-anchor="middle" xml:space="preserve"></text>
  <text class="dim" x="649" y="216" text-anchor="middle" xml:space="preserve"></text>
  <text class="dim" x="103" y="240" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dim" x="181" y="240" text-anchor="middle" xml:space="preserve">1</text>
  <text class="dim" x="259" y="240" text-anchor="middle" xml:space="preserve">2</text>
  <text class="dim" x="337" y="240" text-anchor="middle" xml:space="preserve">3</text>
  <text class="dim" x="415" y="240" text-anchor="middle" xml:space="preserve">4</text>
  <text class="dim" x="493" y="240" text-anchor="middle" xml:space="preserve">5</text>
  <text class="dim" x="571" y="240" text-anchor="middle" xml:space="preserve">6</text>
  <text class="dim" x="649" y="240" text-anchor="middle" xml:space="preserve">7</text>
  <rect class="bx" x="64" y="252" width="78" height="34" rx="2"/>
  <text class="t" x="103" y="273.5" text-anchor="middle" xml:space="preserve">9</text>
  <rect class="bx" x="142" y="252" width="78" height="34" rx="2"/>
  <text class="t" x="181" y="273.5" text-anchor="middle" xml:space="preserve">4</text>
  <rect class="bx" x="220" y="252" width="78" height="34" rx="2"/>
  <text class="t" x="259" y="273.5" text-anchor="middle" xml:space="preserve">6</text>
  <rect class="bxs" x="298" y="252" width="78" height="34" rx="2"/>
  <text class="tb" x="337" y="273.5" text-anchor="middle" xml:space="preserve">2</text>
  <rect class="bx" x="376" y="252" width="78" height="34" rx="2"/>
  <text class="t" x="415" y="273.5" text-anchor="middle" xml:space="preserve">8</text>
  <rect class="bx" x="454" y="252" width="78" height="34" rx="2"/>
  <text class="t" x="493" y="273.5" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="bx" x="532" y="252" width="78" height="34" rx="2"/>
  <text class="t" x="571" y="273.5" text-anchor="middle" xml:space="preserve">7</text>
  <rect class="bx" x="610" y="252" width="78" height="34" rx="2"/>
  <text class="t" x="649" y="273.5" text-anchor="middle" xml:space="preserve">3</text>
  <line class="sline" x1="337" y1="320" x2="337" y2="292" marker-end="url(#arS)"/>
  <text class="dimn" x="337" y="340" text-anchor="middle" xml:space="preserve">HL after add hl, bc</text>
  <text class="dimn" x="40" y="372" text-anchor="start" xml:space="preserve">One byte per element, so the step from one element to the next is inc hl. Chapter 5 replaces that 1 with sizeof.</text>
</svg>
