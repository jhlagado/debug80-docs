<svg xmlns="http://www.w3.org/2000/svg" width="720" height="358" viewBox="0 0 720 358" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Linear search for the first value of at least five</title>
  <desc id="figDesc">The sorted table 1 2 3 4 6 7 8 9 walked from index 0, each element compared against 5, stopping at the 6 at index 4.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="150" y="30" text-anchor="start" xml:space="preserve">VALUES AFTER THE SORT</text>
  <rect class="bx" x="150" y="48" width="46" height="32" rx="2"/>
  <text class="t" x="173" y="68.5" text-anchor="middle" xml:space="preserve">1</text>
  <text class="dimn" x="173" y="94" text-anchor="middle" xml:space="preserve">0</text>
  <rect class="bx" x="196" y="48" width="46" height="32" rx="2"/>
  <text class="t" x="219" y="68.5" text-anchor="middle" xml:space="preserve">2</text>
  <text class="dimn" x="219" y="94" text-anchor="middle" xml:space="preserve">1</text>
  <rect class="bx" x="242" y="48" width="46" height="32" rx="2"/>
  <text class="t" x="265" y="68.5" text-anchor="middle" xml:space="preserve">3</text>
  <text class="dimn" x="265" y="94" text-anchor="middle" xml:space="preserve">2</text>
  <rect class="bx" x="288" y="48" width="46" height="32" rx="2"/>
  <text class="t" x="311" y="68.5" text-anchor="middle" xml:space="preserve">4</text>
  <text class="dimn" x="311" y="94" text-anchor="middle" xml:space="preserve">3</text>
  <rect class="bxs" x="334" y="48" width="46" height="32" rx="2"/>
  <text class="tb" x="357" y="68.5" text-anchor="middle" xml:space="preserve">6</text>
  <text class="dimn" x="357" y="94" text-anchor="middle" xml:space="preserve">4</text>
  <rect class="bx" x="380" y="48" width="46" height="32" rx="2"/>
  <text class="t" x="403" y="68.5" text-anchor="middle" xml:space="preserve">7</text>
  <text class="dimn" x="403" y="94" text-anchor="middle" xml:space="preserve">5</text>
  <rect class="bx" x="426" y="48" width="46" height="32" rx="2"/>
  <text class="t" x="449" y="68.5" text-anchor="middle" xml:space="preserve">8</text>
  <text class="dimn" x="449" y="94" text-anchor="middle" xml:space="preserve">6</text>
  <rect class="bx" x="472" y="48" width="46" height="32" rx="2"/>
  <text class="t" x="495" y="68.5" text-anchor="middle" xml:space="preserve">9</text>
  <text class="dimn" x="495" y="94" text-anchor="middle" xml:space="preserve">7</text>
  <line class="dash" x1="173" y1="118" x2="173" y2="130"/>
  <line class="dash" x1="219" y1="118" x2="219" y2="130"/>
  <line class="dash" x1="265" y1="118" x2="265" y2="130"/>
  <line class="dash" x1="311" y1="118" x2="311" y2="130"/>
  <line class="sline" x1="357" y1="130" x2="357" y2="118" marker-end="url(#arS)"/>
  <text class="cap" x="357" y="146" text-anchor="middle" xml:space="preserve">HL stops</text>
  <text class="cap" x="30" y="182" text-anchor="start" xml:space="preserve">CP C, THEN JR NC</text>
  <text class="t" x="30" y="204" text-anchor="start" xml:space="preserve">values[0] = 1</text>
  <text class="t" x="190" y="204" text-anchor="start" xml:space="preserve">1 &lt; 5</text>
  <text class="dim" x="280" y="204" text-anchor="start" xml:space="preserve">carry set</text>
  <text class="dimn" x="400" y="204" text-anchor="start" xml:space="preserve">inc hl, inc b, keep going</text>
  <text class="t" x="30" y="228" text-anchor="start" xml:space="preserve">values[1] = 2</text>
  <text class="t" x="190" y="228" text-anchor="start" xml:space="preserve">2 &lt; 5</text>
  <text class="dim" x="280" y="228" text-anchor="start" xml:space="preserve">carry set</text>
  <text class="dimn" x="400" y="228" text-anchor="start" xml:space="preserve">inc hl, inc b, keep going</text>
  <text class="t" x="30" y="252" text-anchor="start" xml:space="preserve">values[2] = 3</text>
  <text class="t" x="190" y="252" text-anchor="start" xml:space="preserve">3 &lt; 5</text>
  <text class="dim" x="280" y="252" text-anchor="start" xml:space="preserve">carry set</text>
  <text class="dimn" x="400" y="252" text-anchor="start" xml:space="preserve">inc hl, inc b, keep going</text>
  <text class="t" x="30" y="276" text-anchor="start" xml:space="preserve">values[3] = 4</text>
  <text class="t" x="190" y="276" text-anchor="start" xml:space="preserve">4 &lt; 5</text>
  <text class="dim" x="280" y="276" text-anchor="start" xml:space="preserve">carry set</text>
  <text class="dimn" x="400" y="276" text-anchor="start" xml:space="preserve">inc hl, inc b, keep going</text>
  <text class="t" x="30" y="300" text-anchor="start" xml:space="preserve">values[4] = 6</text>
  <text class="t" x="190" y="300" text-anchor="start" xml:space="preserve">6 ≥ 5</text>
  <text class="dim" x="280" y="300" text-anchor="start" xml:space="preserve">carry clear</text>
  <text class="tb" x="400" y="300" text-anchor="start" xml:space="preserve">jr nc taken, A = 4</text>
  <text class="dimn" x="30" y="322" text-anchor="start" xml:space="preserve">The table holds no 5. The routine returns the first index at or above the threshold.</text>
  <text class="dimn" x="30" y="340" text-anchor="start" xml:space="preserve">$FF means not found, and is not a valid offset into an eight-element table.</text>
</svg>
