<svg xmlns="http://www.w3.org/2000/svg" width="720" height="334" viewBox="0 0 720 334" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">strcmp_u8 walking two strings together</title>
  <desc id="figDesc">buffer walked by HL above and message walked by DE below, the six columns compared in step, the final column holding two zero bytes and returning equal.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="30" y="76" text-anchor="start" xml:space="preserve">HL</text>
  <text class="dimn" x="30" y="94" text-anchor="start" xml:space="preserve">buffer</text>
  <rect class="bx" x="150" y="56" width="54" height="32" rx="2"/>
  <text class="t" x="177" y="76.5" text-anchor="middle" xml:space="preserve">48</text>
  <rect class="bx" x="204" y="56" width="54" height="32" rx="2"/>
  <text class="t" x="231" y="76.5" text-anchor="middle" xml:space="preserve">45</text>
  <rect class="bx" x="258" y="56" width="54" height="32" rx="2"/>
  <text class="t" x="285" y="76.5" text-anchor="middle" xml:space="preserve">4C</text>
  <rect class="bx" x="312" y="56" width="54" height="32" rx="2"/>
  <text class="t" x="339" y="76.5" text-anchor="middle" xml:space="preserve">4C</text>
  <rect class="bx" x="366" y="56" width="54" height="32" rx="2"/>
  <text class="t" x="393" y="76.5" text-anchor="middle" xml:space="preserve">4F</text>
  <rect class="bxs" x="420" y="56" width="54" height="32" rx="2"/>
  <text class="tb" x="447" y="76.5" text-anchor="middle" xml:space="preserve">00</text>
  <text class="cap" x="30" y="200" text-anchor="start" xml:space="preserve">DE</text>
  <text class="dimn" x="30" y="218" text-anchor="start" xml:space="preserve">message</text>
  <rect class="bx" x="150" y="180" width="54" height="32" rx="2"/>
  <text class="t" x="177" y="200.5" text-anchor="middle" xml:space="preserve">48</text>
  <text class="dimn" x="177" y="226" text-anchor="middle" xml:space="preserve">equal</text>
  <rect class="bx" x="204" y="180" width="54" height="32" rx="2"/>
  <text class="t" x="231" y="200.5" text-anchor="middle" xml:space="preserve">45</text>
  <text class="dimn" x="231" y="226" text-anchor="middle" xml:space="preserve">equal</text>
  <rect class="bx" x="258" y="180" width="54" height="32" rx="2"/>
  <text class="t" x="285" y="200.5" text-anchor="middle" xml:space="preserve">4C</text>
  <text class="dimn" x="285" y="226" text-anchor="middle" xml:space="preserve">equal</text>
  <rect class="bx" x="312" y="180" width="54" height="32" rx="2"/>
  <text class="t" x="339" y="200.5" text-anchor="middle" xml:space="preserve">4C</text>
  <text class="dimn" x="339" y="226" text-anchor="middle" xml:space="preserve">equal</text>
  <rect class="bx" x="366" y="180" width="54" height="32" rx="2"/>
  <text class="t" x="393" y="200.5" text-anchor="middle" xml:space="preserve">4F</text>
  <text class="dimn" x="393" y="226" text-anchor="middle" xml:space="preserve">equal</text>
  <rect class="bxs" x="420" y="180" width="54" height="32" rx="2"/>
  <text class="tb" x="447" y="200.5" text-anchor="middle" xml:space="preserve">00</text>
  <text class="dimn" x="447" y="226" text-anchor="middle" xml:space="preserve">both null</text>
  <line class="dash" x1="177" y1="92" x2="177" y2="176" marker-end="url(#arD)"/>
  <line class="dash" x1="231" y1="92" x2="231" y2="176" marker-end="url(#arD)"/>
  <line class="dash" x1="285" y1="92" x2="285" y2="176" marker-end="url(#arD)"/>
  <line class="dash" x1="339" y1="92" x2="339" y2="176" marker-end="url(#arD)"/>
  <line class="dash" x1="393" y1="92" x2="393" y2="176" marker-end="url(#arD)"/>
  <line class="sline" x1="447" y1="92" x2="447" y2="176" marker-end="url(#arS)"/>
  <text class="t" x="500" y="62" text-anchor="start" xml:space="preserve">ld a, (hl)</text>
  <text class="t" x="500" y="82" text-anchor="start" xml:space="preserve">push af</text>
  <text class="t" x="500" y="102" text-anchor="start" xml:space="preserve">ld a, (de)</text>
  <text class="t" x="500" y="122" text-anchor="start" xml:space="preserve">pop bc</text>
  <text class="t" x="500" y="142" text-anchor="start" xml:space="preserve">cp b</text>
  <text class="dimn" x="500" y="172" text-anchor="start" xml:space="preserve">A holds the DE byte,</text>
  <text class="dimn" x="500" y="190" text-anchor="start" xml:space="preserve">B holds the HL byte,</text>
  <text class="dimn" x="500" y="208" text-anchor="start" xml:space="preserve">so carry means the HL</text>
  <text class="dimn" x="500" y="226" text-anchor="start" xml:space="preserve">string is the greater.</text>
  <text class="dimn" x="30" y="268" text-anchor="start" xml:space="preserve">One column is one pass of the loop. Neither pointer runs ahead of the other.</text>
  <text class="dimn" x="30" y="300" text-anchor="start" xml:space="preserve">Both strings are HELLO, so every column matches and the walk ends on two zero bytes.</text>
  <text class="dimn" x="30" y="318" text-anchor="start" xml:space="preserve">strcmp_u8 returns 0, and copy_ok becomes 1.</text>
</svg>
