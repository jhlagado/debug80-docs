<svg xmlns="http://www.w3.org/2000/svg" width="720" height="342" viewBox="0 0 720 342" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">strcpy_u8 copying with two pointers</title>
  <desc id="figDesc">The six bytes of message read through HL and written through DE into buffer, six arrows in step, the terminator copied last.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="130" y="30" text-anchor="start" xml:space="preserve">MESSAGE, READ THROUGH HL</text>
  <rect class="bx" x="130" y="56" width="54" height="32" rx="2"/>
  <text class="t" x="157" y="76.5" text-anchor="middle" xml:space="preserve">48</text>
  <text class="dim" x="157" y="49" text-anchor="middle" xml:space="preserve">$8000</text>
  <rect class="bx" x="184" y="56" width="54" height="32" rx="2"/>
  <text class="t" x="211" y="76.5" text-anchor="middle" xml:space="preserve">45</text>
  <rect class="bx" x="238" y="56" width="54" height="32" rx="2"/>
  <text class="t" x="265" y="76.5" text-anchor="middle" xml:space="preserve">4C</text>
  <rect class="bx" x="292" y="56" width="54" height="32" rx="2"/>
  <text class="t" x="319" y="76.5" text-anchor="middle" xml:space="preserve">4C</text>
  <rect class="bx" x="346" y="56" width="54" height="32" rx="2"/>
  <text class="t" x="373" y="76.5" text-anchor="middle" xml:space="preserve">4F</text>
  <rect class="bxs" x="400" y="56" width="54" height="32" rx="2"/>
  <text class="tb" x="427" y="76.5" text-anchor="middle" xml:space="preserve">00</text>
  <text class="dim" x="427" y="49" text-anchor="middle" xml:space="preserve">$8005</text>
  <rect class="bx" x="130" y="218" width="54" height="32" rx="2"/>
  <text class="t" x="157" y="238.5" text-anchor="middle" xml:space="preserve">48</text>
  <text class="dimn" x="157" y="264" text-anchor="middle" xml:space="preserve">$8006</text>
  <rect class="bx" x="184" y="218" width="54" height="32" rx="2"/>
  <text class="t" x="211" y="238.5" text-anchor="middle" xml:space="preserve">45</text>
  <rect class="bx" x="238" y="218" width="54" height="32" rx="2"/>
  <text class="t" x="265" y="238.5" text-anchor="middle" xml:space="preserve">4C</text>
  <rect class="bx" x="292" y="218" width="54" height="32" rx="2"/>
  <text class="t" x="319" y="238.5" text-anchor="middle" xml:space="preserve">4C</text>
  <rect class="bx" x="346" y="218" width="54" height="32" rx="2"/>
  <text class="t" x="373" y="238.5" text-anchor="middle" xml:space="preserve">4F</text>
  <rect class="bxs" x="400" y="218" width="54" height="32" rx="2"/>
  <text class="tb" x="427" y="238.5" text-anchor="middle" xml:space="preserve">00</text>
  <text class="dimn" x="427" y="264" text-anchor="middle" xml:space="preserve">$800B</text>
  <text class="cap" x="130" y="292" text-anchor="start" xml:space="preserve">BUFFER, WRITTEN THROUGH DE</text>
  <line class="dash" x1="157" y1="92" x2="157" y2="214" marker-end="url(#arD)"/>
  <line class="dash" x1="211" y1="92" x2="211" y2="214" marker-end="url(#arD)"/>
  <line class="dash" x1="265" y1="92" x2="265" y2="214" marker-end="url(#arD)"/>
  <line class="dash" x1="319" y1="92" x2="319" y2="214" marker-end="url(#arD)"/>
  <line class="dash" x1="373" y1="92" x2="373" y2="214" marker-end="url(#arD)"/>
  <line class="sline" x1="427" y1="92" x2="427" y2="214" marker-end="url(#arS)"/>
  <text class="t" x="30" y="112" text-anchor="start" xml:space="preserve">ld a, (hl)</text>
  <text class="t" x="30" y="132" text-anchor="start" xml:space="preserve">ld (de), a</text>
  <text class="t" x="30" y="152" text-anchor="start" xml:space="preserve">inc hl</text>
  <text class="t" x="30" y="172" text-anchor="start" xml:space="preserve">inc de</text>
  <text class="t" x="30" y="192" text-anchor="start" xml:space="preserve">or a</text>
  <text class="dimn" x="470" y="132" text-anchor="start" xml:space="preserve">or a tests the byte just</text>
  <text class="dimn" x="470" y="150" text-anchor="start" xml:space="preserve">copied, so the loop exits</text>
  <text class="dimn" x="470" y="168" text-anchor="start" xml:space="preserve">after the null is written.</text>
  <text class="dimn" x="30" y="326" text-anchor="start" xml:space="preserve">DE ends one past the null. Reload it from the buffer label before any second pass.</text>
</svg>
