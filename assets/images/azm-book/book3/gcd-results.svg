<svg xmlns="http://www.w3.org/2000/svg" width="720" height="366" viewBox="0 0 720 366" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Where a word result and a byte result land in memory</title>
  <desc id="figDesc">HL holding 00 in H and 06 in L, stored to gcd_result at $8000 as low byte then high byte with the two halves crossing over, and power_result holding 51 in the single byte at $8002.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="250" y="30" text-anchor="start" xml:space="preserve">HL WHEN GCD_U16 RETURNS</text>
  <rect class="bx" x="250" y="48" width="100" height="36" rx="2"/>
  <text class="t" x="300" y="70.5" text-anchor="middle" xml:space="preserve">00</text>
  <text class="dimn" x="300" y="98" text-anchor="middle" xml:space="preserve">H</text>
  <rect class="bx" x="350" y="48" width="100" height="36" rx="2"/>
  <text class="t" x="400" y="70.5" text-anchor="middle" xml:space="preserve">06</text>
  <text class="dimn" x="400" y="98" text-anchor="middle" xml:space="preserve">L</text>
  <text class="t" x="40" y="72" text-anchor="start" xml:space="preserve">ld (gcd_result), hl</text>
  <text class="dimn" x="40" y="94" text-anchor="start" xml:space="preserve">one store, two bytes</text>
  <path class="sline" d="M400,112 V136 H300 V172" marker-end="url(#arS)"/>
  <path class="sline" d="M300,112 V154 H400 V172" marker-end="url(#arS)"/>
  <text class="dimn" x="40" y="140" text-anchor="start" xml:space="preserve">low byte first,</text>
  <text class="dimn" x="40" y="158" text-anchor="start" xml:space="preserve">high byte second</text>
  <rect class="bxs" x="250" y="176" width="100" height="36" rx="2"/>
  <text class="tb" x="300" y="198.5" text-anchor="middle" xml:space="preserve">06</text>
  <text class="dimn" x="300" y="226" text-anchor="middle" xml:space="preserve">$8000</text>
  <rect class="bxs" x="350" y="176" width="100" height="36" rx="2"/>
  <text class="tb" x="400" y="198.5" text-anchor="middle" xml:space="preserve">00</text>
  <text class="dimn" x="400" y="226" text-anchor="middle" xml:space="preserve">$8001</text>
  <path class="rule" d="M250,236 V248 H450 V236"/>
  <text class="dimn" x="350" y="266" text-anchor="middle" xml:space="preserve">gcd_result, .ds word</text>
  <text class="cap" x="500" y="156" text-anchor="start" xml:space="preserve">POWER_U8</text>
  <rect class="bxs" x="500" y="176" width="100" height="36" rx="2"/>
  <text class="tb" x="550" y="198.5" text-anchor="middle" xml:space="preserve">51</text>
  <text class="dimn" x="550" y="226" text-anchor="middle" xml:space="preserve">$8002</text>
  <path class="rule" d="M500,236 V248 H600 V236"/>
  <text class="dimn" x="550" y="266" text-anchor="middle" xml:space="preserve">power_result, .ds byte</text>
  <text class="dimn" x="40" y="306" text-anchor="start" xml:space="preserve">.ds word reserves two bytes and .ds byte reserves one, so the two results sit at $8000 and $8002 with nothing counted by hand.</text>
  <text class="dimn" x="40" y="324" text-anchor="start" xml:space="preserve">Reading $8000 and $8001 back as a word gives 6; the byte at $8002 is 81.</text>
  <text class="dimn" x="40" y="350" text-anchor="start" xml:space="preserve">Little-endian order applies to every 16-bit store, not only to this one.</text>
</svg>
