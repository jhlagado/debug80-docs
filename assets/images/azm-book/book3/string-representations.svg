<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Null-terminated against length-prefixed</title>
  <desc id="figDesc">The same five characters stored two ways: six bytes ending in a zero terminator, and six bytes starting with a count of 5 followed by the text.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <rect class="bxq" x="24" y="44" width="326" height="232" rx="4"/>
  <text class="cap" x="40" y="68" text-anchor="start" xml:space="preserve">NULL-TERMINATED, THE BOOK'S FORM</text>
  <rect class="bx" x="40" y="96" width="48" height="32" rx="2"/>
  <text class="t" x="64" y="116.5" text-anchor="middle" xml:space="preserve">48</text>
  <text class="dim" x="64" y="89" text-anchor="middle" xml:space="preserve">+0</text>
  <text class="dimn" x="64" y="142" text-anchor="middle" xml:space="preserve">H</text>
  <rect class="bx" x="88" y="96" width="48" height="32" rx="2"/>
  <text class="t" x="112" y="116.5" text-anchor="middle" xml:space="preserve">45</text>
  <text class="dim" x="112" y="89" text-anchor="middle" xml:space="preserve">+1</text>
  <text class="dimn" x="112" y="142" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="bx" x="136" y="96" width="48" height="32" rx="2"/>
  <text class="t" x="160" y="116.5" text-anchor="middle" xml:space="preserve">4C</text>
  <text class="dim" x="160" y="89" text-anchor="middle" xml:space="preserve">+2</text>
  <text class="dimn" x="160" y="142" text-anchor="middle" xml:space="preserve">L</text>
  <rect class="bx" x="184" y="96" width="48" height="32" rx="2"/>
  <text class="t" x="208" y="116.5" text-anchor="middle" xml:space="preserve">4C</text>
  <text class="dim" x="208" y="89" text-anchor="middle" xml:space="preserve">+3</text>
  <text class="dimn" x="208" y="142" text-anchor="middle" xml:space="preserve">L</text>
  <rect class="bx" x="232" y="96" width="48" height="32" rx="2"/>
  <text class="t" x="256" y="116.5" text-anchor="middle" xml:space="preserve">4F</text>
  <text class="dim" x="256" y="89" text-anchor="middle" xml:space="preserve">+4</text>
  <text class="dimn" x="256" y="142" text-anchor="middle" xml:space="preserve">O</text>
  <rect class="bxs" x="280" y="96" width="48" height="32" rx="2"/>
  <text class="tb" x="304" y="116.5" text-anchor="middle" xml:space="preserve">00</text>
  <text class="dim" x="304" y="89" text-anchor="middle" xml:space="preserve">+5</text>
  <text class="dimn" x="304" y="142" text-anchor="middle" xml:space="preserve">NUL</text>
  <line class="sline" x1="64" y1="178" x2="64" y2="160" marker-end="url(#arS)"/>
  <text class="cap" x="64" y="194" text-anchor="middle" xml:space="preserve">TEXT</text>
  <text class="dimn" x="40" y="220" text-anchor="start" xml:space="preserve">the zero byte marks the end</text>
  <text class="dimn" x="40" y="238" text-anchor="start" xml:space="preserve">length costs a walk to find it</text>
  <text class="dimn" x="40" y="256" text-anchor="start" xml:space="preserve">one walk shape for every routine</text>
  <rect class="bxq" x="374" y="44" width="326" height="232" rx="4"/>
  <text class="cap" x="390" y="68" text-anchor="start" xml:space="preserve">LENGTH IN BYTE ZERO</text>
  <rect class="bxs" x="390" y="96" width="48" height="32" rx="2"/>
  <text class="tb" x="414" y="116.5" text-anchor="middle" xml:space="preserve">05</text>
  <text class="dim" x="414" y="89" text-anchor="middle" xml:space="preserve">+0</text>
  <text class="dimn" x="414" y="142" text-anchor="middle" xml:space="preserve">count</text>
  <rect class="bx" x="438" y="96" width="48" height="32" rx="2"/>
  <text class="t" x="462" y="116.5" text-anchor="middle" xml:space="preserve">48</text>
  <text class="dim" x="462" y="89" text-anchor="middle" xml:space="preserve">+1</text>
  <text class="dimn" x="462" y="142" text-anchor="middle" xml:space="preserve">H</text>
  <rect class="bx" x="486" y="96" width="48" height="32" rx="2"/>
  <text class="t" x="510" y="116.5" text-anchor="middle" xml:space="preserve">45</text>
  <text class="dim" x="510" y="89" text-anchor="middle" xml:space="preserve">+2</text>
  <text class="dimn" x="510" y="142" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="bx" x="534" y="96" width="48" height="32" rx="2"/>
  <text class="t" x="558" y="116.5" text-anchor="middle" xml:space="preserve">4C</text>
  <text class="dim" x="558" y="89" text-anchor="middle" xml:space="preserve">+3</text>
  <text class="dimn" x="558" y="142" text-anchor="middle" xml:space="preserve">L</text>
  <rect class="bx" x="582" y="96" width="48" height="32" rx="2"/>
  <text class="t" x="606" y="116.5" text-anchor="middle" xml:space="preserve">4C</text>
  <text class="dim" x="606" y="89" text-anchor="middle" xml:space="preserve">+4</text>
  <text class="dimn" x="606" y="142" text-anchor="middle" xml:space="preserve">L</text>
  <rect class="bx" x="630" y="96" width="48" height="32" rx="2"/>
  <text class="t" x="654" y="116.5" text-anchor="middle" xml:space="preserve">4F</text>
  <text class="dim" x="654" y="89" text-anchor="middle" xml:space="preserve">+5</text>
  <text class="dimn" x="654" y="142" text-anchor="middle" xml:space="preserve">O</text>
  <line class="sline" x1="462" y1="178" x2="462" y2="160" marker-end="url(#arS)"/>
  <text class="cap" x="462" y="194" text-anchor="middle" xml:space="preserve">TEXT</text>
  <text class="dimn" x="390" y="220" text-anchor="start" xml:space="preserve">byte 0 holds the count</text>
  <text class="dimn" x="390" y="238" text-anchor="start" xml:space="preserve">length is one read, no walk</text>
  <text class="dimn" x="390" y="256" text-anchor="start" xml:space="preserve">every pointer must skip byte 0</text>
  <text class="dimn" x="24" y="306" text-anchor="start" xml:space="preserve">Book 3 uses the null-terminated form: a scan for the length, in exchange for one uniform walk in every routine.</text>
</svg>
