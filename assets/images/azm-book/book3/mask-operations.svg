<svg xmlns="http://www.w3.org/2000/svg" width="720" height="452" viewBox="0 0 720 452" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">and, or and xor against a mask</title>
  <desc id="figDesc">Three panels, each with the byte before, the mask and the byte after as eight bits, for or with $02, and with $FB, and xor with $04. The changed bit is marked and the carry flag is shown cleared by every one of them.</desc>
