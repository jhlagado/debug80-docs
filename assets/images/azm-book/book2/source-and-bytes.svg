<svg xmlns="http://www.w3.org/2000/svg" width="720" height="288" viewBox="0 0 720 288" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Assembly source against the bytes it produces</title>
  <desc id="figDesc">Six rows pairing an address and its bytes with the AZM source line that produced them, and an arrow from the label Result to the address $8000 it resolves to.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="46" y="30" text-anchor="start" xml:space="preserve">ASSEMBLED</text>
  <text class="cap" x="300" y="30" text-anchor="start" xml:space="preserve">SOURCE</text>
  <text class="dim" x="46" y="56" text-anchor="start" xml:space="preserve">$0000</text>
  <text class="t" x="116" y="56" text-anchor="start" xml:space="preserve">3E 05</text>
  <text class="t" x="300" y="56" text-anchor="start" xml:space="preserve">        ld   a,5</text>
  <text class="dim" x="46" y="82" text-anchor="start" xml:space="preserve">$0002</text>
  <text class="t" x="116" y="82" text-anchor="start" xml:space="preserve">47</text>
  <text class="t" x="300" y="82" text-anchor="start" xml:space="preserve">        ld   b,a</text>
  <text class="dim" x="46" y="108" text-anchor="start" xml:space="preserve">$0003</text>
  <text class="t" x="116" y="108" text-anchor="start" xml:space="preserve">3E 03</text>
  <text class="t" x="300" y="108" text-anchor="start" xml:space="preserve">        ld   a,3</text>
  <text class="dim" x="46" y="134" text-anchor="start" xml:space="preserve">$0005</text>
  <text class="t" x="116" y="134" text-anchor="start" xml:space="preserve">80</text>
  <text class="t" x="300" y="134" text-anchor="start" xml:space="preserve">        add  a,b</text>
  <text class="dim" x="46" y="160" text-anchor="start" xml:space="preserve">$0006</text>
  <text class="t" x="116" y="160" text-anchor="start" xml:space="preserve">32 00 80</text>
  <text class="t" x="300" y="160" text-anchor="start" xml:space="preserve">        ld   (Result),a</text>
  <text class="dim" x="46" y="186" text-anchor="start" xml:space="preserve">$0009</text>
  <text class="t" x="116" y="186" text-anchor="start" xml:space="preserve">76</text>
  <text class="t" x="300" y="186" text-anchor="start" xml:space="preserve">        halt</text>
  <line class="rule" x1="288" y1="40" x2="288" y2="200"/>
  <text class="t" x="300" y="238" text-anchor="start" xml:space="preserve">Result:</text>
  <text class="t" x="300" y="258" text-anchor="start" xml:space="preserve">        .db  0</text>
  <text class="dim" x="46" y="238" text-anchor="start" xml:space="preserve">$8000</text>
  <text class="dim" x="116" y="238" text-anchor="start" xml:space="preserve">00</text>
  <path class="sline" d="M486,156 C566,156 566,230 372,230" marker-end="url(#arS)"/>
  <text class="dimn" x="580" y="182" text-anchor="start" xml:space="preserve">the label resolves</text>
  <text class="dimn" x="580" y="198" text-anchor="start" xml:space="preserve">to its address</text>
  <text class="dimn" x="46" y="276" text-anchor="start" xml:space="preserve">Move the variable and every reference follows. That is the entire argument for an assembler.</text>
</svg>
