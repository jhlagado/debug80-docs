<svg xmlns="http://www.w3.org/2000/svg" width="720" height="268" viewBox="0 0 720 268" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">An array of records, and reaching one field</title>
  <desc id="figDesc">Four Sprite records laid end to end with the three-byte stride marked between origins, and the arithmetic that lands on the colour byte of the third.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="46" y="30" text-anchor="start" xml:space="preserve">.DS SPRITE[4]</text>
  <rect class="bx" x="46" y="44" width="150" height="34" rx="2"/>
  <text class="t" x="71" y="66" text-anchor="middle" xml:space="preserve">x</text>
  <text class="t" x="121" y="66" text-anchor="middle" xml:space="preserve">y</text>
  <text class="t" x="171" y="66" text-anchor="middle" xml:space="preserve">color</text>
  <line class="rule" x1="96" y1="44" x2="96" y2="78"/>
  <line class="rule" x1="146" y1="44" x2="146" y2="78"/>
  <text class="dim" x="121" y="96" text-anchor="middle" xml:space="preserve">[0]</text>
  <rect class="bx" x="202" y="44" width="150" height="34" rx="2"/>
  <text class="t" x="227" y="66" text-anchor="middle" xml:space="preserve">x</text>
  <text class="t" x="277" y="66" text-anchor="middle" xml:space="preserve">y</text>
  <text class="t" x="327" y="66" text-anchor="middle" xml:space="preserve">color</text>
  <line class="rule" x1="252" y1="44" x2="252" y2="78"/>
  <line class="rule" x1="302" y1="44" x2="302" y2="78"/>
  <text class="dim" x="277" y="96" text-anchor="middle" xml:space="preserve">[1]</text>
  <rect class="bxs" x="358" y="44" width="150" height="34" rx="2"/>
  <text class="t" x="383" y="66" text-anchor="middle" xml:space="preserve">x</text>
  <text class="t" x="433" y="66" text-anchor="middle" xml:space="preserve">y</text>
  <text class="tb" x="483" y="66" text-anchor="middle" xml:space="preserve">color</text>
  <line class="rule" x1="408" y1="44" x2="408" y2="78"/>
  <line class="rule" x1="458" y1="44" x2="458" y2="78"/>
  <text class="dim" x="433" y="96" text-anchor="middle" xml:space="preserve">[2]</text>
  <rect class="bx" x="514" y="44" width="150" height="34" rx="2"/>
  <text class="t" x="539" y="66" text-anchor="middle" xml:space="preserve">x</text>
  <text class="t" x="589" y="66" text-anchor="middle" xml:space="preserve">y</text>
  <text class="t" x="639" y="66" text-anchor="middle" xml:space="preserve">color</text>
  <line class="rule" x1="564" y1="44" x2="564" y2="78"/>
  <line class="rule" x1="614" y1="44" x2="614" y2="78"/>
  <text class="dim" x="589" y="96" text-anchor="middle" xml:space="preserve">[3]</text>
  <path class="rule" d="M46,112 V124 H196 V112"/>
  <text class="dim" x="121" y="142" text-anchor="middle" xml:space="preserve">stride = sizeof(Sprite) = 3</text>
  <text class="cap" x="46" y="184" text-anchor="start" xml:space="preserve">The colour byte of element 2</text>
  <text class="ts" x="46" y="208" text-anchor="start" xml:space="preserve">base + 2 * sizeof(Sprite) + offset(Sprite, color)</text>
  <text class="ts" x="46" y="230" text-anchor="start" xml:space="preserve">offset(Sprite[16], [2].color)     ; the same constant, folded</text>
  <text class="dimn" x="46" y="258" text-anchor="start" xml:space="preserve">The stride is always the element size. AZM packs records exactly and never rounds a layout up for you.</text>
</svg>
