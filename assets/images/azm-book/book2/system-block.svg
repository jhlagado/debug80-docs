<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Z80 system block diagram</title>
  <desc id="figDesc">A CPU box connected to a memory box and an I/O ports box by a 16-bit address bus, an 8-bit data bus and a control line group.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <rect class="bx" x="40" y="40" width="150" height="90" rx="4"/>
  <text class="nb" x="115" y="60" text-anchor="middle" xml:space="preserve">CPU</text>
  <text class="ts" x="115" y="78" text-anchor="middle" xml:space="preserve">Z80</text>
  <rect class="bx" x="400" y="26" width="170" height="66" rx="4"/>
  <text class="nb" x="485" y="46" text-anchor="middle" xml:space="preserve">Memory</text>
  <text class="ts" x="485" y="64" text-anchor="middle" xml:space="preserve">64 KB address space</text>
  <rect class="bx" x="400" y="148" width="170" height="66" rx="4"/>
  <text class="nb" x="485" y="168" text-anchor="middle" xml:space="preserve">I/O ports</text>
  <text class="ts" x="485" y="186" text-anchor="middle" xml:space="preserve">256 port numbers</text>
  <line class="sline" x1="190" y1="62" x2="400" y2="62" marker-end="url(#arS)"/>
  <text class="cap" x="214" y="54" text-anchor="start" xml:space="preserve">ADDRESS BUS</text>
  <text class="dim" x="214" y="78" text-anchor="start" xml:space="preserve">16 lines  →  $0000-$FFFF</text>
  <path class="none" d="M190,92 H400" marker-end="url(#ar)"/>
  <path class="none" d="M400,92 H190" marker-end="url(#ar)"/>
  <text class="cap" x="214" y="108" text-anchor="start" xml:space="preserve">DATA BUS</text>
  <text class="dim" x="300" y="108" text-anchor="start" xml:space="preserve">8 lines</text>
  <line class="none" x1="190" y1="178" x2="400" y2="178" marker-end="url(#ar)"/>
  <text class="cap" x="214" y="170" text-anchor="start" xml:space="preserve">CONTROL</text>
  <text class="dim" x="214" y="194" text-anchor="start" xml:space="preserve">read / write / IORQ / MREQ</text>
  <text class="dimn" x="40" y="234" text-anchor="start" xml:space="preserve">Sixteen address lines set the ceiling at 65,536 bytes. Eight data lines set the unit of transfer at one byte.</text>
</svg>
