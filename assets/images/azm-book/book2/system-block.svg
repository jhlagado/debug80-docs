<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Z80 system block diagram</title>
  <desc id="figDesc">A CPU connected to one shared bus band carrying a 16-bit address bus, an 8-bit data bus and the control lines, with memory and the I/O ports both hanging off that band.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <rect class="bx" x="34" y="66" width="140" height="116" rx="4"/>
  <text class="nb" x="104" y="86" text-anchor="middle" xml:space="preserve">CPU</text>
  <text class="ts" x="104" y="104" text-anchor="middle" xml:space="preserve">Z80</text>
  <rect class="bxq" x="236" y="60" width="232" height="128" rx="4"/>
  <text class="cap" x="250" y="50" text-anchor="start" xml:space="preserve">THE BUSES</text>
  <text class="cap" x="250" y="78" text-anchor="start" xml:space="preserve">ADDRESS</text>
  <text class="dim" x="250" y="96" text-anchor="start" xml:space="preserve">16 lines, $0000-$FFFF</text>
  <text class="cap" x="250" y="118" text-anchor="start" xml:space="preserve">DATA</text>
  <text class="dim" x="250" y="136" text-anchor="start" xml:space="preserve">8 lines, one byte</text>
  <text class="cap" x="250" y="158" text-anchor="start" xml:space="preserve">CONTROL</text>
  <text class="dim" x="250" y="176" text-anchor="start" xml:space="preserve">read, write, MREQ, IORQ</text>
  <path class="none" d="M174,124 H232" marker-end="url(#ar)"/>
  <path class="none" d="M232,124 H174" marker-end="url(#ar)"/>
  <rect class="bx" x="530" y="60" width="156" height="56" rx="4"/>
  <text class="nb" x="608" y="80" text-anchor="middle" xml:space="preserve">Memory</text>
  <text class="ts" x="608" y="98" text-anchor="middle" xml:space="preserve">64 KB</text>
  <rect class="bx" x="530" y="132" width="156" height="56" rx="4"/>
  <text class="nb" x="608" y="152" text-anchor="middle" xml:space="preserve">I/O ports</text>
  <text class="ts" x="608" y="170" text-anchor="middle" xml:space="preserve">256 ports</text>
  <path class="none" d="M468,88 H526" marker-end="url(#ar)"/>
  <path class="none" d="M526,88 H468" marker-end="url(#ar)"/>
  <path class="none" d="M468,160 H526" marker-end="url(#ar)"/>
  <path class="none" d="M526,160 H468" marker-end="url(#ar)"/>
  <text class="dimn" x="34" y="218" text-anchor="start" xml:space="preserve">Sixteen address lines set the ceiling at 65,536 bytes. Eight data lines set the unit of transfer at one byte.</text>
  <text class="dimn" x="34" y="236" text-anchor="start" xml:space="preserve">Memory and the ports share the same wires; the control lines say which of them a transaction is for.</text>
</svg>
