<svg xmlns="http://www.w3.org/2000/svg" width="720" height="254" viewBox="0 0 720 254" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">A union is one set of bytes with two readings</title>
  <desc id="figDesc">The Payload union with asByte and asWord both starting at offset 0, drawn as two labelled views over the same two bytes.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="ts" x="46" y="44" text-anchor="start" xml:space="preserve">Payload .union</text>
  <text class="ts" x="46" y="64" text-anchor="start" xml:space="preserve">asByte  .byte</text>
  <text class="ts" x="46" y="84" text-anchor="start" xml:space="preserve">asWord  .word</text>
  <text class="ts" x="46" y="104" text-anchor="start" xml:space="preserve">.endunion</text>
  <text class="cap" x="320" y="32" text-anchor="start" xml:space="preserve">THE BYTES</text>
  <rect class="bx" x="320" y="44" width="90" height="34" rx="2"/>
  <text class="t" x="365" y="65.5" text-anchor="middle" xml:space="preserve">lo</text>
  <rect class="bx" x="410" y="44" width="90" height="34" rx="2"/>
  <text class="t" x="455" y="65.5" text-anchor="middle" xml:space="preserve">hi</text>
  <rect class="bxs" x="320" y="100" width="90" height="26" rx="2"/>
  <text class="tb" x="365" y="118" text-anchor="middle" xml:space="preserve">asByte</text>
  <rect class="bxs" x="320" y="136" width="180" height="26" rx="2"/>
  <text class="tb" x="410" y="154" text-anchor="middle" xml:space="preserve">asWord</text>
  <text class="dim" x="520" y="118" text-anchor="start" xml:space="preserve">offset 0, 1 byte</text>
  <text class="dim" x="520" y="154" text-anchor="start" xml:space="preserve">offset 0, 2 bytes</text>
  <text class="dim" x="320" y="190" text-anchor="start" xml:space="preserve">sizeof(Payload) = 2, the largest member</text>
  <text class="dimn" x="46" y="226" text-anchor="start" xml:space="preserve">Both fields start at offset 0. Reading asByte reads the low byte of whatever 16-bit value was stored there.</text>
  <text class="dimn" x="46" y="244" text-anchor="start" xml:space="preserve">Reach for a union when the same bytes have more than one legitimate reading, not to save space.</text>
</svg>
