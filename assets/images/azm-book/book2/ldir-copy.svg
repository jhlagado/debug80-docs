<svg xmlns="http://www.w3.org/2000/svg" width="720" height="296" viewBox="0 0 720 296" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">ldir before and after</title>
  <desc id="figDesc">Four source bytes and four destination bytes before the copy and after it, with HL, DE and BC shown in both states.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="56" y="28" text-anchor="start" xml:space="preserve">BEFORE</text>
  <text class="dim" x="56" y="62" text-anchor="start" xml:space="preserve">source</text>
  <rect class="bx" x="130" y="44" width="54" height="30" rx="2"/>
  <text class="t" x="157" y="63.5" text-anchor="middle" xml:space="preserve">1A</text>
  <rect class="bx" x="184" y="44" width="54" height="30" rx="2"/>
  <text class="t" x="211" y="63.5" text-anchor="middle" xml:space="preserve">2B</text>
  <rect class="bx" x="238" y="44" width="54" height="30" rx="2"/>
  <text class="t" x="265" y="63.5" text-anchor="middle" xml:space="preserve">3C</text>
  <rect class="bx" x="292" y="44" width="54" height="30" rx="2"/>
  <text class="t" x="319" y="63.5" text-anchor="middle" xml:space="preserve">4D</text>
  <text class="dim" x="56" y="116" text-anchor="start" xml:space="preserve">dest</text>
  <rect class="bx" x="130" y="98" width="54" height="30" rx="2"/>
  <text class="t" x="157" y="117.5" text-anchor="middle" xml:space="preserve">--</text>
  <rect class="bx" x="184" y="98" width="54" height="30" rx="2"/>
  <text class="t" x="211" y="117.5" text-anchor="middle" xml:space="preserve">--</text>
  <rect class="bx" x="238" y="98" width="54" height="30" rx="2"/>
  <text class="t" x="265" y="117.5" text-anchor="middle" xml:space="preserve">--</text>
  <rect class="bx" x="292" y="98" width="54" height="30" rx="2"/>
  <text class="t" x="319" y="117.5" text-anchor="middle" xml:space="preserve">--</text>
  <text class="ts" x="400" y="62" text-anchor="start" xml:space="preserve">HL = source</text>
  <text class="ts" x="400" y="84" text-anchor="start" xml:space="preserve">DE = dest</text>
  <text class="ts" x="400" y="106" text-anchor="start" xml:space="preserve">BC = 4</text>
  <line class="sline" x1="360" y1="160" x2="400" y2="160" marker-end="url(#arS)"/>
  <text class="tb" x="300" y="165" text-anchor="middle" xml:space="preserve">ldir</text>
  <text class="cap" x="56" y="208" text-anchor="start" xml:space="preserve">AFTER</text>
  <text class="dim" x="56" y="242" text-anchor="start" xml:space="preserve">source</text>
  <rect class="bx" x="130" y="224" width="54" height="30" rx="2"/>
  <text class="t" x="157" y="243.5" text-anchor="middle" xml:space="preserve">1A</text>
  <rect class="bx" x="184" y="224" width="54" height="30" rx="2"/>
  <text class="t" x="211" y="243.5" text-anchor="middle" xml:space="preserve">2B</text>
  <rect class="bx" x="238" y="224" width="54" height="30" rx="2"/>
  <text class="t" x="265" y="243.5" text-anchor="middle" xml:space="preserve">3C</text>
  <rect class="bx" x="292" y="224" width="54" height="30" rx="2"/>
  <text class="t" x="319" y="243.5" text-anchor="middle" xml:space="preserve">4D</text>
  <text class="dim" x="56" y="278" text-anchor="start" xml:space="preserve">dest</text>
  <rect class="bxs" x="130" y="260" width="54" height="30" rx="2"/>
  <text class="tb" x="157" y="279.5" text-anchor="middle" xml:space="preserve">1A</text>
  <rect class="bxs" x="184" y="260" width="54" height="30" rx="2"/>
  <text class="tb" x="211" y="279.5" text-anchor="middle" xml:space="preserve">2B</text>
  <rect class="bxs" x="238" y="260" width="54" height="30" rx="2"/>
  <text class="tb" x="265" y="279.5" text-anchor="middle" xml:space="preserve">3C</text>
  <rect class="bxs" x="292" y="260" width="54" height="30" rx="2"/>
  <text class="tb" x="319" y="279.5" text-anchor="middle" xml:space="preserve">4D</text>
  <text class="ts" x="400" y="242" text-anchor="start" xml:space="preserve">HL = source + 4</text>
  <text class="ts" x="400" y="264" text-anchor="start" xml:space="preserve">DE = dest + 4</text>
  <text class="ts" x="400" y="286" text-anchor="start" xml:space="preserve">BC = 0</text>
</svg>
