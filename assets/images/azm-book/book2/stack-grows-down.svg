<svg xmlns="http://www.w3.org/2000/svg" width="720" height="296" viewBox="0 0 720 296" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">The stack grows downward</title>
  <desc id="figDesc">A memory column with high addresses at the top. SP starts at $C000 above the column and moves down to $BFFC as two words are pushed.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="dimn" x="210" y="26" text-anchor="start" xml:space="preserve">higher addresses</text>
  <text class="dim" x="198" y="48" text-anchor="end" xml:space="preserve">$C000</text>
  <line class="rule" x1="210" y1="52" x2="400" y2="52"/>
  <rect class="bxs" x="210" y="58" width="190" height="30" rx="2"/>
  <text class="tb" x="305" y="78" text-anchor="middle" xml:space="preserve">first push</text>
  <text class="dim" x="198" y="77" text-anchor="end" xml:space="preserve">$BFFE</text>
  <rect class="bxs" x="210" y="88" width="190" height="30" rx="2"/>
  <text class="tb" x="305" y="108" text-anchor="middle" xml:space="preserve">second push</text>
  <text class="dim" x="198" y="107" text-anchor="end" xml:space="preserve">$BFFC</text>
  <rect class="bxq" x="210" y="118" width="190" height="30" rx="2"/>
  <text class="dim" x="198" y="137" text-anchor="end" xml:space="preserve">$BFFA</text>
  <rect class="bxq" x="210" y="148" width="190" height="30" rx="2"/>
  <text class="dim" x="198" y="167" text-anchor="end" xml:space="preserve">$BFF8</text>
  <text class="dimn" x="210" y="210" text-anchor="start" xml:space="preserve">lower addresses</text>
  <path class="sline" d="M476,48 H410" marker-end="url(#arS)"/>
  <text class="cap" x="484" y="52" text-anchor="start" xml:space="preserve">SP at start</text>
  <path class="sline" d="M476,103 H410" marker-end="url(#arS)"/>
  <text class="cap" x="484" y="107" text-anchor="start" xml:space="preserve">SP now</text>
  <text class="dimn" x="40" y="244" text-anchor="start" xml:space="preserve">ld sp, $C000 runs before the first call, push or pop. Each push takes SP down two and writes a word at the new</text>
  <text class="dimn" x="40" y="262" text-anchor="start" xml:space="preserve">SP; each pop reads a word and puts SP back up two.</text>
  <text class="dimn" x="40" y="280" text-anchor="start" xml:space="preserve">Point SP at the top of RAM and the stack runs down into free space rather than down into your program.</text>
</svg>
