<svg xmlns="http://www.w3.org/2000/svg" width="720" height="216" viewBox="0 0 720 216" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">One byte, two readings</title>
  <desc id="figDesc">A bar of 256 values labelled 0 to 255 as unsigned along the top and 0 to 127 then minus 128 to minus 1 as signed along the bottom, with $80 marked as the pivot.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="60" y="34" text-anchor="start" xml:space="preserve">UNSIGNED  0 – 255</text>
  <rect class="bx" x="60" y="84" width="300" height="34" rx="2"/>
  <rect class="bxs" x="360" y="84" width="300" height="34" rx="2"/>
  <text class="t" x="210" y="106" text-anchor="middle" xml:space="preserve">bit 7 clear</text>
  <text class="tb" x="510" y="106" text-anchor="middle" xml:space="preserve">bit 7 set</text>
  <line class="rule" x1="60" y1="78" x2="60" y2="118"/>
  <text class="dim" x="60" y="70" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dim" x="60" y="134" text-anchor="middle" xml:space="preserve">0</text>
  <line class="rule" x1="360" y1="78" x2="360" y2="118"/>
  <text class="dim" x="360" y="70" text-anchor="middle" xml:space="preserve">128</text>
  <text class="dim" x="360" y="134" text-anchor="middle" xml:space="preserve">−128</text>
  <line class="rule" x1="658.83" y1="78" x2="658.83" y2="118"/>
  <text class="dim" x="658.83" y="70" text-anchor="middle" xml:space="preserve">255</text>
  <text class="dim" x="658.83" y="134" text-anchor="middle" xml:space="preserve">−1</text>
  <text class="cap" x="60" y="160" text-anchor="start" xml:space="preserve">SIGNED  −128 – 127</text>
  <text class="dim" x="210" y="134" text-anchor="middle" xml:space="preserve">0 … 127</text>
  <text class="dim" x="510" y="134" text-anchor="middle" xml:space="preserve">−128 … −1</text>
  <text class="dimn" x="60" y="178" text-anchor="start" xml:space="preserve">The byte does not know which reading you meant. cp $80 splits the bar here; whether that is a large</text>
  <text class="dimn" x="60" y="196" text-anchor="start" xml:space="preserve">positive number or a negative one is decided by which conditional jump you write next.</text>
</svg>
