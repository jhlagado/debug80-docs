<svg xmlns="http://www.w3.org/2000/svg" width="720" height="312" viewBox="0 0 720 312" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">What main hands to each routine</title>
  <desc id="figDesc">main calls find_max with HL and B and gets back A, then calls count_above with HL, B and C and gets back A. Both clobber HL, which is why it is reloaded between the calls.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <rect class="bx" x="40" y="40" width="130" height="50" rx="4"/>
  <text class="tb" x="105" y="69.5" text-anchor="middle" xml:space="preserve">main</text>
  <rect class="bx" x="420" y="40" width="200" height="50" rx="4"/>
  <text class="tb" x="520" y="69.5" text-anchor="middle" xml:space="preserve">find_max</text>
  <path class="none" d="M170,56 H420" marker-end="url(#ar)"/>
  <text class="ts" x="200" y="50" text-anchor="start" xml:space="preserve">in  HL, B</text>
  <path class="sline" d="M420,78 H174" marker-end="url(#arS)"/>
  <text class="ts" x="200" y="96" text-anchor="start" xml:space="preserve">out A = the maximum</text>
  <text class="dim" x="200" y="114" text-anchor="start" xml:space="preserve">clobbers B, C, F, HL</text>
  <rect class="bx" x="40" y="158" width="130" height="50" rx="4"/>
  <text class="tb" x="105" y="187.5" text-anchor="middle" xml:space="preserve">main</text>
  <rect class="bx" x="420" y="158" width="200" height="50" rx="4"/>
  <text class="tb" x="520" y="187.5" text-anchor="middle" xml:space="preserve">count_above</text>
  <path class="none" d="M170,174 H420" marker-end="url(#ar)"/>
  <text class="ts" x="200" y="168" text-anchor="start" xml:space="preserve">in  HL, B, C</text>
  <path class="sline" d="M420,196 H174" marker-end="url(#arS)"/>
  <text class="ts" x="200" y="214" text-anchor="start" xml:space="preserve">out A = the count</text>
  <text class="dim" x="200" y="232" text-anchor="start" xml:space="preserve">clobbers B, D, F, HL</text>
  <rect class="bxs" x="40" y="248" width="250" height="26" rx="2"/>
  <text class="ts" x="54" y="266" text-anchor="start" xml:space="preserve">ld hl, values</text>
  <text class="dimn" x="306" y="266" text-anchor="start" xml:space="preserve">reloaded before the second call</text>
  <text class="dimn" x="40" y="304" text-anchor="start" xml:space="preserve">find_max leaves HL at the end of the table. Its contract says so, and the caller reloads it.</text>
</svg>
