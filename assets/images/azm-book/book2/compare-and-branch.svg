<svg xmlns="http://www.w3.org/2000/svg" width="720" height="278" viewBox="0 0 720 278" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">How cp reaches a conditional jump</title>
  <desc id="figDesc">cp n subtracts and discards the result, leaving flags behind, which the following conditional jump reads. A table gives the three outcomes: A less than n sets carry, A equal to n sets zero, A greater than n clears both.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <rect class="bx" x="30" y="40" width="210" height="52" rx="4"/>
  <text class="t" x="135" y="63" text-anchor="middle" xml:space="preserve">cp n</text>
  <text class="t" x="135" y="78" text-anchor="middle" xml:space="preserve">A − n, result discarded</text>
  <rect class="bxs" x="280" y="40" width="150" height="52" rx="4"/>
  <text class="t" x="355" y="63" text-anchor="middle" xml:space="preserve">flags updated</text>
  <text class="t" x="355" y="78" text-anchor="middle" xml:space="preserve">in F</text>
  <rect class="bx" x="470" y="40" width="210" height="52" rx="4"/>
  <text class="t" x="575" y="63" text-anchor="middle" xml:space="preserve">jr c, ...  /  jr z, ...</text>
  <text class="t" x="575" y="78" text-anchor="middle" xml:space="preserve">reads the flags</text>
  <line class="none" x1="240" y1="66" x2="280" y2="66" marker-end="url(#ar)"/>
  <line class="none" x1="430" y1="66" x2="470" y2="66" marker-end="url(#ar)"/>
  <text class="cap" x="40" y="138" text-anchor="start" xml:space="preserve">UNSIGNED OUTCOMES</text>
  <rect class="bxs" x="40" y="156" width="96" height="26" rx="2"/>
  <text class="tb" x="88" y="174" text-anchor="middle" xml:space="preserve">A &lt; n</text>
  <text class="t" x="156" y="174" text-anchor="start" xml:space="preserve">C set</text>
  <text class="t" x="250" y="174" text-anchor="start" xml:space="preserve">Z clear</text>
  <text class="ts" x="350" y="174" text-anchor="start" xml:space="preserve">jr c, target</text>
  <rect class="bx" x="40" y="186" width="96" height="26" rx="2"/>
  <text class="t" x="88" y="204" text-anchor="middle" xml:space="preserve">A = n</text>
  <text class="t" x="156" y="204" text-anchor="start" xml:space="preserve">C clear</text>
  <text class="t" x="250" y="204" text-anchor="start" xml:space="preserve">Z set</text>
  <text class="ts" x="350" y="204" text-anchor="start" xml:space="preserve">jr z, target</text>
  <rect class="bx" x="40" y="216" width="96" height="26" rx="2"/>
  <text class="t" x="88" y="234" text-anchor="middle" xml:space="preserve">A &gt; n</text>
  <text class="t" x="156" y="234" text-anchor="start" xml:space="preserve">C clear</text>
  <text class="t" x="250" y="234" text-anchor="start" xml:space="preserve">Z clear</text>
  <text class="ts" x="350" y="234" text-anchor="start" xml:space="preserve">jr nc, target and not z</text>
  <text class="dimn" x="40" y="266" text-anchor="start" xml:space="preserve">Carry is set when A is below the operand. A borrow was needed, so the flag that records a borrow is set.</text>
</svg>
