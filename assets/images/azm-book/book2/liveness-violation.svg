<svg xmlns="http://www.w3.org/2000/svg" width="720" height="302" viewBox="0 0 720 302" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">A value used after the call that destroyed it</title>
  <desc id="figDesc">A caller loads HL, calls find_max which clobbers HL, then reads through HL, with the diagnostic azm reports at the call site.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <rect class="bxs" x="40" y="84" width="250" height="26" rx="2"/>
  <text class="ts" x="56" y="50" text-anchor="start" xml:space="preserve">ld hl, table</text>
  <text class="ts" x="56" y="76" text-anchor="start" xml:space="preserve">ld b, 8</text>
  <text class="tb" x="56" y="102" text-anchor="start" xml:space="preserve">call find_max</text>
  <text class="ts" x="56" y="128" text-anchor="start" xml:space="preserve">ld a, (hl)</text>
  <path class="dash" d="M320,50 H300" marker-end="url(#arD)"/>
  <text class="dim" x="330" y="54" text-anchor="start" xml:space="preserve">HL holds table</text>
  <path class="dash" d="M320,102 H300" marker-end="url(#arD)"/>
  <text class="dim" x="330" y="98" text-anchor="start" xml:space="preserve">find_max walks HL to the end of</text>
  <text class="dim" x="330" y="116" text-anchor="start" xml:space="preserve">the table and leaves it there</text>
  <path class="dash" d="M320,128 H300" marker-end="url(#arD)"/>
  <text class="dim" x="330" y="132" text-anchor="start" xml:space="preserve">so this reads the wrong byte</text>
  <text class="cap" x="40" y="190" text-anchor="start" xml:space="preserve">What azm --rc warn reports</text>
  <rect class="bxq" x="40" y="202" width="640" height="44" rx="3"/>
  <text class="ts" x="54" y="220" text-anchor="start" xml:space="preserve">source.asm:6:5: warning: [AZMN_REGISTER_CONTRACTS] CALL find_max</text>
  <text class="ts" x="54" y="238" text-anchor="start" xml:space="preserve">may modify H,L, but the pre-call value is used later.</text>
  <text class="dimn" x="40" y="272" text-anchor="start" xml:space="preserve">The analyzer works from three facts alone: HL held a value, the call may destroy HL, and</text>
  <text class="dimn" x="40" y="290" text-anchor="start" xml:space="preserve">HL was read afterwards. Reload it, save it across the call, or stop using it.</text>
</svg>
