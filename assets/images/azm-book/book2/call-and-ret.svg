<svg xmlns="http://www.w3.org/2000/svg" width="720" height="242" viewBox="0 0 720 242" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">A call in three states</title>
  <desc id="figDesc">Before the call SP is at the top of an empty stack; during the subroutine the return address sits below it; after ret the stack is empty again and PC is back at the caller.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="108" y="30" text-anchor="start" xml:space="preserve">Before call</text>
  <rect class="bxq" x="108" y="44" width="148" height="28" rx="2"/>
  <rect class="bxq" x="108" y="72" width="148" height="28" rx="2"/>
  <rect class="bxq" x="108" y="100" width="148" height="28" rx="2"/>
  <line class="sline" x1="96" y1="58" x2="96" y2="58"/>
  <path class="sline" d="M64,58 H102" marker-end="url(#arS)"/>
  <text class="cap" x="40" y="62" text-anchor="start" xml:space="preserve">SP</text>
  <text class="dimn" x="108" y="150" text-anchor="start" xml:space="preserve">PC at the call</text>
  <text class="cap" x="328" y="30" text-anchor="start" xml:space="preserve">Inside the routine</text>
  <rect class="bxq" x="328" y="44" width="148" height="28" rx="2"/>
  <rect class="bxs" x="328" y="72" width="148" height="28" rx="2"/>
  <text class="tb" x="402" y="90.5" text-anchor="middle" xml:space="preserve">return addr</text>
  <rect class="bxq" x="328" y="100" width="148" height="28" rx="2"/>
  <line class="sline" x1="316" y1="86" x2="316" y2="86"/>
  <path class="sline" d="M284,86 H322" marker-end="url(#arS)"/>
  <text class="cap" x="260" y="90" text-anchor="start" xml:space="preserve">SP</text>
  <text class="dimn" x="328" y="150" text-anchor="start" xml:space="preserve">PC at the routine</text>
  <text class="cap" x="548" y="30" text-anchor="start" xml:space="preserve">After ret</text>
  <rect class="bxq" x="548" y="44" width="148" height="28" rx="2"/>
  <rect class="bxq" x="548" y="72" width="148" height="28" rx="2"/>
  <rect class="bxq" x="548" y="100" width="148" height="28" rx="2"/>
  <line class="sline" x1="536" y1="58" x2="536" y2="58"/>
  <path class="sline" d="M504,58 H542" marker-end="url(#arS)"/>
  <text class="cap" x="480" y="62" text-anchor="start" xml:space="preserve">SP</text>
  <text class="dimn" x="548" y="150" text-anchor="start" xml:space="preserve">PC after the call</text>
  <text class="dimn" x="40" y="226" text-anchor="start" xml:space="preserve">call is a push of the address after it, then a jump. ret is the pop that puts that address back into PC.</text>
</svg>
