<svg xmlns="http://www.w3.org/2000/svg" width="720" height="268" viewBox="0 0 720 268" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Three levels of call</title>
  <desc id="figDesc">main calls draw, draw calls plot, and the stack holds three return addresses which are removed in reverse order as each ret runs.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <rect class="bx" x="46" y="40" width="120" height="42" rx="4"/>
  <text class="tb" x="106" y="65.5" text-anchor="middle" xml:space="preserve">main</text>
  <line class="none" x1="166" y1="61" x2="196" y2="61" marker-end="url(#ar)"/>
  <text class="dimn" x="176" y="52" text-anchor="start" xml:space="preserve">call</text>
  <rect class="bx" x="196" y="40" width="120" height="42" rx="4"/>
  <text class="tb" x="256" y="65.5" text-anchor="middle" xml:space="preserve">draw</text>
  <line class="none" x1="316" y1="61" x2="346" y2="61" marker-end="url(#ar)"/>
  <text class="dimn" x="326" y="52" text-anchor="start" xml:space="preserve">call</text>
  <rect class="bx" x="346" y="40" width="120" height="42" rx="4"/>
  <text class="tb" x="406" y="65.5" text-anchor="middle" xml:space="preserve">plot</text>
  <text class="cap" x="470" y="30" text-anchor="start" xml:space="preserve">THE STACK AT THE DEEPEST POINT</text>
  <rect class="bxs" x="490" y="44" width="176" height="28" rx="2"/>
  <text class="tb" x="578" y="62.5" text-anchor="middle" xml:space="preserve">return into main</text>
  <rect class="bxs" x="490" y="72" width="176" height="28" rx="2"/>
  <text class="tb" x="578" y="90.5" text-anchor="middle" xml:space="preserve">return into draw</text>
  <rect class="bxq" x="490" y="100" width="176" height="28" rx="2"/>
  <path class="sline" d="M446,102 H484" marker-end="url(#arS)"/>
  <text class="cap" x="416" y="106" text-anchor="start" xml:space="preserve">SP</text>
  <text class="dimn" x="46" y="148" text-anchor="start" xml:space="preserve">Pushed on the way in, top to bottom.</text>
  <text class="dimn" x="46" y="166" text-anchor="start" xml:space="preserve">Popped on the way out, bottom to top.</text>
  <text class="dimn" x="46" y="196" text-anchor="start" xml:space="preserve">There is no register recording how deep you are. The only limit is how much RAM sits below SP, and nothing</text>
  <text class="dimn" x="46" y="214" text-anchor="start" xml:space="preserve">checks that you have not run out of it.</text>
  <text class="dimn" x="46" y="252" text-anchor="start" xml:space="preserve">A missing ret does not return anywhere. Execution runs on into whatever bytes follow the last instruction.</text>
</svg>
