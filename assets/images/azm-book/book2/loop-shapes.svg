<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Three loop shapes</title>
  <desc id="figDesc">Counted, sentinel and flag-exit loops drawn side by side, with djnz acting as the exit in the first and as a safety bound in the other two.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="30" y="34" text-anchor="start" xml:space="preserve">Counted</text>
  <rect class="bx" x="30" y="52" width="190" height="40" rx="4"/>
  <text class="t" x="125" y="76.5" text-anchor="middle" xml:space="preserve">ld b, n</text>
  <line class="none" x1="125" y1="92" x2="125" y2="106" marker-end="url(#ar)"/>
  <rect class="bx" x="30" y="106" width="190" height="40" rx="4"/>
  <text class="t" x="125" y="130.5" text-anchor="middle" xml:space="preserve">body</text>
  <line class="none" x1="125" y1="146" x2="125" y2="160" marker-end="url(#ar)"/>
  <polygon class="bxs" points="125,160 220,180 125,200 30,180"/>
  <text class="t" x="125" y="184.5" text-anchor="middle" xml:space="preserve">djnz</text>
  <text class="dimn" x="30" y="226" text-anchor="start" xml:space="preserve">Runs exactly n times.</text>
  <text class="cap" x="262" y="34" text-anchor="start" xml:space="preserve">Sentinel</text>
  <rect class="bx" x="262" y="52" width="190" height="40" rx="4"/>
  <text class="t" x="357" y="76.5" text-anchor="middle" xml:space="preserve">ld a, (hl)</text>
  <line class="none" x1="357" y1="92" x2="357" y2="106" marker-end="url(#ar)"/>
  <polygon class="bx" points="357,106 452,126 357,146 262,126"/>
  <text class="t" x="357" y="130.5" text-anchor="middle" xml:space="preserve">cp 0</text>
  <line class="none" x1="357" y1="146" x2="357" y2="160" marker-end="url(#ar)"/>
  <rect class="bx" x="262" y="160" width="190" height="40" rx="4"/>
  <text class="t" x="357" y="184.5" text-anchor="middle" xml:space="preserve">body, inc hl</text>
  <line class="none" x1="357" y1="200" x2="357" y2="214" marker-end="url(#ar)"/>
  <polygon class="bxs" points="357,214 452,234 357,254 262,234"/>
  <text class="t" x="357" y="238.5" text-anchor="middle" xml:space="preserve">djnz</text>
  <text class="dimn" x="262" y="280" text-anchor="start" xml:space="preserve">Data decides. djnz is the bound.</text>
  <text class="cap" x="494" y="34" text-anchor="start" xml:space="preserve">Flag exit</text>
  <rect class="bx" x="494" y="52" width="190" height="40" rx="4"/>
  <text class="t" x="589" y="76.5" text-anchor="middle" xml:space="preserve">in a, (port)</text>
  <line class="none" x1="589" y1="92" x2="589" y2="106" marker-end="url(#ar)"/>
  <polygon class="bx" points="589,106 684,126 589,146 494,126"/>
  <text class="t" x="589" y="130.5" text-anchor="middle" xml:space="preserve">and mask</text>
  <line class="none" x1="589" y1="146" x2="589" y2="160" marker-end="url(#ar)"/>
  <rect class="bx" x="494" y="160" width="190" height="40" rx="4"/>
  <text class="t" x="589" y="184.5" text-anchor="middle" xml:space="preserve">body</text>
  <line class="none" x1="589" y1="200" x2="589" y2="214" marker-end="url(#ar)"/>
  <polygon class="bxs" points="589,214 684,234 589,254 494,234"/>
  <text class="t" x="589" y="238.5" text-anchor="middle" xml:space="preserve">djnz</text>
  <text class="dimn" x="494" y="280" text-anchor="start" xml:space="preserve">Hardware decides. djnz is the bound.</text>
  <text class="dimn" x="30" y="290" text-anchor="start" xml:space="preserve">In the second and third shapes djnz is not the exit condition. It is the guarantee that the loop ends at all.</text>
</svg>
