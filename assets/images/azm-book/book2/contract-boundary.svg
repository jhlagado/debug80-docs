<svg xmlns="http://www.w3.org/2000/svg" width="720" height="288" viewBox="0 0 720 288" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">What a contract describes</title>
  <desc id="figDesc">A routine drawn as a boundary, with in entering, out leaving, clobbers destroyed inside and preserves passing through untouched.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <rect class="bx" x="250" y="44" width="220" height="180" rx="4"/>
  <text class="tb" x="360" y="70" text-anchor="middle" xml:space="preserve">find_max</text>
  <text class="dim" x="360" y="92" text-anchor="middle" xml:space="preserve">the body</text>
  <text class="cap" x="40" y="104" text-anchor="start" xml:space="preserve">in</text>
  <text class="ts" x="40" y="124" text-anchor="start" xml:space="preserve">HL, B</text>
  <path class="sline" d="M170,118 H244" marker-end="url(#arS)"/>
  <text class="cap" x="40" y="188" text-anchor="start" xml:space="preserve">clobbers</text>
  <text class="ts" x="40" y="208" text-anchor="start" xml:space="preserve">B, HL, F</text>
  <path class="dash" d="M244,202 H170" marker-end="url(#arD)"/>
  <text class="cap" x="520" y="104" text-anchor="start" xml:space="preserve">out</text>
  <text class="ts" x="520" y="124" text-anchor="start" xml:space="preserve">A = max</text>
  <path class="sline" d="M476,118 H600" marker-end="url(#arS)"/>
  <text class="cap" x="520" y="188" text-anchor="start" xml:space="preserve">preserves</text>
  <text class="ts" x="520" y="208" text-anchor="start" xml:space="preserve">DE, IX, IY</text>
  <path class="none" d="M40,246 H680" marker-end="url(#ar)"/>
  <text class="dimn" x="250" y="266" text-anchor="start" xml:space="preserve">straight through, untouched</text>
  <text class="dimn" x="40" y="40" text-anchor="start" xml:space="preserve">A contract names what crosses the boundary, in both directions.</text>
</svg>
