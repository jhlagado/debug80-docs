<svg xmlns="http://www.w3.org/2000/svg" width="720" height="268" viewBox="0 0 720 268" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Who is responsible for which register</title>
  <desc id="figDesc">A boundary line with caller-save registers on one side, which the routine may change, and callee-save on the other, which it must restore.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <line class="rule" x1="360" y1="34" x2="360" y2="214"/>
  <text class="cap" x="56" y="30" text-anchor="start" xml:space="preserve">CALLER-SAVE</text>
  <text class="cap" x="390" y="30" text-anchor="start" xml:space="preserve">CALLEE-SAVE</text>
  <rect class="bxs" x="56" y="46" width="250" height="30" rx="2"/>
  <text class="tb" x="181" y="66" text-anchor="middle" xml:space="preserve">A</text>
  <rect class="bxs" x="56" y="86" width="250" height="30" rx="2"/>
  <text class="tb" x="181" y="106" text-anchor="middle" xml:space="preserve">F</text>
  <rect class="bxs" x="56" y="126" width="250" height="30" rx="2"/>
  <text class="tb" x="181" y="146" text-anchor="middle" xml:space="preserve">declared out</text>
  <rect class="bxs" x="56" y="166" width="250" height="30" rx="2"/>
  <text class="tb" x="181" y="186" text-anchor="middle" xml:space="preserve">named in clobbers</text>
  <rect class="bx" x="390" y="46" width="250" height="30" rx="2"/>
  <text class="tb" x="515" y="66" text-anchor="middle" xml:space="preserve">everything else</text>
  <text class="dimn" x="56" y="232" text-anchor="start" xml:space="preserve">The routine may change these.</text>
  <text class="dimn" x="56" y="250" text-anchor="start" xml:space="preserve">Save anything you still need.</text>
  <text class="dimn" x="390" y="106" text-anchor="start" xml:space="preserve">If the routine uses one internally it must put</text>
  <text class="dimn" x="390" y="124" text-anchor="start" xml:space="preserve">the incoming value back before every ret.</text>
  <text class="dimn" x="390" y="154" text-anchor="start" xml:space="preserve">push de at the top, pop de before each</text>
  <text class="dimn" x="390" y="172" text-anchor="start" xml:space="preserve">return. Miss one path and ret takes the</text>
  <text class="dimn" x="390" y="190" text-anchor="start" xml:space="preserve">saved word as its destination.</text>
  <text class="dimn" x="56" y="262" text-anchor="start" xml:space="preserve">The contract decides this. BC is callee-save whenever the contract leaves it unnamed.</text>
</svg>
