<svg xmlns="http://www.w3.org/2000/svg" width="720" height="292" viewBox="0 0 720 292" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">A record and the constants it yields</title>
  <desc id="figDesc">The Sprite record as three consecutive bytes with x at offset 0, y at offset 1 and colour at offset 2, and sizeof reporting 3.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="ts" x="46" y="44" text-anchor="start" xml:space="preserve">Sprite .type</text>
  <text class="ts" x="46" y="64" text-anchor="start" xml:space="preserve">x       .byte</text>
  <text class="ts" x="46" y="84" text-anchor="start" xml:space="preserve">y       .byte</text>
  <text class="ts" x="46" y="104" text-anchor="start" xml:space="preserve">color   .byte</text>
  <text class="ts" x="46" y="124" text-anchor="start" xml:space="preserve">.endtype</text>
  <text class="cap" x="300" y="32" text-anchor="start" xml:space="preserve">IN MEMORY</text>
  <rect class="bx" x="300" y="44" width="86" height="34" rx="2"/>
  <text class="t" x="343" y="65.5" text-anchor="middle" xml:space="preserve">x</text>
  <text class="dimn" x="343" y="92" text-anchor="middle" xml:space="preserve">offset 0</text>
  <rect class="bx" x="386" y="44" width="86" height="34" rx="2"/>
  <text class="t" x="429" y="65.5" text-anchor="middle" xml:space="preserve">y</text>
  <text class="dimn" x="429" y="92" text-anchor="middle" xml:space="preserve">offset 1</text>
  <rect class="bxs" x="472" y="44" width="86" height="34" rx="2"/>
  <text class="tb" x="515" y="65.5" text-anchor="middle" xml:space="preserve">color</text>
  <text class="dimn" x="515" y="92" text-anchor="middle" xml:space="preserve">offset 2</text>
  <path class="rule" d="M300,102 V116 H558 V102"/>
  <text class="dim" x="429" y="134" text-anchor="middle" xml:space="preserve">sizeof(Sprite) = 3</text>
  <text class="cap" x="46" y="176" text-anchor="start" xml:space="preserve">Assembly-time constants</text>
  <text class="ts" x="46" y="196" text-anchor="start" xml:space="preserve">SpriteX     .equ offset(Sprite, x)       ; = 0</text>
  <text class="ts" x="46" y="216" text-anchor="start" xml:space="preserve">SpriteY     .equ offset(Sprite, y)       ; = 1</text>
  <text class="ts" x="46" y="236" text-anchor="start" xml:space="preserve">SpriteColor .equ offset(Sprite, color)   ; = 2</text>
  <text class="ts" x="46" y="256" text-anchor="start" xml:space="preserve">SpriteSize  .equ sizeof(Sprite)          ; = 3</text>
  <text class="dimn" x="46" y="286" text-anchor="start" xml:space="preserve">Add a field and every one of these updates. The description is in one place, so the offsets cannot drift from it.</text>
</svg>
