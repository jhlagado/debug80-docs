<svg xmlns="http://www.w3.org/2000/svg" width="720" height="222" viewBox="0 0 720 222" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Little-endian byte order</title>
  <desc id="figDesc">The 16-bit value $8000 split into a low byte $00 stored at the lower address and a high byte $80 stored at the higher address, with the two arrows crossing.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="46" y="26" text-anchor="start" xml:space="preserve">THE VALUE</text>
  <rect class="bx" x="46" y="40" width="108" height="34" rx="2"/>
  <text class="tb" x="100" y="63" text-anchor="middle" xml:space="preserve">$8000</text>
  <rect class="none" x="46" y="40" width="54" height="34" rx="2"/>
  <text class="dim" x="73" y="90" text-anchor="middle" xml:space="preserve">high $80</text>
  <text class="dim" x="127" y="90" text-anchor="middle" xml:space="preserve">low $00</text>
  <text class="cap" x="46" y="132" text-anchor="start" xml:space="preserve">IN MEMORY</text>
  <rect class="bxs" x="46" y="148" width="54" height="34" rx="2"/>
  <text class="tb" x="73" y="169.5" text-anchor="middle" xml:space="preserve">00</text>
  <text class="dim" x="73" y="141" text-anchor="middle" xml:space="preserve">$0007</text>
  <rect class="bx" x="100" y="148" width="54" height="34" rx="2"/>
  <text class="t" x="127" y="169.5" text-anchor="middle" xml:space="preserve">80</text>
  <text class="dim" x="127" y="141" text-anchor="middle" xml:space="preserve">$0008</text>
  <text class="dimn" x="168" y="162" text-anchor="start" xml:space="preserve">low byte at the lower address</text>
  <text class="dimn" x="168" y="182" text-anchor="start" xml:space="preserve">high byte at the higher address</text>
  <path class="sline" d="M127,96 C127,120 73,124 73,144" marker-end="url(#arS)"/>
  <path class="dash" d="M73,96 C73,120 127,124 127,144" marker-end="url(#arD)"/>
  <text class="dimn" x="46" y="212" text-anchor="start" xml:space="preserve">So ld ($8000), a assembles to 32 00 80. The swap is in the encoding, not in the value.</text>
</svg>
