<svg xmlns="http://www.w3.org/2000/svg" width="720" height="452" viewBox="0 0 720 452" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">The Z80 register set</title>
  <desc id="figDesc">A and F, then BC, DE and HL drawn as byte pairs that are also 16-bit units, then IX, IY, SP and PC as 16-bit registers, with I and R as single bytes and the shadow set alongside.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="40" y="26" text-anchor="start" xml:space="preserve">MAIN SET: EIGHT BYTES, FOUR PAIRS</text>
  <text class="cap" x="40" y="64" text-anchor="start" xml:space="preserve">AF</text>
  <rect class="bx" x="88" y="44" width="74" height="30" rx="2"/>
  <rect class="bx" x="162" y="44" width="74" height="30" rx="2"/>
  <text class="tb" x="125" y="64" text-anchor="middle" xml:space="preserve">A</text>
  <text class="tb" x="199" y="64" text-anchor="middle" xml:space="preserve">F</text>
  <rect class="none" x="88" y="44" width="148" height="30" rx="2"/>
  <text class="dim" x="125" y="88" text-anchor="middle" xml:space="preserve">high</text>
  <text class="dim" x="199" y="88" text-anchor="middle" xml:space="preserve">low</text>
  <text class="dimn" x="252" y="64" text-anchor="start" xml:space="preserve">accumulator, and the flags</text>
  <text class="cap" x="40" y="130" text-anchor="start" xml:space="preserve">BC</text>
  <rect class="bx" x="88" y="110" width="74" height="30" rx="2"/>
  <rect class="bx" x="162" y="110" width="74" height="30" rx="2"/>
  <text class="tb" x="125" y="130" text-anchor="middle" xml:space="preserve">B</text>
  <text class="tb" x="199" y="130" text-anchor="middle" xml:space="preserve">C</text>
  <rect class="none" x="88" y="110" width="148" height="30" rx="2"/>
  <text class="dim" x="125" y="154" text-anchor="middle" xml:space="preserve">high</text>
  <text class="dim" x="199" y="154" text-anchor="middle" xml:space="preserve">low</text>
  <text class="dimn" x="252" y="130" text-anchor="start" xml:space="preserve">counts; C is the port for in r,(c)</text>
  <text class="cap" x="40" y="196" text-anchor="start" xml:space="preserve">DE</text>
  <rect class="bx" x="88" y="176" width="74" height="30" rx="2"/>
  <rect class="bx" x="162" y="176" width="74" height="30" rx="2"/>
  <text class="tb" x="125" y="196" text-anchor="middle" xml:space="preserve">D</text>
  <text class="tb" x="199" y="196" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="none" x="88" y="176" width="148" height="30" rx="2"/>
  <text class="dim" x="125" y="220" text-anchor="middle" xml:space="preserve">high</text>
  <text class="dim" x="199" y="220" text-anchor="middle" xml:space="preserve">low</text>
  <text class="dimn" x="252" y="196" text-anchor="start" xml:space="preserve">the copy destination</text>
  <text class="cap" x="40" y="262" text-anchor="start" xml:space="preserve">HL</text>
  <rect class="bx" x="88" y="242" width="74" height="30" rx="2"/>
  <rect class="bx" x="162" y="242" width="74" height="30" rx="2"/>
  <text class="tb" x="125" y="262" text-anchor="middle" xml:space="preserve">H</text>
  <text class="tb" x="199" y="262" text-anchor="middle" xml:space="preserve">L</text>
  <rect class="none" x="88" y="242" width="148" height="30" rx="2"/>
  <text class="dim" x="125" y="286" text-anchor="middle" xml:space="preserve">high</text>
  <text class="dim" x="199" y="286" text-anchor="middle" xml:space="preserve">low</text>
  <text class="dimn" x="252" y="262" text-anchor="start" xml:space="preserve">the address register</text>
  <text class="cap" x="40" y="316" text-anchor="start" xml:space="preserve">INDEX, POINTER AND HOUSEKEEPING</text>
  <rect class="bx" x="40" y="330" width="148" height="30" rx="2"/>
  <text class="tb" x="114" y="350" text-anchor="middle" xml:space="preserve">IX</text>
  <rect class="bx" x="226" y="330" width="148" height="30" rx="2"/>
  <text class="tb" x="300" y="350" text-anchor="middle" xml:space="preserve">IY</text>
  <rect class="bx" x="500" y="330" width="74" height="30" rx="2"/>
  <text class="tb" x="537" y="350" text-anchor="middle" xml:space="preserve">I</text>
  <rect class="bx" x="584" y="330" width="74" height="30" rx="2"/>
  <text class="tb" x="621" y="350" text-anchor="middle" xml:space="preserve">R</text>
  <text class="dimn" x="40" y="378" text-anchor="start" xml:space="preserve">reached as base plus a signed displacement</text>
  <text class="dimn" x="500" y="378" text-anchor="start" xml:space="preserve">vector, and refresh</text>
  <rect class="bx" x="40" y="392" width="148" height="30" rx="2"/>
  <text class="tb" x="114" y="412" text-anchor="middle" xml:space="preserve">SP</text>
  <rect class="bx" x="226" y="392" width="148" height="30" rx="2"/>
  <text class="tb" x="300" y="412" text-anchor="middle" xml:space="preserve">PC</text>
  <text class="dimn" x="390" y="412" text-anchor="start" xml:space="preserve">the stack, and the next instruction</text>
  <rect class="bxq" x="470" y="40" width="210" height="128" rx="3"/>
  <text class="cap" x="484" y="62" text-anchor="start" xml:space="preserve">Shadow set</text>
  <text class="ts" x="484" y="88" text-anchor="start" xml:space="preserve">A' F'    B' C'</text>
  <text class="ts" x="484" y="108" text-anchor="start" xml:space="preserve">D' E'    H' L'</text>
  <text class="dimn" x="484" y="134" text-anchor="start" xml:space="preserve">A second copy, reached only</text>
  <text class="dimn" x="484" y="150" text-anchor="start" xml:space="preserve">by exchange. Chapter 8.</text>
  <text class="dimn" x="470" y="200" text-anchor="start" xml:space="preserve">26 bytes inside the chip. Every</text>
  <text class="dimn" x="470" y="216" text-anchor="start" xml:space="preserve">one of them is faster to reach</text>
  <text class="dimn" x="470" y="232" text-anchor="start" xml:space="preserve">than any byte of RAM.</text>
</svg>
