<svg xmlns="http://www.w3.org/2000/svg" width="720" height="150" viewBox="0 0 720 150" role="img" aria-labelledby="t d">
  <title id="t">Debug80 panel with a folder that is not yet a project</title>
  <desc id="d">The project row shows the folder name, add and remove buttons, a Platform dropdown set to TEC-1G and an Initialize button, above a card reading "Uninitialized Debug80 project".</desc>
  <defs><style>
  .pnl   { fill: #ffffff; stroke: #2f5d7c; stroke-width: 2; }
  .bar   { fill: #eef4f9; stroke: #2f5d7c; stroke-width: 2; }
  .ctl   { fill: #f7fbff; stroke: #7d97ab; }
  .field { fill: #f7fbff; stroke: #7d97ab; stroke-width: 1.5; }
  .btn   { fill: #eef4f9; stroke: #2f5d7c; stroke-width: 1.5; }
  .prim  { fill: #2f5d7c; stroke: #2f5d7c; stroke-width: 1.5; }
  .card  { fill: #fff8e8; stroke: #9a6a12; stroke-width: 1.5; }
  .off   { fill: #f2f4f6; stroke: #b9c4cd; stroke-width: 1.5; }
  .lbl   { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #55677a; letter-spacing: .06em; }
  .val   { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17212b; }
  .valm  { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #17212b; }
  .btxt  { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17212b; }
  .ptxt  { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
  .dim   { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8797a5; }
  .stat  { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #55677a; }
  .ok    { fill: #1a7f37; }
  .head  { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #2f5d7c; letter-spacing: .1em; }
  .note  { font: italic 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9a6a12; }
</style></defs>
  <rect width="720" height="150" fill="#ffffff"/>
  <rect class="pnl" x="10" y="10" width="700" height="130" rx="6"/>
  <rect class="bar" x="11" y="11" width="698" height="26" rx="5"/>
  <text class="head" x="24" y="28" text-anchor="start">PROJECT</text>
  <text class="head" x="696" y="28" text-anchor="end">▾  ↑  ↓</text>
  <text class="lbl" x="24" y="64" text-anchor="start">PROJECT</text>
  <rect class="field" x="78" y="48" width="150" height="24" rx="5"/>
  <text class="val" x="87" y="64" text-anchor="start">project1</text>
  <rect class="btn" x="236" y="49" width="22" height="22" rx="4"/>
  <text class="btxt" x="247" y="64" text-anchor="middle">+</text>
  <rect class="off" x="264" y="49" width="22" height="22" rx="4"/>
  <text class="dim" x="275" y="64" text-anchor="middle">−</text>
  <text class="lbl" x="300" y="64" text-anchor="start">PLATFORM</text>
  <rect class="field" x="368" y="48" width="130" height="24" rx="5"/>
  <text class="val" x="377" y="64" text-anchor="start">TEC-1G</text>
  <text class="dim" x="488" y="64" text-anchor="end">▾</text>
  <rect class="prim" x="510" y="48" width="90" height="24" rx="5"/>
  <text class="ptxt" x="555" y="64" text-anchor="middle">Initialize</text>
  <rect class="card" x="24" y="88" width="672" height="38" rx="6"/>
  <text class="val" x="40" y="112" text-anchor="start">Uninitialized Debug80 project</text>
</svg>
