<svg xmlns="http://www.w3.org/2000/svg" width="720" height="156" viewBox="0 0 720 156" role="img" aria-labelledby="t d">
  <title id="t">A breakpoint on an instruction line</title>
  <desc id="d">A red breakpoint dot in the editor gutter beside a LD instruction, with the paused line highlighted.</desc>
  <defs><style>
  .pnl   { fill: #ffffff; stroke: #2f5d7c; stroke-width: 2; }
  .bar   { fill: #eef4f9; stroke: #2f5d7c; stroke-width: 2; }
  .ctl   { fill: #f7fbff; stroke: #7d97ab; }
  .field { fill: #f7fbff; stroke: #7d97ab; stroke-width: 1.5; }
  .btn   { fill: #eef4f9; stroke: #2f5d7c; stroke-width: 1.5; }
  .prim  { fill: #2f5d7c; stroke: #2f5d7c; stroke-width: 1.5; }
  .card  { fill: #fff8e8; stroke: #9a6a12; stroke-width: 1.5; }
  .off   { fill: #f2f4f6; stroke: #b9c4cd; stroke-width: 1.5; }
  .lbl   { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #55677a; letter-spacing: .06em; }
  .val   { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17212b; }
  .valm  { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #17212b; }
  .btxt  { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17212b; }
  .ptxt  { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
  .dim   { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8797a5; }
  .stat  { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #55677a; }
  .ok    { fill: #1a7f37; }
  .head  { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #2f5d7c; letter-spacing: .1em; }
  .note  { font: italic 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9a6a12; }
</style></defs>
  <rect width="720" height="156" fill="#ffffff"/>
  <rect class="pnl" x="10" y="10" width="700" height="132" rx="6"/>
  <text class="dim" x="44" y="35" text-anchor="start"> 1</text>
  <text class="valm" x="72" y="35" text-anchor="start">ScanHello:</text>
  <rect class="bar" x="11" y="42" width="698" height="22" rx="0"/>
  <circle cx="28" cy="53" r="6" fill="#cf222e"/>
  <text class="dim" x="44" y="57" text-anchor="start"> 2</text>
  <text class="valm" x="72" y="57" text-anchor="start">        LD      DE,SevenSegHello</text>
  <text class="dim" x="44" y="79" text-anchor="start"> 3</text>
  <text class="valm" x="72" y="79" text-anchor="start">        LD      C,API_SCAN_SEGMENTS</text>
  <text class="dim" x="44" y="101" text-anchor="start"> 4</text>
  <text class="valm" x="72" y="101" text-anchor="start">        RST     0x10</text>
  <text class="dim" x="44" y="123" text-anchor="start"> 5</text>
  <text class="valm" x="72" y="123" text-anchor="start">        JR      ScanHello</text>
</svg>
