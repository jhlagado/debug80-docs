<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404" role="img" aria-labelledby="t d">
  <title id="t">The Displays section</title>
  <desc id="d">Two columns. Speed, mute and speaker controls with the status and memory-bank indicators sit above the GLCD on the left; the 8x8 RGB LED matrix and its scan readout occupy the right.</desc>
