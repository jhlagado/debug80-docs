<svg xmlns="http://www.w3.org/2000/svg" width="720" height="209" viewBox="0 0 720 209" role="img" aria-labelledby="t d">
  <title id="t">The Registers section</title>
  <desc id="d">Register pairs, the shadow set, PC and SP, with I and R shown read-only.</desc>
  <defs><style>
  .pnl   { fill: #ffffff; stroke: #2f5d7c; stroke-width: 2; }
  .bar   { fill: #eef4f9; stroke: #2f5d7c; stroke-width: 2; }
  .ctl   { fill: #f7fbff; stroke: #7d97ab; }
  .field { fill: #f7fbff; stroke: #7d97ab; stroke-width: 1.5; }
  .btn   { fill: #eef4f9; stroke: #2f5d7c; stroke-width: 1.5; }
  .prim  { fill: #2f5d7c; stroke: #2f5d7c; stroke-width: 1.5; }
  .card  { fill: #fff8e8; stroke: #9a6a12; stroke-width: 1.5; }
  .off   { fill: #f2f4f6; stroke: #b9c4cd; stroke-width: 1.5; }
  .lbl   { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #55677a; letter-spacing: .06em; }
  .val   { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17212b; }
  .valm  { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #17212b; }
  .btxt  { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17212b; }
  .ptxt  { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
  .dim   { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8797a5; }
  .stat  { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #55677a; }
  .ok    { fill: #1a7f37; }
  .head  { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #2f5d7c; letter-spacing: .1em; }
  .note  { font: italic 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9a6a12; }
</style></defs>
  <rect width="720" height="209" fill="#ffffff"/>
  <rect class="pnl" x="10" y="10" width="700" height="189" rx="6"/>
  <rect class="bar" x="11" y="11" width="698" height="26" rx="5"/>
  <text class="head" x="24" y="28" text-anchor="start">REGISTERS</text>
  <text class="head" x="696" y="28" text-anchor="end">▾  ↑  ↓</text>
  <text class="lbl" x="26" y="64" text-anchor="start">BC</text>
  <rect class="field" x="72" y="48" width="150" height="24" rx="5"/>
  <text class="valm" x="81" y="64" text-anchor="start">00 12</text>
  <text class="lbl" x="254" y="64" text-anchor="start">DE</text>
  <rect class="field" x="300" y="48" width="150" height="24" rx="5"/>
  <text class="valm" x="309" y="64" text-anchor="start">40 3E</text>
  <text class="lbl" x="482" y="64" text-anchor="start">HL</text>
  <rect class="field" x="528" y="48" width="150" height="24" rx="5"/>
  <text class="valm" x="537" y="64" text-anchor="start">40 30</text>
  <text class="lbl" x="26" y="94" text-anchor="start">BC'</text>
  <rect class="field" x="72" y="78" width="150" height="24" rx="5"/>
  <text class="valm" x="81" y="94" text-anchor="start">00 00</text>
  <text class="lbl" x="254" y="94" text-anchor="start">DE'</text>
  <rect class="field" x="300" y="78" width="150" height="24" rx="5"/>
  <text class="valm" x="309" y="94" text-anchor="start">00 00</text>
  <text class="lbl" x="482" y="94" text-anchor="start">HL'</text>
  <rect class="field" x="528" y="78" width="150" height="24" rx="5"/>
  <text class="valm" x="537" y="94" text-anchor="start">00 00</text>
  <text class="lbl" x="26" y="124" text-anchor="start">AF</text>
  <rect class="field" x="72" y="108" width="150" height="24" rx="5"/>
  <text class="valm" x="81" y="124" text-anchor="start">6E 44</text>
  <text class="lbl" x="254" y="124" text-anchor="start">IX</text>
  <rect class="field" x="300" y="108" width="150" height="24" rx="5"/>
  <text class="valm" x="309" y="124" text-anchor="start">00 00</text>
  <text class="lbl" x="482" y="124" text-anchor="start">IY</text>
  <rect class="field" x="528" y="108" width="150" height="24" rx="5"/>
  <text class="valm" x="537" y="124" text-anchor="start">00 00</text>
  <text class="lbl" x="26" y="154" text-anchor="start">PC</text>
  <rect class="field" x="72" y="138" width="150" height="24" rx="5"/>
  <text class="valm" x="81" y="154" text-anchor="start">40 12</text>
  <text class="lbl" x="254" y="154" text-anchor="start">SP</text>
  <rect class="field" x="300" y="138" width="150" height="24" rx="5"/>
  <text class="valm" x="309" y="154" text-anchor="start">3F F8</text>
  <text class="lbl" x="482" y="154" text-anchor="start">I / R</text>
  <rect class="off" x="528" y="138" width="150" height="24" rx="5"/>
  <text class="valm" x="537" y="154" text-anchor="start">00 / 3A</text>
  <text class="note" x="26" y="182" text-anchor="start">Every field except I and R is editable while the program is paused.</text>
</svg>
