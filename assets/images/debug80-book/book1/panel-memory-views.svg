<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="t d">
  <title id="t">The four Debug80 memory views</title>
  <desc id="d">Four independent memory views labelled A to D, anchored on PC, SP, HL and a symbol, each showing bytes around its anchor with an ASCII gutter.</desc>
  <defs><style>
  .pnl   { fill: #ffffff; stroke: #2f5d7c; stroke-width: 2; }
  .bar   { fill: #eef4f9; stroke: #2f5d7c; stroke-width: 2; }
  .ctl   { fill: #f7fbff; stroke: #7d97ab; }
  .field { fill: #f7fbff; stroke: #7d97ab; stroke-width: 1.5; }
  .btn   { fill: #eef4f9; stroke: #2f5d7c; stroke-width: 1.5; }
  .prim  { fill: #2f5d7c; stroke: #2f5d7c; stroke-width: 1.5; }
  .card  { fill: #fff8e8; stroke: #9a6a12; stroke-width: 1.5; }
  .off   { fill: #f2f4f6; stroke: #b9c4cd; stroke-width: 1.5; }
  .lbl   { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #55677a; letter-spacing: .06em; }
  .val   { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17212b; }
  .valm  { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #17212b; }
  .btxt  { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17212b; }
  .ptxt  { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
  .dim   { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8797a5; }
  .stat  { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #55677a; }
  .ok    { fill: #1a7f37; }
  .head  { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #2f5d7c; letter-spacing: .1em; }
  .note  { font: italic 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9a6a12; }
</style></defs>
  <rect width="720" height="250" fill="#ffffff"/>
  <rect class="pnl" x="10" y="10" width="700" height="230" rx="6"/>
  <rect class="bar" x="11" y="11" width="698" height="26" rx="5"/>
  <text class="head" x="24" y="28" text-anchor="start">MEMORY</text>
  <text class="head" x="696" y="28" text-anchor="end">▾  ↑  ↓</text>
  <text class="head" x="26" y="66" text-anchor="start">A</text>
  <rect class="field" x="44" y="50" width="150" height="24" rx="5"/>
  <text class="val" x="53" y="66" text-anchor="start">PC</text>
  <text class="dim" x="204" y="66" text-anchor="start">$4012</text>
  <rect class="off" x="258" y="50" width="300" height="24" rx="5"/>
  <text class="valm" x="268" y="66" text-anchor="start">3E 01 32 40 6E C7 C2 C2</text>
  <text class="stat" x="570" y="66" text-anchor="start">&gt;.2@n...</text>
  <text class="head" x="26" y="112" text-anchor="start">B</text>
  <rect class="field" x="44" y="96" width="150" height="24" rx="5"/>
  <text class="val" x="53" y="112" text-anchor="start">SP</text>
  <text class="dim" x="204" y="112" text-anchor="start">$3FF8</text>
  <rect class="off" x="258" y="96" width="300" height="24" rx="5"/>
  <text class="valm" x="268" y="112" text-anchor="start">00 00 40 00 12 40 00 00</text>
  <text class="stat" x="570" y="112" text-anchor="start">..@..@..</text>
  <text class="head" x="26" y="158" text-anchor="start">C</text>
  <rect class="field" x="44" y="142" width="150" height="24" rx="5"/>
  <text class="val" x="53" y="158" text-anchor="start">HL</text>
  <text class="dim" x="204" y="158" text-anchor="start">$4030</text>
  <rect class="off" x="258" y="142" width="300" height="24" rx="5"/>
  <text class="valm" x="268" y="158" text-anchor="start">44 65 62 75 67 38 30 20</text>
  <text class="stat" x="570" y="158" text-anchor="start">Debug80 </text>
  <text class="head" x="26" y="204" text-anchor="start">D</text>
  <rect class="field" x="44" y="188" width="150" height="24" rx="5"/>
  <text class="val" x="53" y="204" text-anchor="start">SevenSegHello</text>
  <text class="dim" x="204" y="204" text-anchor="start">$403E</text>
  <rect class="off" x="258" y="188" width="300" height="24" rx="5"/>
  <text class="valm" x="268" y="204" text-anchor="start">6E C7 C2 C2 EB 00 FF FF</text>
  <text class="stat" x="570" y="204" text-anchor="start">n.......</text>
</svg>
