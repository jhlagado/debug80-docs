<svg xmlns="http://www.w3.org/2000/svg" width="720" height="96" viewBox="0 0 720 96" role="img" aria-labelledby="t d">
  <title id="t">The VS Code debug toolbar</title>
  <desc id="d">Continue, Step Over, Step Into, Step Out, Restart and Stop, with their shortcuts.</desc>
  <defs><style>
  .pnl   { fill: #ffffff; stroke: #2f5d7c; stroke-width: 2; }
  .bar   { fill: #eef4f9; stroke: #2f5d7c; stroke-width: 2; }
  .ctl   { fill: #f7fbff; stroke: #7d97ab; }
  .field { fill: #f7fbff; stroke: #7d97ab; stroke-width: 1.5; }
  .btn   { fill: #eef4f9; stroke: #2f5d7c; stroke-width: 1.5; }
  .prim  { fill: #2f5d7c; stroke: #2f5d7c; stroke-width: 1.5; }
  .card  { fill: #fff8e8; stroke: #9a6a12; stroke-width: 1.5; }
  .off   { fill: #f2f4f6; stroke: #b9c4cd; stroke-width: 1.5; }
  .lbl   { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #55677a; letter-spacing: .06em; }
  .val   { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17212b; }
  .valm  { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #17212b; }
  .btxt  { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17212b; }
  .ptxt  { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
  .dim   { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8797a5; }
  .stat  { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #55677a; }
  .ok    { fill: #1a7f37; }
  .head  { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #2f5d7c; letter-spacing: .1em; }
  .note  { font: italic 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9a6a12; }
</style></defs>
  <rect width="720" height="96" fill="#ffffff"/>
  <rect class="pnl" x="10" y="24" width="700" height="48" rx="8"/>
  <rect class="btn" x="30" y="34" width="28" height="28" rx="5"/>
  <text class="btxt" x="44" y="53" text-anchor="middle">▶</text>
  <text class="dim" x="66" y="46" text-anchor="start">Continue</text>
  <text class="dim" x="66" y="60" text-anchor="start">F5</text>
  <rect class="btn" x="142" y="34" width="28" height="28" rx="5"/>
  <text class="btxt" x="156" y="53" text-anchor="middle">⤼</text>
  <text class="dim" x="178" y="46" text-anchor="start">Step Over</text>
  <text class="dim" x="178" y="60" text-anchor="start">F10</text>
  <rect class="btn" x="254" y="34" width="28" height="28" rx="5"/>
  <text class="btxt" x="268" y="53" text-anchor="middle">↓</text>
  <text class="dim" x="290" y="46" text-anchor="start">Step Into</text>
  <text class="dim" x="290" y="60" text-anchor="start">F11</text>
  <rect class="btn" x="366" y="34" width="28" height="28" rx="5"/>
  <text class="btxt" x="380" y="53" text-anchor="middle">↑</text>
  <text class="dim" x="402" y="46" text-anchor="start">Step Out</text>
  <text class="dim" x="402" y="60" text-anchor="start">⇧F11</text>
  <rect class="btn" x="478" y="34" width="28" height="28" rx="5"/>
  <text class="btxt" x="492" y="53" text-anchor="middle">⟳</text>
  <text class="dim" x="514" y="46" text-anchor="start">Restart</text>
  <rect class="btn" x="590" y="34" width="28" height="28" rx="5"/>
  <text class="btxt" x="604" y="53" text-anchor="middle">■</text>
  <text class="dim" x="626" y="46" text-anchor="start">Stop</text>
</svg>
