<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="t d">
  <title id="t">Debug80 panel after a successful build</title>
  <desc id="d">Project, target and stop-on-entry on one row; register contracts, contract updates and strict labels on the next; Test CoolTerm, Send to TEC-1G, Build and Run right-aligned below; then the source map and hardware status lines.</desc>
  <defs><style>
  .pnl   { fill: #ffffff; stroke: #2f5d7c; stroke-width: 2; }
  .bar   { fill: #eef4f9; stroke: #2f5d7c; stroke-width: 2; }
  .ctl   { fill: #f7fbff; stroke: #7d97ab; }
  .field { fill: #f7fbff; stroke: #7d97ab; stroke-width: 1.5; }
  .btn   { fill: #eef4f9; stroke: #2f5d7c; stroke-width: 1.5; }
  .prim  { fill: #2f5d7c; stroke: #2f5d7c; stroke-width: 1.5; }
  .card  { fill: #fff8e8; stroke: #9a6a12; stroke-width: 1.5; }
  .off   { fill: #f2f4f6; stroke: #b9c4cd; stroke-width: 1.5; }
  .lbl   { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #55677a; letter-spacing: .06em; }
  .val   { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17212b; }
  .valm  { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #17212b; }
  .btxt  { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17212b; }
  .ptxt  { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
  .dim   { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8797a5; }
  .stat  { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #55677a; }
  .ok    { fill: #1a7f37; }
  .head  { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #2f5d7c; letter-spacing: .1em; }
  .note  { font: italic 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9a6a12; }
</style></defs>
  <rect width="720" height="250" fill="#ffffff"/>
  <rect class="pnl" x="10" y="10" width="700" height="230" rx="6"/>
  <rect class="bar" x="11" y="11" width="698" height="26" rx="5"/>
  <text class="head" x="24" y="28" text-anchor="start">PROJECT</text>
  <text class="head" x="696" y="28" text-anchor="end">▾  ↑  ↓</text>
  <text class="lbl" x="26" y="64" text-anchor="start">PROJECT</text>
  <rect class="field" x="84" y="48" width="120" height="24" rx="5"/>
  <text class="val" x="93" y="64" text-anchor="start">project1</text>
  <rect class="btn" x="208" y="49" width="22" height="22" rx="4"/>
  <text class="btxt" x="219" y="64" text-anchor="middle">+</text>
  <rect class="btn" x="234" y="49" width="22" height="22" rx="4"/>
  <text class="btxt" x="245" y="64" text-anchor="middle">−</text>
  <text class="lbl" x="264" y="64" text-anchor="start">TARGET</text>
  <rect class="field" x="314" y="48" width="120" height="24" rx="5"/>
  <text class="val" x="323" y="64" text-anchor="start">main</text>
  <text class="dim" x="424" y="64" text-anchor="end">▾</text>
  <rect class="btn" x="438" y="49" width="22" height="22" rx="4"/>
  <text class="btxt" x="449" y="64" text-anchor="middle">+</text>
  <rect class="btn" x="464" y="49" width="22" height="22" rx="4"/>
  <text class="btxt" x="475" y="64" text-anchor="middle">−</text>
  <rect class="field" x="496" y="50" width="14" height="14" rx="3"/>
  <text class="lbl" x="518" y="64" text-anchor="start">STOP ON ENTRY</text>
  <text class="lbl" x="26" y="100" text-anchor="start">REGISTER CONTRACTS</text>
  <rect class="field" x="150" y="84" width="92" height="24" rx="5"/>
  <text class="val" x="159" y="100" text-anchor="start">Enforce</text>
  <text class="dim" x="232" y="100" text-anchor="end">▾</text>
  <text class="lbl" x="252" y="100" text-anchor="start">CONTRACT UPDATES</text>
  <rect class="field" x="364" y="84" width="76" height="24" rx="5"/>
  <text class="val" x="373" y="100" text-anchor="start">Ask</text>
  <text class="dim" x="430" y="100" text-anchor="end">▾</text>
  <rect class="prim" x="452" y="86" width="14" height="14" rx="3"/>
  <text class="ptxt" x="459" y="97" text-anchor="middle">✓</text>
  <text class="lbl" x="474" y="100" text-anchor="start">STRICT LABELS</text>
  <rect class="btn" x="324" y="122" width="100" height="24" rx="5"/>
  <text class="btxt" x="374" y="138" text-anchor="middle">Test CoolTerm</text>
  <rect class="btn" x="432" y="122" width="112" height="24" rx="5"/>
  <text class="btxt" x="488" y="138" text-anchor="middle">Send to TEC-1G</text>
  <rect class="btn" x="552" y="122" width="60" height="24" rx="5"/>
  <text class="btxt" x="582" y="138" text-anchor="middle">Build</text>
  <rect class="btn" x="622" y="121" width="72" height="26" rx="13"/>
  <text class="btxt" x="658" y="138" text-anchor="middle">Run</text>
  <text class="stat ok" x="26" y="178" text-anchor="start">Build succeeded: build/main.hex</text>
  <text class="stat" x="26" y="202" text-anchor="start">Source map: current.</text>
  <text class="stat" x="26" y="226" text-anchor="start">Ready to send main.hex via CoolTerm.</text>
</svg>
