<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-labelledby="t d">
  <title id="t">Where the Debug80 panel appears in the Run and Debug sidebar</title>
  <desc id="d">The Run and Debug sidebar shows a RUN section filling most of the space with a collapsed DEBUG80 section beneath it.</desc>
  <defs><style>
  .pnl   { fill: #ffffff; stroke: #2f5d7c; stroke-width: 2; }
  .bar   { fill: #eef4f9; stroke: #2f5d7c; stroke-width: 2; }
  .ctl   { fill: #f7fbff; stroke: #7d97ab; }
  .field { fill: #f7fbff; stroke: #7d97ab; stroke-width: 1.5; }
  .btn   { fill: #eef4f9; stroke: #2f5d7c; stroke-width: 1.5; }
  .prim  { fill: #2f5d7c; stroke: #2f5d7c; stroke-width: 1.5; }
  .card  { fill: #fff8e8; stroke: #9a6a12; stroke-width: 1.5; }
  .off   { fill: #f2f4f6; stroke: #b9c4cd; stroke-width: 1.5; }
  .lbl   { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #55677a; letter-spacing: .06em; }
  .val   { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17212b; }
  .valm  { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #17212b; }
  .btxt  { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17212b; }
  .ptxt  { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
  .dim   { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8797a5; }
  .stat  { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #55677a; }
  .ok    { fill: #1a7f37; }
  .head  { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #2f5d7c; letter-spacing: .1em; }
  .note  { font: italic 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9a6a12; }
</style></defs>
  <rect width="720" height="230" fill="#ffffff"/>
  <rect class="pnl" x="10" y="10" width="300" height="210" rx="6"/>
  <rect class="bar" x="11" y="11" width="298" height="26" rx="5"/>
  <text class="head" x="24" y="28" text-anchor="start">RUN AND DEBUG</text>
  <text class="lbl" x="26" y="60" text-anchor="start">▾  RUN</text>
  <rect class="field" x="26" y="72" width="268" height="96" rx="5"/>
  <text class="dim" x="40" y="100" text-anchor="start">Open a file which can be</text>
  <text class="dim" x="40" y="118" text-anchor="start">debugged or run.</text>
  <rect class="prim" x="40" y="136" width="120" height="24" rx="5"/>
  <text class="ptxt" x="100" y="152" text-anchor="middle">Run and Debug</text>
  <rect class="card" x="26" y="178" width="268" height="28" rx="5"/>
  <text class="lbl" x="40" y="196" text-anchor="start">▸  DEBUG80</text>
  <text class="note" x="330" y="190" text-anchor="start">Collapsed at the bottom</text>
  <text class="note" x="330" y="208" text-anchor="start">on a fresh install.</text>
</svg>
