<svg xmlns="http://www.w3.org/2000/svg" width="720" height="204" viewBox="0 0 720 204" role="img" aria-labelledby="t d">
  <title id="t">The Joystick section</title>
  <desc id="d">A D-pad with Fire 1, Fire 2, Fire 3 and Aux buttons, and a Move and Fire mode toggle.</desc>
  <defs><style>
  .pnl   { fill: #ffffff; stroke: #2f5d7c; stroke-width: 2; }
  .bar   { fill: #eef4f9; stroke: #2f5d7c; stroke-width: 2; }
  .ctl   { fill: #f7fbff; stroke: #7d97ab; }
  .field { fill: #f7fbff; stroke: #7d97ab; stroke-width: 1.5; }
  .btn   { fill: #eef4f9; stroke: #2f5d7c; stroke-width: 1.5; }
  .prim  { fill: #2f5d7c; stroke: #2f5d7c; stroke-width: 1.5; }
  .card  { fill: #fff8e8; stroke: #9a6a12; stroke-width: 1.5; }
  .off   { fill: #f2f4f6; stroke: #b9c4cd; stroke-width: 1.5; }
  .lbl   { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #55677a; letter-spacing: .06em; }
  .val   { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17212b; }
  .valm  { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #17212b; }
  .btxt  { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17212b; }
  .ptxt  { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
  .dim   { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8797a5; }
  .stat  { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #55677a; }
  .ok    { fill: #1a7f37; }
  .head  { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #2f5d7c; letter-spacing: .1em; }
  .note  { font: italic 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9a6a12; }
</style></defs>
  <rect width="720" height="204" fill="#ffffff"/>
  <rect class="pnl" x="10" y="10" width="700" height="184" rx="6"/>
  <rect class="bar" x="11" y="11" width="698" height="26" rx="5"/>
  <text class="head" x="24" y="28" text-anchor="start">JOYSTICK</text>
  <text class="head" x="696" y="28" text-anchor="end">▾  ↑  ↓</text>
  <rect class="btn" x="26" y="48" width="66" height="24" rx="4"/>
  <text class="btxt" x="59" y="64" text-anchor="middle">Move</text>
  <rect class="off" x="102" y="48" width="66" height="24" rx="4"/>
  <text class="dim" x="135" y="64" text-anchor="middle">Fire</text>
  <rect class="btn" x="92" y="92" width="44" height="34" rx="5"/>
  <text class="btxt" x="114" y="114" text-anchor="middle">▲</text>
  <rect class="btn" x="40" y="130" width="44" height="34" rx="5"/>
  <text class="btxt" x="62" y="152" text-anchor="middle">◀</text>
  <rect class="btn" x="144" y="130" width="44" height="34" rx="5"/>
  <text class="btxt" x="166" y="152" text-anchor="middle">▶</text>
  <rect class="btn" x="92" y="130" width="44" height="34" rx="5"/>
  <text class="btxt" x="114" y="152" text-anchor="middle">▼</text>
  <rect class="btn" x="260" y="100" width="92" height="34" rx="5"/>
  <text class="btxt" x="306" y="122" text-anchor="middle">Fire 1</text>
  <rect class="btn" x="364" y="100" width="92" height="34" rx="5"/>
  <text class="btxt" x="410" y="122" text-anchor="middle">Fire 2</text>
  <rect class="btn" x="468" y="100" width="92" height="34" rx="5"/>
  <text class="btxt" x="514" y="122" text-anchor="middle">Fire 3</text>
  <rect class="btn" x="572" y="100" width="92" height="34" rx="5"/>
  <text class="btxt" x="618" y="122" text-anchor="middle">Aux</text>
  <text class="note" x="26" y="178" text-anchor="start">W A S D steer; J or Space is Fire 1. An open Joystick section outranks the keypad.</text>
</svg>
