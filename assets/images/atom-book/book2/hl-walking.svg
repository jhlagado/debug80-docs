<svg xmlns="http://www.w3.org/2000/svg" width="720" height="216" viewBox="0 0 720 216" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">HL walking a byte table</title>
  <desc id="figDesc">The eight-byte table 23, 47, 91, 5, 67, 12, 88, 34 with HL shown under the first byte and again three increments later.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="56" y="28" text-anchor="start" xml:space="preserve">VALUES</text>
  <rect class="bx" x="56" y="46" width="68" height="32" rx="2"/>
  <text class="t" x="90" y="66.5" text-anchor="middle" xml:space="preserve">23</text>
  <text class="dim" x="90" y="39" text-anchor="middle" xml:space="preserve">$8000</text>
  <rect class="bx" x="124" y="46" width="68" height="32" rx="2"/>
  <text class="t" x="158" y="66.5" text-anchor="middle" xml:space="preserve">47</text>
  <rect class="bx" x="192" y="46" width="68" height="32" rx="2"/>
  <text class="t" x="226" y="66.5" text-anchor="middle" xml:space="preserve">91</text>
  <text class="dim" x="226" y="39" text-anchor="middle" xml:space="preserve">$8002</text>
  <rect class="bxs" x="260" y="46" width="68" height="32" rx="2"/>
  <text class="tb" x="294" y="66.5" text-anchor="middle" xml:space="preserve">5</text>
  <rect class="bx" x="328" y="46" width="68" height="32" rx="2"/>
  <text class="t" x="362" y="66.5" text-anchor="middle" xml:space="preserve">67</text>
  <text class="dim" x="362" y="39" text-anchor="middle" xml:space="preserve">$8004</text>
  <rect class="bx" x="396" y="46" width="68" height="32" rx="2"/>
  <text class="t" x="430" y="66.5" text-anchor="middle" xml:space="preserve">12</text>
  <rect class="bx" x="464" y="46" width="68" height="32" rx="2"/>
  <text class="t" x="498" y="66.5" text-anchor="middle" xml:space="preserve">88</text>
  <text class="dim" x="498" y="39" text-anchor="middle" xml:space="preserve">$8006</text>
  <rect class="bx" x="532" y="46" width="68" height="32" rx="2"/>
  <text class="t" x="566" y="66.5" text-anchor="middle" xml:space="preserve">34</text>
  <line class="sline" x1="90" y1="118" x2="90" y2="88" marker-end="url(#arS)"/>
  <text class="cap" x="74" y="134" text-anchor="start" xml:space="preserve">HL</text>
  <text class="dimn" x="112" y="132" text-anchor="start" xml:space="preserve">on entry</text>
  <line class="sline" x1="294" y1="118" x2="294" y2="88" marker-end="url(#arS)"/>
  <text class="cap" x="278" y="134" text-anchor="start" xml:space="preserve">HL</text>
  <text class="dimn" x="316" y="132" text-anchor="start" xml:space="preserve">after three inc hl</text>
  <text class="ts" x="56" y="172" text-anchor="start" xml:space="preserve">ld a, (hl)      ; read the byte HL points at</text>
  <text class="ts" x="56" y="192" text-anchor="start" xml:space="preserve">inc hl          ; move to the next one</text>
  <text class="dimn" x="56" y="208" text-anchor="start" xml:space="preserve">HL holds an address. (hl) is the byte at that address. Getting those two confused is the most common mistake here.</text>
</svg>
