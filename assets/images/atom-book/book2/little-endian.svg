<svg xmlns="http://www.w3.org/2000/svg" width="720" height="286" viewBox="0 0 720 286" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Little-endian byte order</title>
  <desc id="figDesc">The value $8000 split into a high byte $80 and a low byte $00, with two crossing arrows showing the low byte going to the lower address and the high byte to the higher one.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="46" y="30" text-anchor="start" xml:space="preserve">THE VALUE</text>
  <text class="dim" x="126" y="52" text-anchor="middle" xml:space="preserve">high $80</text>
  <text class="dim" x="216" y="52" text-anchor="middle" xml:space="preserve">low $00</text>
  <rect class="bx" x="86" y="62" width="170" height="36" rx="2"/>
  <text class="tb" x="171" y="86" text-anchor="middle" xml:space="preserve">$8000</text>
  <path class="sline" d="M216,104 C216,136 126,136 126,166" marker-end="url(#arS)"/>
  <path class="sline" d="M126,104 C126,136 216,136 216,166" marker-end="url(#arS)"/>
  <rect class="bxs" x="86" y="172" width="85" height="36" rx="2"/>
  <text class="tb" x="128" y="196" text-anchor="middle" xml:space="preserve">00</text>
  <rect class="bx" x="171" y="172" width="85" height="36" rx="2"/>
  <text class="t" x="214" y="196" text-anchor="middle" xml:space="preserve">80</text>
  <text class="dim" x="128" y="228" text-anchor="middle" xml:space="preserve">$0007</text>
  <text class="dim" x="214" y="228" text-anchor="middle" xml:space="preserve">$0008</text>
  <text class="cap" x="300" y="196" text-anchor="start" xml:space="preserve">IN MEMORY</text>
  <text class="dimn" x="300" y="220" text-anchor="start" xml:space="preserve">low byte at the lower address</text>
  <text class="dimn" x="46" y="262" text-anchor="start" xml:space="preserve">So ld ($8000), a assembles to 32 00 80. The swap is in how the address is encoded, not in the value itself.</text>
  <text class="dimn" x="46" y="280" text-anchor="start" xml:space="preserve">Every 16-bit value the Z80 reads or writes uses this order.</text>
</svg>
