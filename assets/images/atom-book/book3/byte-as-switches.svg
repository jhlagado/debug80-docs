<svg xmlns="http://www.w3.org/2000/svg" width="720" height="268" viewBox="0 0 720 268" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">The device status byte as eight named switches</title>
  <desc id="figDesc">The byte $05 shown as eight bits with bit 0 named READY and bit 2 named BUSY both set, bit 1 named ERROR clear, and bits 3 to 7 unused.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="60" y="30" text-anchor="start" xml:space="preserve">DEVICE_FLAGS AT $8000, $05 AT RESET</text>
  <rect class="bx" x="60" y="54" width="74" height="34" rx="2"/>
  <text class="t" x="97" y="75.5" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dim" x="97" y="47" text-anchor="middle" xml:space="preserve">7</text>
  <rect class="bx" x="134" y="54" width="74" height="34" rx="2"/>
  <text class="t" x="171" y="75.5" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dim" x="171" y="47" text-anchor="middle" xml:space="preserve">6</text>
  <rect class="bx" x="208" y="54" width="74" height="34" rx="2"/>
  <text class="t" x="245" y="75.5" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dim" x="245" y="47" text-anchor="middle" xml:space="preserve">5</text>
  <rect class="bx" x="282" y="54" width="74" height="34" rx="2"/>
  <text class="t" x="319" y="75.5" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dim" x="319" y="47" text-anchor="middle" xml:space="preserve">4</text>
  <rect class="bx" x="356" y="54" width="74" height="34" rx="2"/>
  <text class="t" x="393" y="75.5" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dim" x="393" y="47" text-anchor="middle" xml:space="preserve">3</text>
  <rect class="bxs" x="430" y="54" width="74" height="34" rx="2"/>
  <text class="tb" x="467" y="75.5" text-anchor="middle" xml:space="preserve">1</text>
  <text class="dim" x="467" y="47" text-anchor="middle" xml:space="preserve">2</text>
  <text class="dimn" x="467" y="102" text-anchor="middle" xml:space="preserve">BUSY</text>
  <rect class="bx" x="504" y="54" width="74" height="34" rx="2"/>
  <text class="t" x="541" y="75.5" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dim" x="541" y="47" text-anchor="middle" xml:space="preserve">1</text>
  <text class="dimn" x="541" y="102" text-anchor="middle" xml:space="preserve">ERROR</text>
  <rect class="bxs" x="578" y="54" width="74" height="34" rx="2"/>
  <text class="tb" x="615" y="75.5" text-anchor="middle" xml:space="preserve">1</text>
  <text class="dim" x="615" y="47" text-anchor="middle" xml:space="preserve">0</text>
  <text class="dimn" x="615" y="102" text-anchor="middle" xml:space="preserve">READY</text>
  <text class="t" x="60" y="158" text-anchor="start" xml:space="preserve">FLAG_READY .equ $01</text>
  <text class="dim" x="260" y="158" text-anchor="start" xml:space="preserve">bit 0</text>
  <text class="dimn" x="320" y="158" text-anchor="start" xml:space="preserve">set at reset</text>
  <text class="t" x="60" y="180" text-anchor="start" xml:space="preserve">FLAG_ERROR .equ $02</text>
  <text class="dim" x="260" y="180" text-anchor="start" xml:space="preserve">bit 1</text>
  <text class="dimn" x="320" y="180" text-anchor="start" xml:space="preserve">clear at reset</text>
  <text class="t" x="60" y="202" text-anchor="start" xml:space="preserve">FLAG_BUSY  .equ $04</text>
  <text class="dim" x="260" y="202" text-anchor="start" xml:space="preserve">bit 2</text>
  <text class="dimn" x="320" y="202" text-anchor="start" xml:space="preserve">set at reset</text>
  <text class="dimn" x="60" y="250" text-anchor="start" xml:space="preserve">A mask is a value, not an address. The eight switches cost one byte of RAM instead of eight.</text>
</svg>
