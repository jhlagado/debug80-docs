<svg xmlns="http://www.w3.org/2000/svg" width="720" height="306" viewBox="0 0 720 306" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Length against capacity</title>
  <desc id="figDesc">The six bytes 48 45 4C 4C 4F 00 at $8000 with a length bracket over the five characters, and the eight reserved bytes of buffer at $8006 with a capacity bracket.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="62" y="28" text-anchor="start" xml:space="preserve">MESSAGE</text>
  <path class="rule" d="M62,72 V62 H332 V72"/>
  <text class="dimn" x="197" y="57" text-anchor="middle" xml:space="preserve">length = 5, what strlen_u8 counts</text>
  <rect class="bx" x="62" y="90" width="54" height="34" rx="2"/>
  <text class="t" x="89" y="111.5" text-anchor="middle" xml:space="preserve">48</text>
  <text class="dim" x="89" y="83" text-anchor="middle" xml:space="preserve">$8000</text>
  <text class="dimn" x="89" y="138" text-anchor="middle" xml:space="preserve">H</text>
  <rect class="bx" x="116" y="90" width="54" height="34" rx="2"/>
  <text class="t" x="143" y="111.5" text-anchor="middle" xml:space="preserve">45</text>
  <text class="dim" x="143" y="83" text-anchor="middle" xml:space="preserve">$8001</text>
  <text class="dimn" x="143" y="138" text-anchor="middle" xml:space="preserve">E</text>
  <rect class="bx" x="170" y="90" width="54" height="34" rx="2"/>
  <text class="t" x="197" y="111.5" text-anchor="middle" xml:space="preserve">4C</text>
  <text class="dim" x="197" y="83" text-anchor="middle" xml:space="preserve">$8002</text>
  <text class="dimn" x="197" y="138" text-anchor="middle" xml:space="preserve">L</text>
  <rect class="bx" x="224" y="90" width="54" height="34" rx="2"/>
  <text class="t" x="251" y="111.5" text-anchor="middle" xml:space="preserve">4C</text>
  <text class="dim" x="251" y="83" text-anchor="middle" xml:space="preserve">$8003</text>
  <text class="dimn" x="251" y="138" text-anchor="middle" xml:space="preserve">L</text>
  <rect class="bx" x="278" y="90" width="54" height="34" rx="2"/>
  <text class="t" x="305" y="111.5" text-anchor="middle" xml:space="preserve">4F</text>
  <text class="dim" x="305" y="83" text-anchor="middle" xml:space="preserve">$8004</text>
  <text class="dimn" x="305" y="138" text-anchor="middle" xml:space="preserve">O</text>
  <rect class="bxs" x="332" y="90" width="54" height="34" rx="2"/>
  <text class="tb" x="359" y="111.5" text-anchor="middle" xml:space="preserve">00</text>
  <text class="dim" x="359" y="83" text-anchor="middle" xml:space="preserve">$8005</text>
  <text class="dimn" x="359" y="138" text-anchor="middle" xml:space="preserve">NUL</text>
  <text class="cap" x="62" y="182" text-anchor="start" xml:space="preserve">BUFFER</text>
  <path class="rule" d="M62,226 V216 H494 V226"/>
  <text class="dimn" x="278" y="211" text-anchor="middle" xml:space="preserve">capacity = 8, what .ds byte[8] reserved</text>
  <rect class="bx" x="62" y="244" width="54" height="34" rx="2"/>
  <text class="t" x="89" y="265.5" text-anchor="middle" xml:space="preserve"></text>
  <text class="dim" x="89" y="237" text-anchor="middle" xml:space="preserve">$8006</text>
  <rect class="bx" x="116" y="244" width="54" height="34" rx="2"/>
  <text class="t" x="143" y="265.5" text-anchor="middle" xml:space="preserve"></text>
  <rect class="bx" x="170" y="244" width="54" height="34" rx="2"/>
  <text class="t" x="197" y="265.5" text-anchor="middle" xml:space="preserve"></text>
  <text class="dim" x="197" y="237" text-anchor="middle" xml:space="preserve">$8008</text>
  <rect class="bx" x="224" y="244" width="54" height="34" rx="2"/>
  <text class="t" x="251" y="265.5" text-anchor="middle" xml:space="preserve"></text>
  <rect class="bx" x="278" y="244" width="54" height="34" rx="2"/>
  <text class="t" x="305" y="265.5" text-anchor="middle" xml:space="preserve"></text>
  <text class="dim" x="305" y="237" text-anchor="middle" xml:space="preserve">$800A</text>
  <rect class="bx" x="332" y="244" width="54" height="34" rx="2"/>
  <text class="t" x="359" y="265.5" text-anchor="middle" xml:space="preserve"></text>
  <rect class="bx" x="386" y="244" width="54" height="34" rx="2"/>
  <text class="t" x="413" y="265.5" text-anchor="middle" xml:space="preserve"></text>
  <text class="dim" x="413" y="237" text-anchor="middle" xml:space="preserve">$800C</text>
  <rect class="bx" x="440" y="244" width="54" height="34" rx="2"/>
  <text class="t" x="467" y="265.5" text-anchor="middle" xml:space="preserve"></text>
  <text class="dimn" x="400" y="122" text-anchor="start" xml:space="preserve">The terminator is not part of the</text>
  <text class="dimn" x="400" y="140" text-anchor="start" xml:space="preserve">text. It is the only thing that says</text>
  <text class="dimn" x="400" y="158" text-anchor="start" xml:space="preserve">where the text ends.</text>
</svg>
